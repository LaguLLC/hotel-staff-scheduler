name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp icon version into all files
        run: |
          VERSION=$(cat VERSION)
          echo "Using icon version: $VERSION"
          sed -i "s/__ICONV__/$VERSION/g" index.html
          sed -i "s/__ICONV__/$VERSION/g" manifest.json
          sed -i "s/__ICONV__/$VERSION/g" sw.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
