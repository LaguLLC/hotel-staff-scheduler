<details><summary style="cursor:pointer"><b>Paycom / Dayforce / Hotlink integration status</b> <span class="muted">(click to expand)</span></summary>
<ul class="small">
<li><b>Paycom access:</b> no public self-serve API — genuine integration requires a paid commercial agreement with Paycom (typically several thousand dollars per year, based on published third-party integration research), separate from whatever base modules (payroll, time &amp; attendance, biometric clocks) the hotel already has — nothing found confirms that purchasing biometric hardware includes or waives this separate agreement, so it should be confirmed directly with Paycom's own sales team rather than assumed either way. Even with that agreement, Paycom's own primary data-exchange mechanism is file-based (scheduled SFTP/CSV drops, or a manually-run export/import) rather than a live, real-time API call — a genuine, structural limit on how "live" any Paycom connection could ever be, not a gap this app's own design could work around.</li>
<li><b>Can this app auto-push to Paycom and back?</b> No — plainly, not today, and not without that same paid agreement regardless of which side builds what. What IS genuinely possible, using Paycom's own confirmed FILE-BASED mechanism rather than its paid API, is a manual, periodic file round-trip (not a live sync) — the two halves of it:</li>
<li><b>Payroll &amp; Time (CSV) export</b> (Settings → Export…) — one row per person per day (REG/OT hours, or the leave code for a leave day), giving whoever manages Paycom the underlying data for a one-time, Paycom-rep-assisted bulk-import column mapping. Generic (not a certified template); leave-day hours are an estimate (7.5h); pay-rate inclusion is opt-in per export, since Paycom itself restricts pay-rate visibility by role. This is the OUT-bound half of the round-trip — this app's planned/actual hours flowing toward Paycom.</li>
<li><b>Import actual hours from Paycom (CSV)</b> (Settings → Backup &amp; versions…) — reads a timecard/punch-history file actually exported FROM Paycom (Name, Date, and either Hours or Time In/Out — several common header spellings recognized) and brings the real, Paycom-confirmed clocked hours back into this app as actual-hours overrides, matched by name, without touching any planned shift/assignment cell. This is the IN-bound half — closing a direction that had no path at all before. Together, export-out and import-back form a real, working file round-trip; the SCHEDULING side specifically (this app's planned shifts flowing automatically INTO Paycom, so a scheduler never has to retype them there) still has no self-serve path at all — only the actual-hours side does now.</li>
<li><b>Dayforce — what "sync" would actually mean:</b> to be direct about a question worth answering plainly — no, nothing about this app and Paycom (or Dayforce) already syncs with each other automatically today. What is genuinely true: Dayforce publishes a real, documented public REST API (OAuth 2.0 client-credentials, base URL pattern <code>https://{company}.dayforcehcm.com/Api/{company}/V1</code>, with real Employee/Employment/Location/Group objects and dedicated scheduling-availability endpoints) — a fundamentally more open integration surface than Paycom's paid-agreement-gated one. If/when the hotel's own planned Dayforce migration happens, building a genuine, automatic two-way connection between this app and Dayforce specifically (not Paycom) becomes realistically buildable using that public API, without needing anything like Paycom's several-thousand-dollar commercial agreement — but that remains a future build contingent on the migration actually happening, not something in place now.</li>
<li><b>Hotlink:</b> a strong, but not fully confirmed, match — Amadeus HotSOS. The hotel's own description (Housekeeping gets room assignments pushed to iPhones; Front Office and Engineering separately use the same system to route guest-facing job/work-order requests) matches HotSOS's own documented feature set unusually well — most competing hospitality tools cover only maintenance work orders, not housekeeping room assignment, in the same platform. Separately confirmed: Dusit-branded Guam properties are listed with real Amadeus GDS chain codes on Dusit's own travel-agent page, though that's Amadeus's distribution/GDS product line, a different product from HotSOS — a shared parent company alone doesn't confirm this specific one.</li>
<li><b>If Hotlink is confirmed to be HotSOS, what integration is possible, and what would Amadeus API credentials cost:</b> HotSOS, like Paycom, has no public self-serve API or developer portal — real API access exists only for properties that already hold credentials obtained through their own Amadeus Implementation Project Manager, a direct relationship this app has no visibility into. On cost specifically: Amadeus doesn't publish a fixed price list for this — published third-party research on comparable Amadeus API access describes setup/provisioning fees typically in the $5,000–$25,000 range, plus the base HotSOS software subscription itself (estimated $20–45 per user per month, separately, per independent software-comparison research), plus its own implementation/setup fee (roughly $1,000–10,000+, scaling with property size and customization). These are third-party estimates, not an Amadeus-confirmed quote for this specific property — an actual number would need to come directly from Amadeus/HotSOS sales. What IS confirmed, built-in, and usable without any of that: HotSOS's own service-orders list has a native "Download As Excel" export — the same kind of file-based round-trip already established as the realistic path for Paycom, letting HotSOS's own exported work-order history be reviewed alongside this app's schedule for cross-referencing, without needing API access at all. A live push of this app's own schedule data INTO HotSOS (e.g. auto-assigning rooms) is not possible without that same direct Amadeus IT relationship and credential set.</li>
<li><b>Could this app replicate Hotlink's own functions directly, without Hotlink at all — broken down by what Hotlink actually does, and what Web Push actually is:</b>
  <ul>
    <li><i>Hotlink's confirmed functions, one at a time:</i> (1) Housekeeping — pushes a Room Attendant's assigned rooms for the day to their iPhone; (2) Front Office/Engineering — routes a guest-facing job/work-order request (e.g. a burnt-out lightbulb) from whoever takes the guest's call to the right department/technician; (3) auto-sending the weekly schedule itself (confirmed as Housekeeping-specific — "they're the only ones" who use Hotlink for that particular function, per the hotel's own description).</li>
    <li><i>What "Web Push" concretely is and how it would work here, step by step:</i> a real, open web browser standard (not a Hotlink-specific technology) with three pieces — (a) a small background script (a "service worker") installed once when a staff member adds this app to their phone's Home Screen; (b) a "push subscription," a unique address the phone registers with Apple's/Google's own push relay servers, which this app would store per staff member; (c) sending a push means this app's own server-side code calls that stored address with a short message ("Room Attendant 4th floor: 12 rooms assigned"), and the phone's OS displays it as a notification even if the app itself isn't open. No SMS/phone-number involved at all — it rides entirely over the same internet connection the phone already uses for anything else.</li>
    <li><i>Function 1 (Housekeeping room-assignment push) — genuinely buildable, with a real scope limit:</i> this app already tracks each Room Attendant's assigned FLOOR/ZONE per day (see the Room Assignments export above) — pushing "you're assigned the 4th floor today" the moment a schedule is saved is a straightforward extension of that existing data. What this app still cannot do on its own: push individual ROOM NUMBERS, since it has no PMS connection at all — that half would need to come from wherever Hotlink itself currently gets room numbers from (the property's PMS), a separate integration this app doesn't have visibility into.</li>
    <li><i>Function 2 (Front Office/Engineering job-request routing) — a genuinely different kind of feature, not yet designed:</i> this isn't a push notification problem at all — it needs a small request-intake form (what's wrong, which room, submitted by whom) plus a routing rule (which technician/department gets notified), which this app has no equivalent of today; this would be new functionality, not just "add push to something that already exists" the way Function 1 is.</li>
    <li><i>Cost:</i> the Web Push standard itself has no per-message or per-user fee — it's a free, open browser API, not a paid Hotlink-style product. Commercial push SERVICES that add analytics/segmentation on top of the raw standard typically run $0–200/month at small/midsize scale (independent pricing research), but aren't required for a basic assignment-push like Function 1.</li>
    <li><i>The genuine catch, specific to the iPhones already in use here:</i> iOS Safari has only supported web push since version 16.4, and only once the site is installed to the Home Screen as a Progressive Web App (PWA) — a real, one-time "Add to Home Screen" step needed on each staff member's own phone; it doesn't work from a plain browser tab the way it already does on desktop/Android.</li>
    <li><i>Bottom line:</i> Function 1 (room/floor-assignment push) is genuinely buildable on top of what this app already tracks, with real engineering work and a real per-phone setup step — not a zero-cost, zero-effort substitute for Hotlink. Function 2 (job-request routing) would be new functionality built from scratch, not an extension of anything this app currently does.</li>
    <li><i>Function 3 (new this round, per direct question — "can the app give a push notification to a staff phone if not clocked in at scheduled time?"): yes, using the exact same Web Push mechanism described above, but with a genuine additional piece of infrastructure this app does not currently have at all.</i> This app has no server of its own — every one of its actions today runs client-side, triggered directly by someone physically using the app in a browser (clicking Clock in, editing a cell, etc.). A "notify me if I haven't clocked in by my shift's start time" feature is fundamentally different: it needs to fire on ITS OWN, at a specific moment, whether or not anyone happens to have the app open right then — which requires something running on a schedule, independent of any user action, to check "has this person's shift started, with still no clock-in?" and fire the push at that moment. The realistic path: a small serverless scheduled function (e.g. a Supabase Edge Function on a cron trigger, running every few minutes) that queries the same NOT CLOCKED IN condition this app's own Checks panel already computes, and calls the Web Push relay directly for anyone it finds. This is a genuinely buildable feature — the underlying "who's late" LOGIC already exists in this app today (see the NOT CLOCKED IN flag) — but it is real, additional infrastructure (a scheduled server-side function, plus the push-subscription storage Function 1 already needs), not something that can run purely from this static HTML file the way every other feature in this app does.</li>
  </ul>
</li>
<li><b>Which of the hotel's own Paycom complaints can be fixed inside Paycom itself:</b> the "restricted to two people" access complaint is resolvable directly inside Paycom, at no cost — already confirmed role-based, not a hard cap. The lack of a week-at-a-glance, colour-coded view is not something Paycom's own settings expose — this reads as a genuine product gap in Paycom itself. This app's own weekly grid and colour tinting are a direct substitute — but exist alongside Paycom, not inside it.</li>
<li><b>Every Excel/Paycom pain point raised, and how this app addresses each</b> — consolidated here for a single, direct answer per issue rather than scattered across the readme:
  <ul>
    <li><i>Paycom shows a scrolling list, not a week-at-a-glance view, so managers copy-paste shift colours in Excel to see coverage visually.</i> — Directly addressed: this app's own weekly grid, with the Excel-matched per-shift colour tinting already built, replaces this need entirely — no copy-pasting required, and it updates live for every viewer.</li>
    <li><i>Paycom restricts roster/attendance visibility to two roles per department (department head + one designated second role), so other staff (e.g. a Housekeeping controller) can't see the schedule at all and rely on a printed Excel sheet instead.</i> — Directly addressed: this app's schedule is visible to any authorized viewer regardless of Paycom's own role restriction (view-only access requires no PIN at all) — though genuinely sensitive Paycom-side data (pay rates, personnel records) is unaffected and stays exactly as restricted as it already is in Paycom.</li>
    <li><i>Schedules are made in Excel first, then manually retyped into Paycom, every week, for every department.</i> — Partially addressed: this app cannot eliminate that manual retyping step for PLANNED shifts (Paycom has no self-serve bulk-import for that direction without its own paid agreement) — but the Payroll &amp; Time (CSV) export gives whoever does that retyping the underlying REG/OT/leave data in one file instead of reading it off a printed sheet, and the Paycom actual-hours import closes the loop in the OTHER direction, which didn't exist in any form before.</li>
    <li><i>Same-day schedule changes (call-outs, time adjustments) need to be reflected quickly, but the person making the change (e.g. a Spa receptionist) may not have Paycom access to view or edit other staff's times.</i> — Directly addressed for Front Office/Housekeeping: any authorized editor can update a cell and it's visible to every other viewer immediately (live sync), without needing Paycom access at all.</li>
    <li><i>Housekeeping staff receive room assignments via Hotlink before/without necessarily clocking into Paycom, so someone can be physically present but show as not-clocked-in.</i> — Now genuinely addressed: see Clock in / Clock out above.</li>
    <li><i>Dayforce's own leave-request feature shows submission order and other overlapping requests, for fairness/transparency, which Paycom lacks.</i> — Already addressed, independent of any Dayforce migration: this app's own Leave Requests tab already shows exactly this — other staff's overlapping requests, listed oldest-first, at submission time.</li>
  </ul>
</li>
<li><b>Room Assignments (CSV) export</b> (Settings → Export…, Housekeeping only) — each Room Attendant's/Room Controller's/Supervisor's assigned floor/zone per scheduled day, the schedule-side data a room-assignment push (to Hotlink/HotSOS or otherwise) would need. Honest scope limit: this app has no PMS integration and no individual room-number data at all — only floor/zone assignments — so this is not a room-by-room list.</li>

<hr><details><summary style="cursor:pointer"><b>Build conventions</b> <span class="muted">(click to expand)</span></summary>
<ul class="small">
<li><b>Capitalization:</b> all UI labels, buttons, tooltips, placeholders, and dropdown options start with a capital letter.</li>
<li><b>Decimals:</b> dollar values show 2 decimals ($0.00); hours show 1 decimal (0.0h). Occupancy is a whole-number percent. Arrivals/Departures/Credits are whole numbers.</li>
<li><b>Number bounds:</b> hours 0–24, occupancy 0–100, counts ≥0, clamped on entry. HSK's OOO/House-use/Unassigned/Outsourced room counts are each 0–421 and their sum cannot exceed 421 total rooms — the last-entered value is capped so the sum stays within it.</li>
<li><b>Prefilled inputs stay editable:</b> an auto-filled/estimated value must be selectable and backspaceable, never force-overwritten.</li>
<li><b>Checkboxes are a fixed, consistent size app-wide (16×16)</b> — enforced at the base <code>input[type=checkbox]</code> selector itself (width, height, AND <code>flex-shrink:0</code> — a checkbox sitting inside a <code>display:flex</code> label next to an unusually long text label can otherwise be silently compressed by the browser's default flex-shrink behavior, a real, confirmed bug found this round), not only via a class, so a future checkbox can never regress this by omission.</li>
<li><b>One font size/typeface for body text and one for tables:</b> set once, at the <code>body</code> and <code>table</code> level (13px / 12.5px) — a field should never need its own explicit size override to match its neighbors.</li>
<li><b>One colour for every hyperlink app-wide</b> — set once on the base <code>a</code>/<code>a:visited</code> selector, never overridden per-link.</li>
<li><b>Vertically align text on the same line:</b> any flex row mixing different-height content (e.g. a checkbox+label next to an input+label) must set the container's <code>align-items:center</code> explicitly — flex's default lets mismatched-height children drift to different vertical positions otherwise.</li>
<li><b>A direct-child text input inside <code>.cfgrow</code> gets stretched to full width on narrow screens</b> by this app's own responsive rule (intended for long search/filter fields) — any SHORT field (a PIN, a name, a small filter box) that shouldn't stretch must be wrapped in its own <code>&lt;label&gt;</code> to escape being a direct child, rather than fighting the rule with a fixed width that the rule will override anyway.</li>
<li><b>Colour code:</b> OFF/R-OFF/PTO/LWOP/LOA = grey; a task assignment (GC/Task Force/Project/On-call/Laundry/Rooms/Controller/Laundry Chute) = pale yellow, uniformly, whether bare or combined with a time; a typed shift or blank = white or (FO only) a per-shift-time pastel; hours over 40 = red outline + bold red text.</li>
<li><b>Verification flags and explanatory/implementation-reasoning asides belong only in this Readme tab</b> — never in Settings, Leave Requests, the schedule, or the demand table, and never inside a dialog/confirmation shown on another tab. A working control shows only what's needed to use it now; the reasoning behind it, its history, and any "confirmed/unverified" status live here instead.</li>
<li><b>No native dialogs</b> (alert/confirm/prompt are blocked in sandboxes) — use the in-page modal helpers.</li>
<li><b>Enter submits, Tab moves focus:</b> any single-line text/date/time input that represents a "final" value in a form (not a multi-line field) should submit or save on Enter, matching whichever primary action button that form already has. When a form's fields are rebuilt via innerHTML on every keystroke (e.g. a checkbox toggling a nested field's visibility), attach the Enter handler inline (<code>onkeydown</code>) rather than via a one-time <code>addEventListener</code>, since a script tag injected through innerHTML never executes and a listener attached once is lost on the next rebuild. Native Tab order between fields should not be overridden.</li>
<li><b>Edit mode</b> is per-department and ends on refresh; the whole app opens view-only behind a PIN (Auth replaces this when configured). Any function that grants edit access for a SPECIFIC department (not necessarily the one currently being viewed, e.g. deciding a Leave Request) must call <code>updateAuth()</code> afterward, not just re-render that one feature's own view — the header's own lock/unlock label is a global indicator that needs to reflect ANY granted access, not only access for whichever department happens to be on-screen right now.</li>
<li><b>A capture-phase (<code>useCapture:true</code>) click listener runs BEFORE a target element's own bubble-phase <code>onclick</code>, and the target's own <code>event.stopPropagation()</code> cannot retroactively stop it</b> — any new view-only-clickable action added to the schedule grid (e.g. Check-in) must be explicitly excluded from this app's existing view-only capture-phase listener (the one that opens the edit-PIN prompt on any other schedule click) via a dedicated marker attribute, the same pattern already used for header/.modalbg/#settingsCard/#readmeCard.</li>
<li><b>A name passed through <code>encodeURIComponent()</code> into an inline <code>onclick</code> attribute (to safely handle names containing quotes/special characters) must be <code>decodeURIComponent()</code>'d again inside the function it calls</b>, before using it as an object key or for display — a real, confirmed bug this round wrote data under the wrong (still-encoded) key because one new function skipped this decode step that every other nmE-based handler in this file already performs.</li>
<li><b>Header nav visibility</b> (e.g. Settings/Readme hidden from view-only users) must be re-synced on every render, not only when navigating tabs — toggling edit mode or a visibility setting without also switching tabs is a real path that can otherwise leave the header stale.</li>
<li><b>A task-assignment code's visual treatment must stay uniform across the whole set</b> (currently GC/Task Force/Project/On-call/Laundry/Rooms/Controller/Laundry Chute) — a fix or confirmed finding for one member of this set (e.g. a confirmed colour) should be checked against and applied to every other member, not left to apply to only the subset it was first noticed on.</li>
<li><b>A shift-editor control that sets a TIME (a preset button or a typed time) must never silently clear an already-selected TASK-ASSIGNMENT code</b>, and vice versa — task codes are confirmed to combine with a time, not be replaced by one; any new "set time" affordance added to the shift editor needs the same task-code preservation check <code>usePreset()</code>/<code>pickCode()</code> already apply.</li>
<li><b>Every change is validated headlessly</b> (the file must boot and parse without error) before shipping.</li>
<li><b>CSS comments must use <code>/* ... */</code> only</b> — never <code>//</code> or HTML's <code>&lt;!-- --&gt;</code> — inside a &lt;style&gt; block. An invalid comment token forces the CSS parser into error-recovery and can silently corrupt an unpredictable range of the rules that follow it in the same block; this has broken this app's formatting more than once. Before shipping any CSS change, run a real parser (e.g. Python's tinycss2) against the extracted stylesheet and confirm zero parse errors.</li>
<li><b>Borders &amp; corners:</b> data tables use 8px radius with border-collapse:separate; border-spacing:0. Cards use 10px radius.</li>
<li><b>Field heights</b> are uniform (30px) across inputs, selects, and buttons in a row.</li>
<li><b>Schedule row height stays standardized</b> across every role section — the name column must be wide enough that the longest real name+type-label combination fits on one line.</li>
<li><b>Dates are local (Guam, UTC+10):</b> never use toISOString() for a date key — build YYYY-MM-DD from local get*(); UTC shifts the day and breaks stamping.</li>
