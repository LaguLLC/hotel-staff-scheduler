
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Hotel Staff Scheduler</title>
<!-- Supabase JS (realtime). If it can't load, the app runs in LOCAL mode. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{--brand:#1b2a4a;--line:#dfe4ea;--ok:#0e7c46;--warn:#b8860b;--err:#b30000;--bg:#f4f6f8;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:Calibri,Segoe UI,Arial,sans-serif;background:var(--bg);color:#1f2d3d;}
  header{background:var(--brand);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:2000;box-shadow:0 2px 6px rgba(0,0,0,.2);}
  .titlewrap{display:flex;align-items:baseline;gap:8px;}
  /* FIXED (per feedback: "isn't left-aligned on a medium-width screen... anytime the header doesn't fit on one
     line, the second line should be left-aligned"): the header holds a title + 5 nav buttons + Prev/date/Next/
     status/lock — realistically needs well over 1200px to fit on a single line, but the .tag left-alignment fix
     below was only gated behind an 820px breakpoint. That left a wide "medium" range (roughly 820\u20131300px,
     covering most laptop/tablet-landscape widths) where the header genuinely wraps to 2 lines, yet .tag still
     used its base margin-left:auto (meant only for the single-line, everything-fits case), pushing it toward the
     right and creating the lopsided, not-quite-centered look reported. This is a SEPARATE, much wider breakpoint
     dedicated to just the alignment fix (the narrower 820px query below still separately handles font-size/
     padding reductions for genuinely small/phone screens) — a CSS media query can't detect "did this actually
     wrap" directly, so widening the threshold to comfortably exceed the header's real fit-everything-on-one-line
     width is the practical fix. */
  @media(max-width:1300px){ .tag{margin-left:0;width:100%;justify-content:flex-start;flex-wrap:wrap;row-gap:6px;}
    #weekLabel{min-width:0!important;text-align:left!important;}
  }
  @media(max-width:820px){ header{gap:6px;padding:8px 10px;} header h1{font-size:15px;}
    /* FIXED (per feedback: ".tag" wasn't visually left-aligned despite justify-content:flex-start): weekLabel's
       fixed min-width:150px + text-align:center left a wide, awkward gap between Prev/Next and the status/lock
       buttons whenever the row wrapped or the date text was short — the row edges were technically flush-left,
       but the visual GROUPING looked scattered rather than packed. weekLabel now only takes as much width as its
       actual text needs on narrow screens, so every element sits genuinely adjacent to its neighbor. (The
       #weekLabel rule itself now lives in the wider 1300px query above, since it applies any time .tag wraps.) */
  }
  header h1{font-size:18px;margin:0;}
  .ver{opacity:.7;font-size:12px;}
  .tag{margin-left:auto;display:flex;gap:8px;align-items:center;}
  button{font-family:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 10px;font-size:13px;}
  /* ADDED (per feedback: "Auto-fill button height is inconsistent with Clear week/Clear a day") — .mini was
     referenced on all 3 of these buttons but never actually had a CSS rule defined anywhere, so they fell back to
     inheriting height/line-height purely from their surrounding context (an <h2> gridTitle with its own larger
     font metrics), which is exactly the kind of thing that renders inconsistently across browsers/zoom levels
     even with an inline font-size override. An explicit, fixed height + vertical alignment now guarantees all
     three buttons are pixel-identical regardless of their surrounding heading's font metrics. */
  button.mini{height:24px;padding:0 8px;font-size:11px;box-sizing:border-box;vertical-align:middle;line-height:1;}
  button.brand{background:#2c9e5f;color:#fff;border-color:#2c9e5f;}
  button.ghostw{background:transparent;color:#fff;border-color:rgba(255,255,255,.5);}
  button.weeknav:disabled{opacity:.35;cursor:not-allowed;}
  .deptbtn{background:rgba(255,255,255,.14);color:#fff;border-color:transparent;}
  .deptbtn.active{background:#fff;color:var(--brand);font-weight:700;}
  .wrap{max-width:1500px;margin:0 auto;padding:14px 16px 60px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px;}
  h2{font-size:15px;margin:0 0 8px;}
  table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px;table-layout:fixed;}
  /* FIXED per feedback ("some rows like Graveyard PA and Laundry/Uniform suddenly increased in height — revert
     so it's standardized"): td.name allows text to wrap (white-space:normal;overflow-wrap:anywhere), and at the
     previous 200px width, several longer name+type-label combinations (e.g. "Jada (Abi) Deem-Hinson (PT · TRN)",
     22+ characters before the label) exceeded that width and wrapped onto a 2nd line — while shorter names in
     other role sections stayed on one line, making row height look inconsistent across sections. Laundry/Uniform
     and Graveyard PA happen to cluster several longer names together ("Ma. Buenaflor Guinto", "Evelyn B.
     Topacio", "Remedios Sapitanan", "Eleanora Rumbaua"), which is why it was most visible there specifically —
     not a bug isolated to those two roles, just where the effect concentrated. Widened to comfortably fit the
     single longest actual name+label combination in the current roster on one line. */
  col.dayc{width:92px;} col.namec{width:235px;} col.hrc{width:70px;} col.costc{width:80px;}
  @media(max-width:820px){ col.namec{width:150px;} col.dayc{width:64px;} body{font-size:12px;} }
  th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:3px 5px;text-align:center;vertical-align:middle;}
  tr:first-child th,tr:first-child td{border-top:1px solid var(--line);}
  th:first-child,td:first-child{border-left:1px solid var(--line);}
  #grid tr td:last-child,#grid tr th:last-child{border-right:1px solid var(--line);}
  thead th{background:#eef2f6;position:sticky;position:-webkit-sticky;top:0;z-index:20;}
  /* sticky first column = staff names AND the role label (single-column cells stick reliably) */
  #grid td:first-child,#grid th:first-child{position:sticky;left:0;z-index:15;background:#fff;}
  #grid thead th:first-child{z-index:25;background:#eef2f6;}
  #grid td.rolelabel{position:sticky;left:0;z-index:16;background:#f0f3f6;text-align:left;font-weight:700;color:var(--brand);white-space:nowrap;vertical-align:middle;overflow:hidden;text-overflow:ellipsis;}
  /* FOUND A REAL BUG this round (per screenshot: "Outsourced — J4 Janitorial" role-header text visually overlapping
     the checkbox/"Off" text in the next cell): .rolelabel had white-space:nowrap but NO overflow:hidden — so for a
     role name too wide for the sticky 235px name column ("Outsourced — J4 Janitorial" is noticeably longer than
     "Outsourced — JJ Global", which is why only THIS row showed the bug), the overflowing text simply painted PAST
     the column's own box, directly on top of the next cell's content (which has no background of its own at that
     x-position, since it belongs to a different <td>) — producing exactly the "Dff" garbled-overlap look reported.
     Now clipped with an ellipsis (full role name still available via the title attribute added at the render call
     site) so long role names can never bleed into a neighboring cell again, regardless of exact text length. */
  /* FIXED this round (per feedback, again: "role label rows with pills have bigger heights, e.g. Concierge Agent
     row smaller height than Greeter row" — this exact issue was targeted in an earlier round with min-height:36px,
     but 36px turned out to be TOO SMALL to actually fix it: a 2-line pill (Greeter's "need \u2265 2 greeters per day
     \u00b7 at least 1 downstairs") needs roughly 2 \u00d7 12.5px \u00d7 1.5 line-height + 10px padding \u2248 47-48px to fit
     without growing the row further \u2014 so a 1-line role (Concierge Agent) was capped at the 36px floor while a
     2-line role (Greeter) still grew PAST 36px to fit its own content, leaving the exact same mismatch the fix was
     meant to close, just with a different (still-different) pair of numbers. Raised to 48px \u2014 comfortably above
     the real 2-line requirement \u2014 so EVERY role-header row (1-line or 2-line pill, coverage-pill row or
     Outsourced-crew toggle row) is reserved the same height and none of them still grow past it. */
  /* FOUND AND FIXED A REAL, CONFIRMED BUG this round (per feedback: "all pills are gone, circle for local/live
     disappeared, formatting like alignment/text size is weird all over the place"): the comment explaining the
     row-height tightening below had been written using "//" line-comments \u2014 which are NOT valid CSS syntax
     inside a \u003cstyle\u003e block (CSS only supports /* ... asterisk-slash block comments; "//" has no special
     meaning to a CSS parser at all). Worse, several of these invalid lines contained an opening double-quote
     character with no matching closing quote on the same physical line (e.g. the word "tight" opening a quote
     that was never closed before the next newline) \u2014 CSS string literals cannot contain an unescaped newline,
     which produces a "bad string" parse error. Together, this malformed block caused browsers' CSS parsers to
     enter error-recovery partway through the stylesheet, which can silently drop or garble an unpredictable
     range of the RULES THAT FOLLOW it in the same \u003cstyle\u003e block \u2014 exactly matching the reported symptoms
     (pills, the sync-status dot, spacing/alignment, and text sizing all live in CSS rules positioned after this
     point in the file, and were never actually removed from the code \u2014 they were being silently broken by
     this ONE invalid comment block sitting upstream of them). Converted to a single, valid /* ... asterisk-slash
     block comment (all internal quotes safely escaped/removed) so the CSS parser can never mis-recover here
     again. Same row-height reasoning as before is preserved, just in valid CSS comment syntax this time. */
  #grid td.rolerest{background:#f0f3f6;text-align:left;font-weight:700;color:var(--brand);box-shadow:inset 0 -1px 0 var(--line);vertical-align:middle;}
  #grid tbody td.name{background:#fff;}
  #grid tbody tr.wktotal td{font-weight:700;border-bottom:1px solid var(--line);}
  #grid tbody tr.wktotal td.name{background:#eef2f6!important;}
  td.name{text-align:left;white-space:normal;overflow-wrap:anywhere;min-width:150px;font-weight:600;}
  td.demand{background:#fafbfc;font-weight:600;line-height:1.3;padding:10px 8px;white-space:normal;height:auto;vertical-align:middle;}
  #grid tbody td{position:relative;}
  #demandBody td:not(.demand){text-align:center;}
  #demandBody th{background:#eef2f6;}
  #demandBody thead th,#demandBody tr:first-child th{position:static;}
  #demandBody td.demand{padding:12px 10px;line-height:1.25;white-space:normal;overflow-wrap:normal;}
  #demandBody td{padding-top:8px;padding-bottom:8px;}
  #demandBody table td:first-child,#demandBody table th:first-child{position:sticky;left:0;z-index:5;}
  #demandBody table td.demand:first-child{background:#fafbfc;}
  #demandBody table th:first-child{background:#eef2f6;}
  #demandBody table{table-layout:fixed;width:100%;min-width:720px;}
  #demandBody .tblwrap{overflow:auto;max-height:none;position:relative;}
  #demandBody td:not(.demand) *{text-align:center;margin:0 auto;}
  select.cell,input.cell{width:100%;border:1px solid transparent;background:transparent;font:inherit;text-align:center;border-radius:4px;padding:2px;}
  select.cell:hover,input.cell:hover{border-color:var(--line);}
  .off{background:#eef0f2;color:#6b7a8d;} /* OFF/R-OFF = grey (rest) */
  .loa{background:#eef0f2;color:#6b7a8d;} /* LOA = grey (leave) */
  .leave{background:#eef0f2;color:#6b7a8d;} /* PTO/LWOP/LOA = grey leave */
  .special{background:#eaf1fb;color:#1b4b8a;} /* OC / TASK FORCE / PROJECT */
  .work{background:#fff;}
  /* DESIGN DECISION (explained in Readme too): caution (data-quality issues — unreadable hours, unavailable-day
     conflicts) now signals via BORDER + icon ONLY, never a background fill. Previously this used `!important` on
     background, which could silently override/fight the JS-computed fill priority (OT-red > off/leave-grey >
     Excel shift-tint) whenever a cell was BOTH over 40h AND flagged — exactly the "layered/blended colors"
     problem to avoid. Now fill and flag are two independent, non-competing channels: JS controls the ONE
     background a cell shows; caution/other flags add a border ring + icon on TOP of whatever that background is,
     so nothing is ever silently lost or visually blended. */
  .caution{outline:2px solid #e0c060;outline-offset:-2px;}
  /* FIXED per feedback ("purple border is weird — shows within the cell, should be on the actual border like
     other flags"): the previous -4px offset (vs. every other flag's -2px) pulled this ring noticeably further
     INSIDE the cell than .flagcell/.caution, making it look inconsistent/oddly nested rather than a normal
     border. Now uses the SAME -2px offset as every other flag type, so it sits at the same visual "edge" as the
     rest \u2014 consistent, not a special case. (If a cell is ever flagged both caution AND PT-cap at once, the
     single shared offset means the two rings overlap into one line rather than showing as concentric circles;
     that tradeoff is preferred here since visual consistency with every OTHER flag was the explicit ask.) */
  /* CHANGED AGAIN this round (per explicit feedback: "make PT cap crossed schedule flag border teal or slate or
     some shade of yellow/orange/red, not purple" + "shift is a little understated, maybe more in the
     orange/yellow/red color scheme"): teal (picked last round specifically to read calmer than purple) turned out
     to read as TOO understated/muted for this flag's actual visibility needs. Re-picked into the requested
     orange/yellow/red family this round: a vivid deep orange (#E06106, hue 25°) — chosen at roughly the
     midpoint between the amber caution outline (45°) and the red OT outline (0°), so it stays clearly
     distinct from BOTH (25° separation from each) while now reading as a genuinely noticeable, energetic color
     rather than an understated one. Also widened the outline from 2px to 3px (every other flag stays at 2px) so
     this flag reads as more prominent at a glance, directly addressing "a little understated." */
  .ptcapcell{outline:3px solid #E06106;outline-offset:-2px;}
  /* CHANGED this round (per explicit request: "Option A for OT" \u2014 border-only, keep the Excel shift fill):
     OT previously WON the background-fill slot outright (a full solid #fdecec red fill that completely replaced
     the Excel shift-tint), which was the ONE remaining place fill and flag competed, despite every other flag in
     this app (caution/PT-cap/pending-leave/CONFLICT) already using the border-only pattern specifically so the
     shift-tint is never lost. OT now follows the SAME pattern: the Excel shift-color fill for that day is left
     alone, and a red outline (matching every other flag's -2px offset) plus bold red hours-line text (see the
     grid-render hrsline logic) marks the day as OT instead. This means a day that crosses 40h keeps showing its
     normal shift-time color underneath, with the red outline + bold red hour figure as the "this needs attention"
     signal layered on top \u2014 consistent with the caution/PT-cap/CONFLICT treatment, and preserves the shift-color
     coverage-checking the hotel said they value even on the busiest (OT) days. */
  .otcell{outline:2px solid #b30000;outline-offset:-2px;}
  .short{background:#fff6e5;}
  .flagshort{background:#fdecec!important;color:#b30000!important;font-weight:700;border:1.5px solid #b30000!important;border-radius:4px;}
  .flagshort::before{content:"\26a0";margin-right:5px;} /* explicit margin instead of relying on a space character in content, which was rendering too tight against the following number */
  .flagcell{position:relative;outline:2px solid #e0a800;outline-offset:-2px;}
  input.dayhrs{background:#fff;}
  #demandBody input[type=number]::-webkit-inner-spin-button,#demandBody input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  #demandBody input[type=number]{-moz-appearance:textfield;text-align:center!important}
  #demandBody td{text-align:center!important}
  .cellbtn{display:block;min-height:18px;cursor:pointer;padding:2px;border-radius:4px;}
  .cellbtn:hover{background:#eef4fd;}
  .modalbg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:9999;}
  .modal{background:#fff;border-radius:12px;padding:16px 18px;min-width:340px;max-width:440px;box-shadow:0 12px 40px rgba(0,0,0,.3);}
  .seg{display:flex;gap:6px;align-items:center;margin:4px 0;}
  .seg input[type=time]{width:120px;border:1px solid var(--line);border-radius:6px;padding:5px;font:inherit;}
  .seg input{width:120px;border:1px solid var(--line);border-radius:6px;padding:5px;font:inherit;}
  .mflag{background:#fdf0d0;color:#8a6d00;border-radius:6px;padding:4px 8px;font-size:12px;margin:3px 0;}
  /* FIXED (per feedback: "Rooms per outsourced worker isn't vertically aligned with JJ Global/J4's checkbox
     text", "Scale in multiples checkbox isn't vertically aligned with the Front Desk Agents needed line"): found
     the actual root cause rather than patching each row individually — .mrow (used for every Settings
     "Rules & thresholds" row) never had align-items:center, unlike its sibling .cfgrow which does. Flex's default
     align-items:stretch was letting mismatched-height children (a 16px checkbox+label vs. a 30px .sfield
     input+label sharing the same row) stretch to the row's full height independently, so their actual
     checkbox/text baselines landed at different vertical positions even though both labels were the same
     component type. Adding align-items:center here fixes EVERY .mrow row with mixed checkbox/input content at
     once — not just the two specifically reported — since this was a shared root cause, not two separate bugs. */
  .mrow{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;align-items:center;}
  #smCodes button,#smCodes select{font-family:inherit;font-size:13px;height:30px;box-sizing:border-box;vertical-align:middle;}
  .cellflag{position:absolute;top:0;right:2px;font-size:10px;color:#b8860b;}
  /* REMOVED this round (per direct feedback: "the 'PT' label in the upper-left corner is distracting"): an
     earlier round added this text badge because the outline alone was reported as "not really noticeable" \u2014
     but the corner-text fix overshot into being distracting instead. Reverting to outline-only (now matching
     every other flag's positioning, per the fix just above) rather than trying a third visual treatment;
     the outline ring plus the cell's own tooltip (title="... PT CAP: over 32h...") together are enough to
     surface this without adding a persistent corner label competing for attention. */
  .pdmark{position:absolute;top:0;right:0;width:0;height:0;border-top:10px solid #e0a800;border-left:10px solid transparent;}
  /* REVERTED this round (per feedback, citing index6 as the good reference: "row role heights are inconsistent and
     not tight again"): compared directly against index6's .pill rule and found two genuine regressions introduced
     since then — padding had grown from 1px 8px to 2px 8px (2px extra height per pill), and a margin:2px 0 had
     been added that index6 never had at all (another 4px of total vertical space per pill occurrence). Both
     reverted to index6's exact values, since pills sit directly inside role-header rows and any extra
     padding/margin on them directly inflates that row's height — exactly the kind of small, easy-to-miss addition
     that compounds into "still not tight" even after other row-height fixes. */
  .pill{display:inline-block;border-radius:20px;padding:1px 8px;font-size:11px;font-weight:700;}
  .pill.ok{background:#e6f4ec;color:var(--ok);}
  .pill.warn{background:#fbf0d6;color:var(--warn);}
  .pill.err{background:#fdecec;color:var(--err);}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .small{font-size:11.5px;color:#6b7a8d;}
  th,td{overflow-wrap:anywhere;word-break:break-word;}
  .pill{white-space:normal;}
  .flags li{margin:2px 0;}
  /* NEW this round (per feedback: "understaffing sections still not showing as collapsible"): per-role Checks
     entries use list-style:none on both the <li> and <summary> (to avoid a double marker — one from the <li>,
     one from the native <summary> triangle — clashing with the pill/text layout), but that also means NO visual
     affordance was left at all to show these rows are clickable/expandable, which is very likely why they didn't
     read as "collapsible" despite functioning that way under the hood. Added an explicit ▶/▼ indicator via the
     [open] attribute selector on <details>, positioned right before the summary content, so every collapsible
     Checks entry now visibly shows its current expand/collapse state and affordance, matching the same ▶/▼
     convention already used elsewhere in this app (the Outsourced-crew role headers).\n  */
  /* FOUND AND FIXED A REAL, CONFIRMED BUG this round (per feedback: "checks aren't collapsible, they show u25hbc
     instead of an arrow"): content:"\u25b6" uses JAVASCRIPT/JSON escape syntax (backslash-u-four-hex-digits) —
     but this value sits inside a CSS <style> block, parsed by the CSS engine, not JavaScript. CSS's OWN escape
     syntax is different: a backslash followed directly by hex digits (e.g. \25B6, no "u"). Since CSS allows any
     character to be escaped with a backslash (meaning "treat the next character literally"), the CSS parser read
     \u as simply an escaped, literal letter "u", followed by the plain text "25b6" — producing exactly the
     reported "u25b6"/"u25bc" literal text in place of the intended ▶/▼ arrow glyphs. Fixed by using the actual
     UTF-8 arrow characters directly in the CSS (matching how this app already inserts real ▶/▼ characters
     directly in several JS-built HTML strings elsewhere), which every browser renders correctly with no escape
     syntax ambiguity at all. */
  .flags summary::before{content:"▶";display:inline-block;margin-right:5px;font-size:10px;color:#6b7a8d;}
  .flags details[open]>summary::before{content:"▼";}
  .cfgrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0;}
  .sfield{max-width:100%;}
  /* FOUND AND FIXED A REAL, CONFIRMED BUG this round (per feedback: "checkboxes not all same size"): verified via
     CSS specificity calculation that `input[type=checkbox]` (an attribute selector + element selector, specificity
     0-0-1-1) is STRICTLY MORE specific than `.cbx` alone (a single class selector, specificity 0-0-1-0) — meaning
     the 15px size from the FIRST rule always wins over the SECOND rule's declared 16px, for every single checkbox
     in this app (all 7 checkbox instances already correctly carry class="cbx", confirmed by direct search — this
     isn't a missing-class problem). This directly contradicts this app's own Build Convention ("checkboxes are a
     consistent size app-wide") \\u2014 .cbx was clearly INTENDED to be the authoritative, app-wide size, but could
     never actually apply due to losing the specificity contest to the more general fallback rule beneath it.
     Fixed by qualifying .cbx with the element type (input.cbx) to TIE the specificity of the two rules exactly
     (0-0-1-1 vs 0-0-1-1) \\u2014 when tied, the LATER rule in source order wins, and input.cbx is declared after
     input[type=checkbox], so it now correctly takes priority everywhere it's used, while the plain
     input[type=checkbox] rule remains as a sane fallback default for any hypothetical future checkbox that
     doesn't carry the .cbx class. */
  input[type=checkbox]{width:15px;height:15px;vertical-align:middle;cursor:pointer;}
  input.cbx{width:16px;height:16px;}
  #grid input:disabled,#grid select:disabled,#demandBody input:disabled{pointer-events:none;}
  @media(max-width:820px){ .cfgrow>input.sfield,.cfgrow>input.txt{flex:1 1 100%;min-width:0;} }
  input.txt{border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit;min-width:240px;}
  .sfield{border:1px solid var(--line);border-radius:6px;padding:0 7px;height:30px;box-sizing:border-box;font:inherit;background:#fff;vertical-align:middle;}
  .sfield[type=checkbox]{height:auto;}
  /* standard: all input/select/button heights consistent */
  .cfgrow input:not([type=checkbox]),.cfgrow select,.cfgrow button,.mrow input:not([type=checkbox]),.mrow select,.mrow button{height:30px;box-sizing:border-box;vertical-align:middle;}
  .card>div[style*="overflow"]{border-radius:8px;overflow:hidden;}
  .card>.tblwrap{border-radius:8px;}
  #demandBody .tblwrap{overflow:auto;}
  .tblwrap{border:1px solid var(--line);}
  .tblwrap>table tr:first-child th,.tblwrap>table tr:first-child td{border-top:none;}
  .tblwrap>table th:first-child,.tblwrap>table td:first-child{border-left:none;}
  .tblwrap>table tr td:last-child,.tblwrap>table tr th:last-child{border-right:none;}
  .tblwrap>table tr:last-child td{border-bottom:none;}
  #settingsBody table{table-layout:fixed;min-width:900px;}
  #settingsBody table th:last-child,#settingsBody table td:last-child{width:34px;text-align:center;}
  #settingsBody table td{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #settingsBody table th{background:#eef2f6;}
  #settingsBody table td:nth-child(6){overflow:visible;}
  #settingsBody table td:first-child{position:sticky;left:0;background:#fff;z-index:2;}
  #settingsBody table th:first-child{position:sticky;left:0;background:#eef2f6;z-index:2;}
  #settingsBody table th:first-child{background:#eef2f6;}
  #settingsBody table input,#settingsBody table select{border:1px solid var(--line)!important;border-radius:6px!important;padding:4px 6px;}
  .muted{color:#6b7a8d;}
  .status{font-size:12px;display:flex;align-items:center;gap:6px;flex-wrap:nowrap;}

function uiAlert(msg){return uiDialog(msg,["OK"]).then(()=>{});}
function uiConfirm(msg){return uiDialog(msg,["Cancel","OK"]).then(b=>b==="OK");}
function uiPrompt(msg,def){return uiDialog(msg,["Cancel","OK"],true,def||"");}
function uiDialog(msg,btns,withInput,def){
  return new Promise(res=>{
    const bg=document.createElement("div");bg.className="modalbg";bg.style.display="flex";
    const inp=withInput?`<input id="uiIn" style="width:100%;margin-top:8px;padding:6px;border:1px solid #ccc;border-radius:6px" value="${(def||"").replace(/"/g,'&quot;')}">`:"";
    bg.innerHTML=`<div class="modal" style="${btns.length>3?'max-width:640px':''}"><div style="white-space:pre-wrap">${String(msg).replace(/</g,"&lt;")}</div>${inp}<div class="mrow" style="justify-content:flex-end;margin-top:12px">${btns.map(b=>`<button data-b="${b}" class="${b!=='Cancel'?'brand':''}" style="${b==='Cancel'?'color:#8a94a0':''}">${b}</button>`).join("")}</div></div>`;
    document.body.appendChild(bg);
    const done=v=>{const val=withInput&&v!=="Cancel"?(bg.querySelector("#uiIn").value):v;bg.remove();res(val);};
    bg.querySelectorAll("button").forEach(b=>b.onclick=()=>done(b.dataset.b));
    bg.addEventListener("mousedown",e=>{if(e.target===bg)done(withInput?"Cancel":(btns.includes("Cancel")?"Cancel":btns[0]));});
    if(withInput){const i=bg.querySelector("#uiIn");i.focus();i.select();i.onkeydown=e=>{if(e.key==="Enter")done("OK");if(e.key==="Escape")done("Cancel");};}
  });
}

const LONG_SHIFT_HRS_THRESHOLD=16;
function shiftHours(v){ // parse "14:00-22:30" -> hours; coded shifts -> HRS_PER_SHIFT; OFF/leave -> 0
  if(!v)return 0; const cls=classify(v); if(cls==="off"||cls==="leave")return 0;
  const m=v.match(/(\d{1,2}):?(\d{2})?\s*(am|pm)?\s*[-–]\s*(\d{1,2}):?(\d{2})?\s*(am|pm)?/i);
  if(m){let h1=+m[1]+(m[2]?+m[2]/60:0),h2=+m[4]+(m[5]?+m[5]/60:0);

    let d=h2-h1; if(d<0)d+=24; if(d>0)return Math.round(d*2)/2;}

function renderFlags(){
  const dept=CFG[DEPT];const out=[];const wk=weekKey(WEEK_START);
  // REDESIGNED again per feedback ("still looks messy... maybe one bullet point and sub-bullet per shift?"):
  // UNDER is now Map<role, Map<bandKey, entries[]>> — ONE <li> per ROLE (not per role+band combination), with a
  // NESTED <ul> sub-list for per-shift-band roles (one sub-bullet per band, e.g. Morning/Mid/Evening/Graveyard),
  // or a single flat line for per-day roles that have no bands at all. This collapses what used to be up to 4
  // separate top-level bullets for one per-shift role (one per band) into a single bullet with an indented
  // breakdown, and is far more scannable when many roles are short across the week.
  // REDESIGNED again this round (per feedback: "is sub-bullet bundling by shift the best choice, factoring in
  // the autosuggest list and the fact each autosuggested worker may have different availability by day/time of
  // day? consider making understaffed sections collapsible"). Two changes: (1) OVER tracks overstaffing with the
  // identical shape/mechanism as UNDER (new, per feedback: "should overstaffing be flagged like understaffing
  // is?"). (2) "Could assign" now only merges candidates across days/bands when they genuinely share the EXACT
  // SAME eligible set (computed per-day via suggestFor, never assumed) — otherwise shows a per-day/per-band
  // breakdown instead, so a name is never implied to cover a day it wasn't actually checked for. (3) The whole
  // Understaffed/Overstaffed block is wrapped in a <details> (open by default, so nothing is hidden that wasn't
  // before) so it CAN be collapsed by whoever wants a shorter view once they've reviewed it.
  const UNDER=new Map(); const OVER=new Map(); // role -> Map<bandKeyOrEmptyString, [{day,have,need}]>
  function addShort(role,day,have,need,band){
    if(!UNDER.has(role))UNDER.set(role,new Map());
    const bandMap=UNDER.get(role);const key=band||"";
    if(!bandMap.has(key))bandMap.set(key,[]);
    bandMap.get(key).push({day,have,need});
  }
  function addOver(role,day,have,need,band){
    if(!OVER.has(role))OVER.set(role,new Map());
    const bandMap=OVER.get(role);const key=band||"";
    if(!bandMap.has(key))bandMap.set(key,[]);
    bandMap.get(key).push({day,have,need});
  }
  // `bandTimes` (optional [start,end]) is threaded through to suggestFor() so a per-shift-band shortfall only ever
  // suggests candidates who are genuinely free during THAT band's time window, not just "not already working that
  // day" — see the suggestFor() comment above for the full explanation of the gap this closes.
  function buildCandNote(role,entries,bandTimes){
    const perDay=entries.map(e=>({day:e.day,cands:suggestFor(dept,role,e.day,bandTimes)}));
    const withCands=perDay.filter(pd=>pd.cands.length);
    if(!withCands.length)return "";
    const setsEqual=(a,b)=>a.length===b.length&&a.every(x=>b.includes(x));
    const allSame=withCands.every(pd=>setsEqual(pd.cands,withCands[0].cands));
    const inner=allSame?withCands[0].cands.join(", "):withCands.map(pd=>`${DOW[pd.day]}: ${pd.cands.join(", ")}`).join("; ");
    return ` <span class="muted">Could assign: ${inner}.</span>`;
  }
  // NEW this round (per feedback: "list all checks in the same order that schedule roles/coverage minimum table
  // lists roles"): flushMap() previously iterated the UNDER/OVER Maps in plain JS Map insertion order — which
  // follows whatever order addShort()/addOver() happened to be CALLED in (the generic coverage loop's
  // Object.entries(dept.coverage) key order, followed by HSK's RA/Supervisors or FO's FDA/Bell/Valet appended
  // afterward) — not the same order the schedule grid and the Settings coverage-minimums table actually list
  // roles in (dept.roles, already fixed in an earlier round to match the real Excel section order). Now sorts by
  // dept.roles.indexOf(role) before iterating, so "Understaffed"/"Overstaffed" bullets appear top-to-bottom in the
  // exact same role order a scheduler already sees in the grid and in Settings — any role not found in dept.roles
  // (shouldn't normally happen) sorts to the end rather than being dropped.
  // REORGANIZED again this round (per feedback: "understaffing flag sections aren't collapsible... if they should
  // be collapsed to avoid overwhelming the viewer, make it collapsed by default PER ROLE, not the entire
  // Understaffed section"): the category-level <details> (Understaffed/Overstaffed as a whole) was already
  // collapsible, but that collapses ALL roles at once as a single unit — you couldn't see "which roles are short"
  // without either expanding everything or nothing. Each ROLE is now its OWN individually collapsible <details>,
  // COLLAPSED by default (the day-by-day breakdown + "Could assign" names are the part that adds the most bulk,
  // and are exactly what's hidden until clicked) — but the <summary> line itself always shows the pill, role name,
  // and a short inline total (e.g. "3 day(s) short" or "Thu 4/7, Sat 3/6" for a short list) so a scheduler can scan
  // WHICH roles need attention without expanding anything, then click into just the ones they care about. This
  // also directly matches the "better way to organize" ask: scanning a list of collapsed role summaries is faster
  // than scrolling a long always-expanded list once there are several short roles in the same week.
  function flushMap(map,pillClass,pillText,withCandidates){
    const _roles=[...map.keys()].sort((a,b)=>{const ia=dept.roles.indexOf(a),ib=dept.roles.indexOf(b);return (ia<0?999:ia)-(ib<0?999:ib);});
    _roles.forEach(role=>{
      const bandMap=map.get(role);
      const allEntries=[];bandMap.forEach(entries=>entries.forEach(e=>allEntries.push(e)));
      // Flat (non-banded) roles have no single time window to check, so the candidate note here stays day-level only.
      const candNote=withCandidates?buildCandNote(role,allEntries):"";
      if(bandMap.size===1&&bandMap.has("")){
        const parts=allEntries.map(e=>`${DOW[e.day]} ${e.have} / ${e.need}`);
        const _summaryLine=parts.join(", ");
        // FOUND AND FIXED A REAL BUG this round (per feedback: "overstaffed collapsible behavior different from
        // others \u2014 other categories only show arrow when more than one bullet point within category"): a flat
        // (single-band) role's <summary> ALREADY shows the complete day-by-day breakdown inline \u2014 so wrapping it
        // in <details> unconditionally meant expanding it, when candNote was empty, revealed the EXACT SAME text
        // again (just with a trailing period), a genuinely useless/fake collapsible affordance. This is ALWAYS the
        // case for Overstaffed specifically (flushOverstaffed calls flushMap with withCandidates=false, so
        // candNote is guaranteed empty for every overstaffed role) \u2014 which is exactly why it stood out as
        // "different" \u2014 but it could also happen for an Understaffed role on a day with zero eligible
        // candidates. Now only wraps in <details> (with the expand arrow) when there's genuinely NEW content to
        // reveal (a non-empty candNote); otherwise renders as a plain bullet with no arrow at all \u2014 matching
        // exactly how every OTHER flat category (Part-time hours, Unassigned by day, etc.) already behaves, since
        // none of those ever had a fake expand affordance either.
        if(candNote){
          out.push(`<li style="list-style:none"><details><summary style="cursor:pointer;list-style:none"><span class="pill ${pillClass}">${pillText}</span> ${roleLabel(role)}: <span class="small muted">${_summaryLine}</span></summary><div class="small" style="margin:4px 0 4px 4px">${_summaryLine}.${candNote}</div></details></li>`);
        } else {
          out.push(`<li><span class="pill ${pillClass}">${pillText}</span> ${roleLabel(role)}: ${_summaryLine}.</li>`);
        }
      } else {
        const bandLines=[...bandMap.entries()].map(([band,entries])=>{
          const parts=entries.map(e=>`${DOW[e.day]} ${e.have} / ${e.need}`);
          const _cn=withCandidates?buildCandNote(role,entries,BAND_TIMES[band]):"";
          return `<li>${band||"(no band)"}: ${parts.join(", ")}.${_cn}</li>`;
        }).join("");
        const _bandCount=bandMap.size;
        out.push(`<li style="list-style:none"><details><summary style="cursor:pointer;list-style:none"><span class="pill ${pillClass}">${pillText}</span> ${roleLabel(role)} <span class="small muted">(${_bandCount} shift${_bandCount===1?"":"s"} affected)</span></summary><ul style="margin:4px 0 2px 18px">${bandLines}</ul></details></li>`);
      }
    });
  }
  function flushUnderstaffed(){flushMap(UNDER,"err","UNDERSTAFFED",true);}
  function flushOverstaffed(){flushMap(OVER,"warn","OVERSTAFFED",false);}
  const OVERSTAFF_MARGIN=2; // a role scheduled 2+ people above "needed" gets flagged overstaffed (informational, amber — not a problem the way understaffing is)
  // coverage minima — supports {min,per:"day"} (e.g. Greeter, Bell Captain, Guest Service Supervisors) and {min,per:"shift"} (e.g. Bell Attendants, Guest Service Agent)
  // "Front Desk Agents" and "Bell Attendants" are SKIPPED here (their coverage.min floor is already folded
  // directly into fdaNeeded()/transportBellNeeded() above — see those functions) so the same floor is never
  // checked twice with two potentially different numbers for the same role/day.
  // "Room Attendants"/"Supervisors" ADDED to this skip-list this round, now that their coverage.min is folded
  // directly into raNeeded()/supsNeeded() (see those functions) — same reasoning as FDA/Bell Attendants: without
  // this, the generic loop below would ALSO independently check the exact same floor a second time via
  // countWorking(), creating the redundant double-check this fix was specifically meant to eliminate.
  const SKIP_GENERIC_COVERAGE=new Set(["Front Desk Agents","Bell Attendants","Room Attendants","Supervisors"]);
  Object.entries(dept.coverage).forEach(([role,rule])=>{
    if(SKIP_GENERIC_COVERAGE.has(role))return;
    const per=rule.per||"day";
    if(per==="shift"){
      for(let i=0;i<7;i++){SHIFT_BANDS.forEach(band=>{const have=countWorkingInBand(role,i,band);if(have<rule.min){addShort(role,i,have,rule.min,band[0]);}else if(have>=rule.min+OVERSTAFF_MARGIN){addOver(role,i,have,rule.min,band[0]);}});}
    } else {
      for(let i=0;i<7;i++){const have=countWorking(role,i);if(have<rule.min){addShort(role,i,have,rule.min);}else if(have>=rule.min+OVERSTAFF_MARGIN){addOver(role,i,have,rule.min);}}
    }
  });
  // HSK RA coverage + checkouts-per-RA load flag
  if(DEPT==="HSK"){const thinMin=CFG.HSK.rules.thinMarginMin||HSK_THIN_MARGIN_DEFAULT;const coMax=CFG.HSK.rules.checkoutRatioMax||HSK_CHECKOUT_RATIO_MAX_DEFAULT;
    const thinDays=[],checkoutDays=[];
    for(let i=0;i<7;i++){const need=raNeeded(wk,i);const have=countWorking("Room Attendants",i);const margin=have-need;
    if(need&&have<need){addShort("Room Attendants",i,have,need);}
    else if(need&&margin<thinMin)thinDays.push(`${DOW[i]} (+${margin})`);
    else if(need&&have>=need+OVERSTAFF_MARGIN)addOver("Room Attendants",i,have,need);
    { const r=checkoutsPerRA(wk,i); if(r&&r.ratio!=null&&r.ratio>coMax)checkoutDays.push(`${DOW[i]} ${r.ratio===Infinity?"0 RAs":r.ratio.toFixed(1)+"/RA"}`); }
    const sneed=supsNeeded(wk,i);const shave=countWorking("Supervisors",i);if(sneed&&shave<sneed)addShort("Supervisors",i,shave,sneed);else if(sneed&&shave>=sneed+OVERSTAFF_MARGIN)addOver("Supervisors",i,shave,sneed);}
    if(thinDays.length)out.push(`<li><span class="pill warn">THIN MARGIN</span> Room Attendants: only &lt;${thinMin} above needed on ${thinDays.join(", ")}.</li>`);
    if(checkoutDays.length)out.push(`<li><span class="pill warn">CHECKOUT LOAD</span> Room Attendants: &gt;${coMax} checkouts/RA on ${checkoutDays.join(", ")}.</li>`);
  }
  // FO: Front Desk Agents (arrivals/departures-driven, interns substitutable), Bell Attendants (Transportation-driven), Valet (Events-driven)
  // FIXED a genuine redundancy this round (per feedback: "are BUSY and THIN MARGIN flags still meaningful or
  // redundant?"): THIN MARGIN is NOT redundant (mutually exclusive with UNDERSTAFFED by construction — covers the
  // "adequate but thin" zone UNDERSTAFFED never touches). BUSY WAS genuinely redundant in one case: it used its
  // own independent threshold (default arr\u2265100/dep\u2265100), separate from FDA's own scaling threshold
  // (arr\u226570/dep\u2265100) — so it could restate the exact same numbers already visible in the demand table, on a
  // day ALSO already flagged understaffed for the same reason. Fixed: BUSY now excludes any day already flagged
  // understaffed for Front Desk Agents, so it only ever adds genuinely new information ("busy, but currently
  // staffed — still worth a glance") instead of duplicating an alarm that's already showing.
  if(DEPT==="FO"){const busyArr=CFG.FO.rules.busyArrThreshold||FO_BUSY_ARR_DEFAULT;const busyDep=CFG.FO.rules.busyDepThreshold||FO_BUSY_DEP_DEFAULT;
    const busyDays=[];const fdaShortDays=new Set();
    for(let i=0;i<7;i++){
    const fneed=fdaNeeded(wk,i);const fhave=countWorking("Front Desk Agents",i);if(fneed&&fhave<fneed){addShort("Front Desk Agents",i,fhave,fneed);fdaShortDays.add(i);}else if(fneed&&fhave>=fneed+OVERSTAFF_MARGIN)addOver("Front Desk Agents",i,fhave,fneed);
    const bneed=transportBellNeeded(wk,i);const bhave=countWorking("Bell Attendants",i);if(bneed&&bhave<bneed)addShort("Bell Attendants",i,bhave,bneed);else if(bneed&&bhave>=bneed+OVERSTAFF_MARGIN)addOver("Bell Attendants",i,bhave,bneed);
    const vneed=eventsValetNeeded(wk,i);const vhave=countWorking("Valet",i);if(vneed&&vhave<vneed)addShort("Valet",i,vhave,vneed);else if(vneed&&vhave>=vneed+OVERSTAFF_MARGIN)addOver("Valet",i,vhave,vneed);
  }
  for(let i=0;i<7;i++){const d=(DEMAND[wk]&&DEMAND[wk][i])||{};if(((d.arr>=busyArr)||(d.dep>=busyDep))&&!fdaShortDays.has(i))busyDays.push(`${DOW[i]} (${d.arr||0} arr / ${d.dep||0} dep)`);}
  if(busyDays.length)out.push(`<li><span class="pill warn">BUSY</span> \u2265${Math.min(busyArr,busyDep)} arr/dep on ${busyDays.join(", ")} \u2014 currently staffed, but worth a second look given the volume.</li>`);
  }
  flushUnderstaffed();
  flushOverstaffed();
  // LEAVE REQUESTED conflict: a pending leave request exists for this person/day, but they are still scheduled to
  // work (all-day request = any working assignment conflicts; part-day request = only flagged if the scheduled
  // shift actually overlaps the requested off-window). Denied/approved requests never reach here (pendingReqFor
  // only returns status==="pending"), so this flag disappears automatically once a request is decided.
  dept.staff.forEach(s=>{for(let i=0;i<7;i++){
    const preq=pendingReqFor(DEPT,s.n,weekKey(dayDate(i)));if(!preq)continue;
    const v=cellVal(s.n,i);if(classify(v)!=="work")continue;
    const conflicts=preq.part?shiftOverlaps(v,preq.startTime||"00:00",preq.endTime||"23:59"):true;
    if(conflicts)out.push(`<li><span class="pill warn">LEAVE REQUESTED</span> ${s.n} requested ${preq.code} ${preq.part?"("+(preq.startTime||"00:00")+"\u2013"+(preq.endTime||"23:59")+") ":""}on ${DOW[i]} (pending approval) but is scheduled ${v}.</li>`);
  }});
  // APPROVED LEAVE conflict: an approval normally stamps the leave code straight onto the schedule cell, but the
  // schedule stays editable afterward — if someone later overwrites that cell with a working shift, this surfaces
  // it instead of letting an approved-but-since-overridden day slip through silently. (Denied requests never stamp
  // anything and never reach here; once approved, this flag only appears if a conflicting edit happens afterward.)
  Object.values(LEAVE_REQUESTS).filter(r=>r.status==="approved"&&r.dept===DEPT).forEach(r=>{
    const st=dept.staff.find(x=>x.n===r.name);if(!st)return;
    for(let i=0;i<7;i++){const iso=weekKey(dayDate(i));if(iso<r.from||iso>r.to)continue;
      const v=cellVal(r.name,i);if(classify(v)!=="work")continue;
      const conflicts=r.part?shiftOverlaps(v,r.startTime||"00:00",r.endTime||"23:59"):true;
      // UPGRADED to red (err), matching the shift editor's hard-block severity for this exact scenario (see
      // recalc()) — an approved leave request being violated is a confirmed problem, not just something pending
      // review. This passive flag is now the SAFETY NET for edits that somehow bypassed the shift editor's hard
      // block (e.g. import, paste, or a future bulk-edit path) rather than the primary defense.
      if(conflicts)out.push(`<li><span class="pill err">CONFLICT</span> ${r.name} has an APPROVED ${r.code} leave request ${r.part?"("+(r.startTime||"00:00")+"\u2013"+(r.endTime||"23:59")+") ":""}on ${DOW[i]}, but is scheduled ${v} \u2014 check for a conflicting edit made after approval.</li>`);
    }
  });
  // DUPLICATE LEAVE REQUESTS (new, per feedback): catches any already-existing overlapping requests for the
  // same person/department (pending or approved, excluding denied) that predate this round's submission-time
  // dedupe check — same "Availability conflicts" bucket as other scheduling-clash flags, since this is
  // conceptually the same kind of problem (two conflicting claims on the same time).
  {const seen=new Set();
  Object.values(LEAVE_REQUESTS).filter(r=>r.dept===DEPT&&r.status!=="denied").forEach(r=>{
    const dupes=Object.values(LEAVE_REQUESTS).filter(o=>o.id!==r.id&&o.dept===r.dept&&o.name===r.name&&o.status!=="denied"&&!(r.to<o.from||r.from>o.to));
    if(dupes.length){const pairKey=[r.name,r.from,r.to].sort().join("|");if(seen.has(pairKey))return;seen.add(pairKey);
      out.push(`<li><span class="pill warn">CONFLICT</span> ${r.name} has ${dupes.length+1} overlapping leave requests covering ${r.from}${r.to!==r.from?"\u2192"+r.to:""} \u2014 review and deny the incorrect one(s).</li>`);}
  });}
  // PT hour caps (20-32h) — CONFIRMED with the hotel: applies to every part-timer, both departments. VERIFIED
  // behavior: PT MIN now fires for ANY week under 20h, INCLUDING a week with 0 hours scheduled (previously 0h
  // weeks were silently skipped) — the one exception is a PT staffer who is on leave/unavailable every single
  // day that week (a fully-covered absence), which is excluded since that 0h is clearly intentional, not an
  // oversight. Former (no-longer-employed) staff are also excluded since they should never appear on new weeks.
  // PT flags are grouped into their OWN category ("Part-time hours"), separate from "Availability conflicts" — one
  // combined bullet lists everyone under the 20h minimum, another lists everyone over the 32h max, each with a
  // "+N more" expander (same pattern as the Unassigned-by-day list) instead of one line per person.
  // FIXED A REAL BUG this round (confirmed via the shift editor's OWN more-accurate live estimate showing "~34h
  // would exceed 32" for a case this exact check was silently missing): this used to estimate weekly hours with a
  // FLAT "days-worked \u00d7 7.5" guess, completely ignoring each day's ACTUAL entered shift length. For anyone whose
  // real shifts run longer than 7.5h (e.g. two 8.5h shifts \u2192 flat estimate says 4\u00d77.5=30h, under the 32h cap and
  // therefore never flagged \u2014 but the true total is over 32h and SHOULD be flagged), this silently under-counted
  // and produced false negatives. Now reuses personWeek(s).hrs, the exact same real, per-day-accurate hour
  // calculation (including break-time subtraction) already used everywhere else in the app (overtime, cost,
  // grid hours display), so the Checks panel and the shift editor's live estimate can never disagree again.
  const ptUnder=[],ptOver=[];
  {
  const ptMin=PT_MIN_HRS,ptMax=PT_MAX_HRS;dept.staff.filter(s=>s.type==="PT"&&s.employed!==false).forEach(s=>{
    let leaveDays=0;
    for(let i=0;i<7;i++){if(classify(cellVal(s.n,i))==="leave")leaveDays++;}
    const est=personWeek(s).hrs;
    const fullyOnLeave=(leaveDays===7);
    if(est>ptMax)ptOver.push(`${s.n} (~${est}h scheduled)`);
    if(!fullyOnLeave&&est<ptMin)ptUnder.push(`${s.n} (~${est}h scheduled)`);
  });}
  if(!weekIsPast())dept.staff.forEach(s=>{for(let i=0;i<7;i++){if(classify(cellVal(s.n,i))!=="work")continue;const dn=DOW[i];const av=(s.avail&&s.avail[dn])||(s.off&&s.off.includes(dn)?{off:true}:null);if(av){const sched=cellVal(s.n,i);const clashes=av.off?true:shiftOverlaps(sched,av.from||"00:00",av.to||"23:59");if(clashes){const un=av.off?"all day":`${av.from||"00:00"}\u2013${av.to||"23:59"}`;out.push(`<li><span class="pill warn">CONFLICT</span> ${s.n} is unavailable ${dn} (${un})${av.reason?" \u2014 "+av.reason:""}, but is scheduled ${sched}.</li>`);}}}});
  dept.staff.forEach(s=>{const w=personWeek(s);if(w.unk)out.push(`<li><span class="pill warn">HOURS?</span> ${s.n}: ${w.unk} day(s) with unreadable hours \u2014 enter a time window (e.g. 14:00-22:30).</li>`);});
  // LONG SHIFT (re-worked per feedback): shifts spanning 16h+ are no longer rejected as unreadable (see
  // shiftHours()) — instead they calculate normally and get flagged here for a human to confirm, consolidated
  // into one bullet across all staff/days rather than one line each.
  {const longShifts=[];dept.staff.forEach(s=>{for(let i=0;i<7;i++){if(classify(cellVal(s.n,i))!=="work")continue;const hh=shiftHours(cellVal(s.n,i));if(hh!=null&&hh>LONG_SHIFT_HRS_THRESHOLD)longShifts.push(`${s.n} ${DOW[i]} (${hh}h)`);}});
  if(longShifts.length)out.push(`<li><span class="pill warn">LONG SHIFT</span> ${longShifts.length} shift(s) over ${LONG_SHIFT_HRS_THRESHOLD}h \u2014 double-check these are intentional: <span class="muted">${longShifts.slice(0,6).join(", ")}${longShifts.length>6?` <a href="javascript:void(0)" onclick="this.nextSibling.style.display='inline';this.style.display='none';return false" style="color:#1b4b8a">(+${longShifts.length-6} more)</a><span style="display:none">, ${longShifts.slice(6).join(", ")}</span>`:""}.</span></li>`);}
  if(!weekIsPast()){const una=[];for(let i=0;i<7;i++){const list=dept.staff.filter(s=>s.employed!==false&&!s.oncall&&s.role!=="Relievers (on-call)"&&!(s.role||"").startsWith("Outsourced")&&!cellVal(s.n,i)).map(s=>s.n);if(list.length){const _sid="una_"+DEPT+"_"+i;una.push(`<li><span class="pill" style="background:#eef2f6;color:#4a4a4a">UNASSIGNED</span> ${DOW[i]}: ${list.length} \u2014 <span class="muted">${list.slice(0,8).join(", ")}</span>${list.length>8?` <a href="javascript:void(0)" onclick="this.nextSibling.style.display='inline';this.style.display='none';return false" style="color:#1b4b8a">(+${list.length-8} more)</a><span style="display:none" class="muted">, ${list.slice(8).join(", ")}</span>`:""}</li>`);}}if(una.length)out.push(...una);}
  // combined PT-hours bullets (one for under-20h, one for over-32h), each with a "+N more" expander — kept in their
  // OWN "Part-time hours" category, separate from "Availability conflicts" (a scheduling-clash concept, not an hours concept).
  const ptFlags=[];
  if(ptUnder.length)ptFlags.push(`<li><span class="pill warn">PT FLOOR</span> Under ${PT_MIN_HRS}h this week (${ptUnder.length}): <span class="muted">${ptUnder.slice(0,8).join(", ")}</span>${ptUnder.length>8?` <a href="javascript:void(0)" onclick="this.nextSibling.style.display='inline';this.style.display='none';return false" style="color:#1b4b8a">(+${ptUnder.length-8} more)</a><span style="display:none" class="muted">, ${ptUnder.slice(8).join(", ")}</span>`:""}</li>`);
  if(ptOver.length)ptFlags.push(`<li><span class="pill warn">PT CAP</span> Over ${PT_MAX_HRS}h this week (${ptOver.length}): <span class="muted">${ptOver.slice(0,8).join(", ")}</span>${ptOver.length>8?` <a href="javascript:void(0)" onclick="this.nextSibling.style.display='inline';this.style.display='none';return false" style="color:#1b4b8a">(+${ptOver.length-8} more)</a><span style="display:none" class="muted">, ${ptOver.slice(8).join(", ")}</span>`:""}</li>`);
  el("flags").innerHTML=(function(){
    if(!out.length&&!ptFlags.length)return `<li><span class="pill ok">OK</span> No issues for this week.</li>`;
    // ADDED "Overstaffed" category this round (new flag type). Each category is now wrapped in its own <details>
    // (per feedback: "consider making understaffed sections collapsible") — OPEN by default so nothing is hidden
    // that wasn't visible before, but any category can now be individually collapsed once reviewed, rather than
    // the whole Checks panel being one long, always-fully-expanded list regardless of how many items it holds.

// reported: "I made a change in local copy then clicked connect... but wasn't prompted"): PENDING used to be a
// plain in-memory variable, always starting false on every page load/refresh — but local edits are durably saved
// to localStorage. So if a user made a local edit, then reopened/refreshed the app (even much later) BEFORE
// clicking Connect, the app had completely lost track that unpushed changes existed, and the "upload to live?"
// prompt would silently never fire, even though real local-only data was sitting there. Fixed by persisting this
// as a durable flag (hotel_pending_dirty) that survives reloads, initialized from storage instead of hardcoded false.

// FIXED (per feedback): the status bar previously showed a PERSISTENT "⬆ Upload to live" link any time PENDING
// was true — an always-on button, not the requested pop-up-only behavior. That link is now removed from the status
// bar entirely; uploading is instead driven ONLY by pop-up confirmations at the two moments that actually matter —
// going from offline/local to live (connect(), and the "online" event below) — exactly as requested. A small,
// non-intrusive manual fallback ("Upload now" button) still exists in Settings \u2192 Live sync, in case a user
// dismisses a pop-up and wants to retry later without waiting for another reconnect/online event.
// FIXED (per explicit feedback): removed the "pending" pill that always sat next to the local/live status dot —
// no persistent visual indicator should show at all. The ONLY way pending-upload is surfaced now is the pop-up
// confirmation at the two moments that matter: connecting to a live project (connect()), or coming back online
// while a live connection exists (the "online" event below) — both go through maybeUploadOnConnect(), which also
// checks for and lists any conflicts with the current live version before asking. A manual "Upload now" button
// still exists in Settings \u2192 Live sync as a quiet fallback if a pop-up is dismissed, but nothing shows in the
// status bar itself.

// Detects genuine conflicts between this device's local (pre-pull) edits and what's actually live right now, for
// the specific cells/rows this device has pending changes for — NOT a full-database diff, just the parts that
// matter (where uploading local would silently overwrite something newer that arrived from elsewhere). Returns a
// short human-readable list for the confirmation pop-up so a real conflict is visible BEFORE the user chooses to
// upload, rather than discovered only afterward in the change log.
function findUploadConflicts(localSnapshot){
  const conflicts=[];
  ["FO","HSK"].forEach(dept=>{
    const localWeeks=(localSnapshot.assign&&localSnapshot.assign[dept])||{};
    Object.keys(localWeeks).forEach(wk=>{
      const localStaff=localWeeks[wk]||{};const liveStaff=(ASSIGN[dept]&&ASSIGN[dept][wk])||{};
      Object.keys(localStaff).forEach(nm=>{
        const localDays=localStaff[nm]||{};const liveDays=liveStaff[nm]||{};
        for(let d=0;d<7;d++){
          const lv=localDays[d],rv=liveDays[d];
          // only a real conflict if live has something DIFFERENT from local AND live wasn't simply empty before
          // (an empty/undefined live cell just means nobody else touched it \u2014 not a conflict, safe to overwrite)
          if(rv!=null&&rv!==""&&lv!==rv){conflicts.push(`${nm} \u2014 ${dept} ${DOW[d]} (${wk}): your copy has "${lv||"(blank)"}", live has "${rv}"`);}
        }

    });

async function maybeUploadOnConnect(fromOnlineEvent){

  const conflicts=findUploadConflicts(localSnapshot);
  const conflictMsg=conflicts.length?("\n\n\u26a0 "+conflicts.length+" conflicting cell(s) found \u2014 uploading will overwrite these with your local version:\n"+conflicts.slice(0,8).join("\n")+(conflicts.length>8?`\n...and ${conflicts.length-8} more.`:"")):"\n\n(No conflicts detected \u2014 nothing else changed these same cells.)";
  ASSIGN=JSON.parse(JSON.stringify(localSnapshot.assign)); // restore local values so pushPending() uploads YOUR edits, not the just-pulled live ones

}

// FIXED a real bug (per feedback: "sync error even when local/downloaded", "in local/offline mode I still see sync
// error pill which doesn't make sense"): disconnect() previously nulled DB and switched the status to "local" but
// NEVER cleared SYNC_ERR — so an error from the connection you just left showed forever afterward, even though
// there's no longer any connection for that error to be about. A sync error only makes sense while DB is
// non-null (an actual attempted operation failed); disconnecting always clears it now, restoring the invariant
// that SYNC_ERR can only be set while a connection genuinely exists.

function subscribe(){
  if(!DB)return;
  CHAN=DB.channel("sched")
    .on("postgres_changes",{event:"*",schema:"public",table:"assignments"},payload=>{
      const r=payload.new||payload.old;if(!r)return;
      ASSIGN[r.dept]=ASSIGN[r.dept]||{};ASSIGN[r.dept][r.week]=ASSIGN[r.dept][r.week]||{};
      ASSIGN[r.dept][r.week][r.staff]=r.days||{};save("hotel_assign",ASSIGN);
      if(r.dept===DEPT&&r.week===weekKey(WEEK_START))render();
    })
    .on("postgres_changes",{event:"*",schema:"public",table:"demand"},payload=>{
      const r=payload.new||payload.old;if(!r)return;DEMAND[r.week]=r.days||{};save("hotel_demand",DEMAND);
      if(r.week===weekKey(WEEK_START))render();
    })
    .on("postgres_changes",{event:"*",schema:"public",table:"leave_requests"},payload=>{
      const r=payload.new||payload.old;if(!r||!r.id)return;LEAVE_REQUESTS[r.id]=r.data||{};save("hotel_leaverequests",LEAVE_REQUESTS);
      if(VIEW==="leave")render();
    })
    .subscribe((status,err)=>{
      // surfaces realtime subscription failures (e.g. "demand"/"assignments" table not added to the Supabase
      // realtime publication, or an RLS policy blocking it) instead of silently never receiving live updates
      if(status==="CHANNEL_ERROR"||status==="TIMED_OUT"||status==="CLOSED"){reportSyncError("realtime subscription ("+status+")",err||{message:"channel closed/errored — other screens will not receive live updates until this reconnects"});}
      else if(status==="SUBSCRIBED"){clearSyncError();}
    });

async function pullAll(){

    if(e1){reportSyncError("pull assignments",e1);return;}
    (as||[]).forEach(r=>{ASSIGN[r.dept]=ASSIGN[r.dept]||{};ASSIGN[r.dept][r.week]=ASSIGN[r.dept][r.week]||{};ASSIGN[r.dept][r.week][r.staff]=r.days||{};});
    const {data:dm,error:e2}=await DB.from("demand").select("*");
    if(e2){reportSyncError("pull demand",e2);return;}
    (dm||[]).forEach(r=>{DEMAND[r.week]=r.days||{};});
    const {data:lr,error:e3}=await DB.from("leave_requests").select("*");
    if(e3){reportSyncError("pull leave requests",e3);return;}
    (lr||[]).forEach(r=>{if(r.id)LEAVE_REQUESTS[r.id]=r.data||{};});
    save("hotel_assign",ASSIGN);save("hotel_demand",DEMAND);save("hotel_leaverequests",LEAVE_REQUESTS);clearSyncError();render();
  }catch(e){reportSyncError("pull",e);}
}

/* ---------- OPTIMIZATION SCAFFOLD (auditable auto-fill) ----------
   Structure for a future real optimizer. Today: a greedy, EXPLAINABLE suggester that
   fills unstaffed coverage gaps from eligible, available people ranked by fewest weekly hours.
   Every pick is logged so a human can verify — no black box. */
function eligibleFor(dept,role,day,name){
  const s=dept.staff.find(x=>x.n===name);if(!s)return{ok:false,why:"unknown"};
  if(s.role!==role)return{ok:false,why:"different role"};
  const cur=cellVal(name,day);if(classify(cur)==="work")return{ok:false,why:"already working"};
  if(classify(cur)==="leave")return{ok:false,why:"on leave/PTO"};
  const _dn=DOW[day];if(s.avail&&s.avail[_dn]&&s.avail[_dn].off)return{ok:false,why:"unavailable ("+_dn+")"};
  const dname=DOW[day];
  if(s.off&&s.off.includes(dname))return{ok:false,why:"unavailable ("+dname+", personal constraint)"};
  // REMOVED the stale s.unavailable[dname] check (same root cause as recalc() above — see the migration comment):
  // that field is now deleted after migration, and the full-day s.avail[_dn].off case is already checked above.
  // A PART-DAY constraint (e.g. a class window) intentionally does NOT exclude someone from "could assign"
  // suggestions entirely, since a different, non-overlapping shift time might still be perfectly fine for that
  // day — Auto-fill's own shift-time selection combined with the Checks-panel CONFLICT flag (which IS
  // time-overlap-aware) together catch a genuine conflict if one actually gets introduced.
  // weekly off norm: don't schedule a 6th working day
  let work=0;for(let i=0;i<7;i++)if(classify(cellVal(name,i))==="work")work++;
  if(work>=5)return{ok:false,why:"already 5+ days"};

  if(s.type==="PT"){const est=(work+1)*HRS_PER_SHIFT;if(est>PT_MAX_HRS)return{ok:false,why:"PT cap"};}
  return {ok:true, hrs:personWeek(s).hrs};
}
async function optimizeWeek(){
  if(!EDIT||weekLocked()){uiAlert("Enter edit mode on an unlocked week to auto-fill.");return;}
  if(!(await uiConfirm("Auto-fill fills only EMPTY cells for understaffed roles, spreading hours to the least-scheduled eligible staff. Existing entries are untouched. Proceed?")))return;
  const dept=CFG[DEPT];const wk=weekKey(WEEK_START);const log=[];let filled=0;
  function need(role,day){ let n=dept.coverage[role]?dept.coverage[role].min:0;
    if(DEPT==="HSK"){ if(role==="Room Attendants")n=Math.max(n,raNeeded(wk,day)); if(role==="Supervisors")n=Math.max(n,supsNeeded(wk,day)); }
    if(DEPT==="FO"){ if(role==="Front Desk Agents")n=Math.max(n,fdaNeeded(wk,day)); if(role==="Bell Attendants")n=Math.max(n,transportBellNeeded(wk,day)); if(role==="Valet")n=Math.max(n,eventsValetNeeded(wk,day)); }
    return n; }
  const defShift=(DEPT==="FO"?SHIFTS_FO[2]:SHIFTS_HSK[2]); // a sensible default working shift
  dept.roles.forEach(role=>{
    const roleShift=ROLE_DEFAULT_SHIFT[role]||defShift; // staffing-limited roles (Concierge/Greeter/Bell Captain/Guest Service Supervisors) default to 11:00-19:00
    for(let day=0;day<7;day++){
      let have=countWorking(role,day);const want=need(role,day);
      if(!want||have>=want)continue;
      // rank eligible people by fewest weekly hours (spread the load)
      const cands=dept.staff.filter(s=>s.role===role).map(s=>({s,e:eligibleFor(dept,role,day,s.n)}))
        .filter(x=>x.e.ok).sort((a,b)=>a.e.hrs-b.e.hrs);
      for(const c of cands){ if(have>=want)break; setCellQuiet(c.s.n,day,roleShift);have++;filled++;
        log.push(`${DOW[day]} ${role}: +${c.s.n} (had ${c.e.hrs}h) → ${roleShift}`); }
      if(have<want)log.push(`${DOW[day]} ${role}: still short ${want-have} (no eligible staff)`);
    }
  });
  save("hotel_assign",ASSIGN);pushWeekAll(DEPT,wk);render();
  uiAlert("Auto-fill placed "+filled+" shift(s). Review before posting.\n\n"+(log.slice(0,20).join("\n")||"Nothing to fill."));
}

// NEW this round (item #24): the single entry point for clicking a "Pending" pill in the Leave Requests table.
// If the clicker ALREADY has decide-access for this request's department, swaps the pill directly into the
// Approve/Deny controls in place (no full-table re-render, so it feels instant). If they do NOT yet have access,
// runs the exact same PIN/Supabase gate requestEditAccessForDept() already used elsewhere.
// FIXED A REAL BUG this round (per feedback: "as soon as pending pill clicked I want dropdown to show instead of
// having to reclick pending"): the not-yet-authorized branch previously only called renderLeaveTab() after a
// successful PIN/Supabase gate — which redraws the WHOLE table back to its default state (every pending request
// shown as a plain pill again, including the one just authorized), requiring the user to click that same pill a
// SECOND time to actually see the Approve/Deny controls. Fixed by re-checking canDecideLeaveRequest(r) immediately
// after the gate succeeds and, if now true, swapping that SAME row's pill into the controls right away — using the
// row's data-lrid attribute to re-locate it after the re-render (the original pillEl reference is stale once
// renderLeaveTab() rebuilds the table), so authorization and reveal happen in one click, not two.
// FOUND AND FIXED A SECOND, GENUINE BUG this round (per feedback, reported again: "still not fixed... I want
// clicking the pill to make the dropdown IMMEDIATELY open... instead of having to reclick"): the previous fix
// correctly swapped the pill into a <select> element in one click, as intended — but a freshly-inserted native
// <select> does NOT auto-open its own dropdown list just by existing in the DOM; browsers require a SEPARATE
// click directly on the select control itself to see its options. That extra required click is exactly the "one

// browser, with no follow-up click required to "open" anything.
function swapPendingPillToButtons(id){
