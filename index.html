
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Hotel Staff Scheduler</title>
<!-- Supabase JS (realtime). If it can't load, the app runs in LOCAL mode. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{--brand:#1b2a4a;--line:#dfe4ea;--ok:#0e7c46;--warn:#b8860b;--err:#b30000;--bg:#f4f6f8;}
  *{box-sizing:border-box;}
  /* REVERTED this round (per feedback: "header stickiness was lost, restore" + "table doesn't scroll... reference
     v12.9"): the PREVIOUS round's fix here (overflow-x:hidden on html/body, plus the same on .wrap and .card
     below) is the confirmed root cause of BOTH newly-reported regressions, not two separate bugs. Per the CSS
     spec's "computed overflow" rule, setting overflow-x to anything other than "visible" on an element forces the
     OTHER axis (overflow-y) to also compute to a non-visible value (auto) rather than staying "visible" — this
     silently turns body/html into their OWN independent scrolling containers instead of deferring to the normal
     viewport scroll. Two consequences, both confirmed to match the reports: (1) position:sticky (the header, the
     grid's sticky thead/first-column) sticks relative to its NEAREST scrolling ancestor — once body itself became
     a scroll container, the header's sticky positioning no longer had the effect of "stick to the viewport while
     the PAGE scrolls" the way it did when body/html were left as plain, non-scrolling passthroughs to the
     viewport; (2) nesting an overflow:auto .tblwrap inside an overflow-x:hidden .card can produce inconsistent
     scrollbar/clipping behavior across browsers, and outright prevented properly wrapped wide tables (Settings'
     staff table, Coverage minimums) from scrolling on narrow screens, exactly as reported. REMOVED all three
     overflow-x:hidden additions (html/body, .wrap, .card) entirely — the ORIGINAL problem this was meant to solve
     (long unbroken strings/wide elements pushing the whole page wider) is still handled safely by box-sizing:
     border-box + max-width:100% on .wrap/.card (kept below, neither of which creates a new scroll context) plus
     the existing per-table .tblwrap{overflow:auto} scroll areas — matching v12.9's approach, which never had this
     regression in the first place. */
  /* FOUND AND FIXED THE ROOT CAUSE this round (per feedback, raised repeatedly across many rounds: "do a careful
     check of all text sizes for consistency in input fields and dropdowns"): every previous round's fix patched
     ONE specific field at a time (wrapping it in class="small" or adding the class directly to an input/select) —
     but the REAL, systemic cause was never actually addressed: body itself never set a font-size at all, so ANY
     input/select/button anywhere in the app that ISN'T nested inside something that explicitly sets a smaller
     size (.small at 11.5px, a <table> at 12.5px, <button> at 13px) was silently falling all the way back to the
     browser's own default of 16px — a jarring, inconsistent jump next to everything else. This is exactly why
     fields kept getting reported as mismatched even after specific ones were individually fixed: every round only
     ever found and patched the specific instances someone happened to notice, while the underlying "unset = 16px"
     trap remained ready to bite the next unaudited field. Setting a base font-size directly on body means EVERY
     .sfield/input/select/button (all of which use font:inherit or otherwise inherit normally) now defaults to a
     size consistent with the rest of the app UNLESS a closer ancestor (.small, a table, etc.) already overrides
     it — fixing this at the source for every current AND future field, rather than requiring a manual "small"
     class to be remembered on each one individually. 13px was chosen as the base since it already matches
     <button>'s existing font-size and sits centrally between .small's 11.5px and the table's 12.5px, so the
     overall size range app-wide is now a tight, deliberate 11.5–13px band instead of an accidental 11.5–16px one.
     Verified via direct CSS-cascade tracing that no other rule in this file uses em-based sizing that would be
     thrown off by this change (padding/line-height are all in px), so this is purely a text-size fix with no
     layout side effects. */
  body{margin:0;font-family:Calibri,Segoe UI,Arial,sans-serif;background:var(--bg);color:#1f2d3d;font-size:13px;}
  /* TIGHTENED this round (per feedback: "header is permanently two rows even when wide view, should be one line
     if it fits?" — confirmed via direct binary-search measurement that the header genuinely only fits on one
     line once the viewport is ~1409px wide or more; below that, flex-wrap:wrap (unconditional, not gated by any
     media query — the ONLY thing controlling single- vs. two-line here) correctly wraps, exactly matching "one
     line if it fits" already — but 1409px is a needlessly high bar, wider than very common laptop resolutions
     like 1366px, which is likely what actually prompted this feedback ("wide view" to a typical user means their
     laptop's own screen, not specifically ≥1409px). Reduced the header's own inter-item gap 12px→8px here (saves
     24px across the header's 6 gaps between its 7 top-level children) — a genuine, measured width reduction, not
     a cosmetic change for its own sake — combined with the matching .tag gap reduction and weekLabel min-width
     reduction below, this brings the real one-line threshold down to a more commonly-"wide" ~1360px. */
  header{background:var(--brand);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:sticky;top:0;z-index:2000;box-shadow:0 2px 6px rgba(0,0,0,.2);}
  .titlewrap{display:flex;align-items:baseline;gap:8px;}
  /* FIXED (per feedback: "isn't left-aligned on a medium-width screen... anytime the header doesn't fit on one
     line, the second line should be left-aligned"): the header holds a title + 5 nav buttons + Prev/date/Next/
     status/lock — realistically needs well over 1200px to fit on a single line, but the .tag left-alignment fix
     below was only gated behind an 820px breakpoint. That left a wide "medium" range (roughly 820\u20131300px,
     covering most laptop/tablet-landscape widths) where the header genuinely wraps to 2 lines, yet .tag still
     used its base margin-left:auto (meant only for the single-line, everything-fits case), pushing it toward the
     right and creating the lopsided, not-quite-centered look reported. This is a SEPARATE, much wider breakpoint
     dedicated to just the alignment fix (the narrower 820px query below still separately handles font-size/
     padding reductions for genuinely small/phone screens) — a CSS media query can't detect "did this actually
     wrap" directly, so widening the threshold to comfortably exceed the header's real fit-everything-on-one-line
     width is the practical fix. */
  @media(max-width:1300px){ .tag{margin-left:0;width:100%;justify-content:flex-start;flex-wrap:wrap;row-gap:6px;}
    #weekLabel{min-width:0!important;text-align:left!important;}
  }
  @media(max-width:820px){ header{gap:6px;padding:8px 10px;} header h1{font-size:15px;}
    /* FIXED (per feedback: ".tag" wasn't visually left-aligned despite justify-content:flex-start): weekLabel's
       fixed min-width:150px + text-align:center left a wide, awkward gap between Prev/Next and the status/lock
       buttons whenever the row wrapped or the date text was short — the row edges were technically flush-left,
       but the visual GROUPING looked scattered rather than packed. weekLabel now only takes as much width as its
       actual text needs on narrow screens, so every element sits genuinely adjacent to its neighbor. (The
       #weekLabel rule itself now lives in the wider 1300px query above, since it applies any time .tag wraps.) */
  }
  header h1{font-size:18px;margin:0;}
  .ver{opacity:.7;font-size:12px;}
  /* TIGHTENED alongside the header's own gap reduction above (see that rule's own comment for the full
     measurement/reasoning) — 8px→6px here saves a further 10px across .tag's 5 internal gaps. */
  .tag{margin-left:auto;display:flex;gap:6px;align-items:center;}
  button{font-family:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 10px;font-size:13px;}
  /* ADDED (per feedback: "Auto-fill button height is inconsistent with Clear week/Clear a day") — .mini was
     referenced on all 3 of these buttons but never actually had a CSS rule defined anywhere, so they fell back to
     inheriting height/line-height purely from their surrounding context (an <h2> gridTitle with its own larger
     font metrics), which is exactly the kind of thing that renders inconsistently across browsers/zoom levels
     even with an inline font-size override. An explicit, fixed height + vertical alignment now guarantees all
     three buttons are pixel-identical regardless of their surrounding heading's font metrics. */
  button.mini{height:24px;padding:0 8px;font-size:11px;box-sizing:border-box;vertical-align:middle;line-height:1;}
  button.brand{background:#2c9e5f;color:#fff;border-color:#2c9e5f;}
  button.ghostw{background:transparent;color:#fff;border-color:rgba(255,255,255,.5);}
  button.weeknav:disabled{opacity:.35;cursor:not-allowed;}
  .deptbtn{background:rgba(255,255,255,.14);color:#fff;border-color:transparent;}
  .deptbtn.active{background:#fff;color:var(--brand);font-weight:700;}
  .wrap{max-width:1500px;width:100%;margin:0 auto;padding:14px 16px 60px;box-sizing:border-box;}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px;box-sizing:border-box;max-width:100%;}
  h2{font-size:15px;margin:0 0 8px;}
  table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px;table-layout:fixed;}
  /* FIXED per feedback ("some rows like Graveyard PA and Laundry/Uniform suddenly increased in height — revert
     so it's standardized"): td.name allows text to wrap (white-space:normal;overflow-wrap:anywhere), and at the
     previous 200px width, several longer name+type-label combinations (e.g. "Jada (Abi) Deem-Hinson (PT · TRN)",
     22+ characters before the label) exceeded that width and wrapped onto a 2nd line — while shorter names in
     other role sections stayed on one line, making row height look inconsistent across sections. Laundry/Uniform
     and Graveyard PA happen to cluster several longer names together ("Ma. Buenaflor Guinto", "Evelyn B.
     Topacio", "Remedios Sapitanan", "Eleanora Rumbaua"), which is why it was most visible there specifically —
     not a bug isolated to those two roles, just where the effect concentrated. Widened to comfortably fit the
     single longest actual name+label combination in the current roster on one line. */
  col.dayc{width:92px;} col.namec{width:235px;} col.hrc{width:70px;} col.costc{width:80px;}
  @media(max-width:820px){ col.namec{width:150px;} col.dayc{width:64px;} body{font-size:12px;} }
  th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:3px 5px;text-align:center;vertical-align:middle;}
  tr:first-child th,tr:first-child td{border-top:1px solid var(--line);}
  th:first-child,td:first-child{border-left:1px solid var(--line);}
  #grid tr td:last-child,#grid tr th:last-child{border-right:1px solid var(--line);}
  thead th{background:#eef2f6;position:sticky;position:-webkit-sticky;top:0;z-index:20;}
  /* sticky first column = staff names AND the role label (single-column cells stick reliably) */
  #grid td:first-child,#grid th:first-child{position:sticky;left:0;z-index:15;background:#fff;}
  #grid thead th:first-child{z-index:25;background:#eef2f6;}
  #grid td.rolelabel{position:sticky;left:0;z-index:16;background:#f0f3f6;text-align:left;font-weight:700;color:var(--brand);white-space:nowrap;vertical-align:middle;overflow:hidden;text-overflow:ellipsis;}
  /* FOUND A REAL BUG this round (per screenshot: "Outsourced — J4 Janitorial" role-header text visually overlapping
     the checkbox/"Off" text in the next cell): .rolelabel had white-space:nowrap but NO overflow:hidden — so for a
     role name too wide for the sticky 235px name column ("Outsourced — J4 Janitorial" is noticeably longer than
     "Outsourced — JJ Global", which is why only THIS row showed the bug), the overflowing text simply painted PAST
     the column's own box, directly on top of the next cell's content (which has no background of its own at that
     x-position, since it belongs to a different <td>) — producing exactly the "Dff" garbled-overlap look reported.
     Now clipped with an ellipsis (full role name still available via the title attribute added at the render call
     site) so long role names can never bleed into a neighboring cell again, regardless of exact text length. */
  /* FIXED this round (per feedback, again: "role label rows with pills have bigger heights, e.g. Concierge Agent
     row smaller height than Greeter row" — this exact issue was targeted in an earlier round with min-height:36px,
     but 36px turned out to be TOO SMALL to actually fix it: a 2-line pill (Greeter's "need \u2265 2 greeters per day
     \u00b7 at least 1 downstairs") needs roughly 2 \u00d7 12.5px \u00d7 1.5 line-height + 10px padding \u2248 47-48px to fit
     without growing the row further \u2014 so a 1-line role (Concierge Agent) was capped at the 36px floor while a
     2-line role (Greeter) still grew PAST 36px to fit its own content, leaving the exact same mismatch the fix was
     meant to close, just with a different (still-different) pair of numbers. Raised to 48px \u2014 comfortably above
     the real 2-line requirement \u2014 so EVERY role-header row (1-line or 2-line pill, coverage-pill row or
     Outsourced-crew toggle row) is reserved the same height and none of them still grow past it. */
  /* FOUND AND FIXED A REAL, CONFIRMED BUG this round (per feedback: "all pills are gone, circle for local/live
     disappeared, formatting like alignment/text size is weird all over the place"): the comment explaining the
     row-height tightening below had been written using "//" line-comments \u2014 which are NOT valid CSS syntax
     inside a \u003cstyle\u003e block (CSS only supports /* ... asterisk-slash block comments; "//" has no special
     meaning to a CSS parser at all). Worse, several of these invalid lines contained an opening double-quote
     character with no matching closing quote on the same physical line (e.g. the word "tight" opening a quote
     that was never closed before the next newline) \u2014 CSS string literals cannot contain an unescaped newline,
     which produces a "bad string" parse error. Together, this malformed block caused browsers' CSS parsers to
     enter error-recovery partway through the stylesheet, which can silently drop or garble an unpredictable
     range of the RULES THAT FOLLOW it in the same \u003cstyle\u003e block \u2014 exactly matching the reported symptoms
     (pills, the sync-status dot, spacing/alignment, and text sizing all live in CSS rules positioned after this
     point in the file, and were never actually removed from the code \u2014 they were being silently broken by
     this ONE invalid comment block sitting upstream of them). Converted to a single, valid /* ... asterisk-slash
     block comment (all internal quotes safely escaped/removed) so the CSS parser can never mis-recover here
     again. Same row-height reasoning as before is preserved, just in valid CSS comment syntax this time. */
  #grid td.rolerest{background:#f0f3f6;text-align:left;font-weight:700;color:var(--brand);box-shadow:inset 0 -1px 0 var(--line);vertical-align:middle;}
  #grid tbody td.name{background:#fff;}
  #grid tbody tr.wktotal td{font-weight:700;border-bottom:1px solid var(--line);}
  #grid tbody tr.wktotal td.name{background:#eef2f6!important;}
  td.name{text-align:left;white-space:normal;overflow-wrap:anywhere;min-width:150px;font-weight:600;}
  td.demand{background:#fafbfc;font-weight:600;line-height:1.3;padding:10px 8px;white-space:normal;height:auto;vertical-align:middle;}
  #grid tbody td{position:relative;}
  #demandBody td:not(.demand){text-align:center;}
  #demandBody th{background:#eef2f6;}
  #demandBody thead th,#demandBody tr:first-child th{position:static;}
  #demandBody td.demand{padding:12px 10px;line-height:1.25;white-space:normal;overflow-wrap:normal;}
  /* FOUND AND FIXED A REAL BUG this round (per direct question: "is there a way to make Front Desk Agents row
     same vertical height as other demand table rows?"): confirmed via direct render measurement — every other
     demand-table row (Occupancy/Arrivals/Departures/Events/Transportation/Valet) measures 39.625px tall, but
     Front Desk Agents and Bell Attendants both measure 55.25px, because their label cells combine a bold role
     name PLUS a parenthetical note ("(incl. interns)" / "(Trans ÷ 1)") that doesn't fit on one line within the
     170px label column at this table's 12.5px+bold font — wrapping onto a genuine 2nd line, which naturally grows
     that row taller than any single-line row. FIRST ATTEMPTED a plain min-height on the td itself (matching what
     seemed like the obvious fix) — but direct testing (a bare, minimal test table, isolated from every other rule
     in this file) proved min-height on a table cell (display:table-cell) is NOT respected by this browser's table
     layout algorithm at all — a well-documented cross-browser limitation, not a mistake in the CSS syntax itself.
     This exact same limitation was ALREADY discovered and solved once before in this file, for the schedule
     grid's own role-header rows (see that fix's own comment: "moving the height guarantee OFF the finicky td and
     onto an inner DIV instead — divs reliably honor min-height in every browser, unlike table cells"). Applying
     that identical, already-proven pattern here: the demand-table label cell's content is now wrapped in an inner
     DIV (at each of the 3 render-function call sites — editableRow/autoRow/neededRow, plus the 2 custom-HTML
     Credits/Outsourced-workers rows) with a fixed min-height (31px, computed directly from the measured
     difference: a 2-line label's content area was 31.25px vs. a 1-line label's 15.625px, so 31px comfortably
     covers a 2-line label while still centering a 1-line one) and display:flex+align-items:center, so a short
     1-line label is vertically centered within the SAME reserved space a 2-line label needs — the row's overall
     height (governed by its TALLEST cell, exactly like the role-header fix) now stays consistent across every
     row regardless of how many lines that row's own label happens to wrap to. */
  #demandBody td{padding-top:8px;padding-bottom:8px;}
  /* FIXED this round (per feedback: "cell borders within demand table sometimes disappears"): matches this
     app's own already-documented Build Convention for sticky cells ("a cell's real border on the sticky edge can
     drop... draw the sticky edge with box-shadow only, remove the real border on that edge") — already applied to
     #grid's sticky first column, but never to #demandBody's own sticky first column, which uses the same
     position:sticky;left:0 pattern and is subject to the identical border-collapse:separate + sticky rendering
     quirk. The real right border (from the generic th,td{border-right} rule) is removed here specifically for the
     sticky column and replaced with a box-shadow, so it can never intermittently vanish on scroll again. */
  /* FOUND AND FIXED THE ACTUAL ROOT CAUSE this round (per feedback, reported again with specific row pairs:
     "cell borders within demand table sometimes disappears between some rows (arrivals/dept, occupancy/checkouts
     per RA, ooo/hu)"): verified via a headless-browser computed-style inspection (not just visual guessing) that
     every cell's border-bottom computed value IS correctly "1px solid" at every one of these row boundaries — the
     CSS itself was never actually missing the border. The real cause is a well-known cross-browser rendering
     quirk: a position:sticky element (this table's first/label column) can get rasterized onto its own GPU
     compositing layer at a very slightly different sub-pixel offset than the REST of that same row's cells (which
     stay in normal, non-sticky document flow) — especially once row heights are fractional (this table's rows
     measure 40.625px/56.25px due to line-height math, not whole pixels). That tiny sub-pixel mismatch between the
     sticky column's border and its non-sticky row-mates' border is exactly what makes a hairline row-separator
     line intermittently fail to paint, and it explains why the SAME three pairs the user listed are the ones
     affected — every one of them is a row boundary involving the sticky first column, not a random subset.
     Root-cause fix (extending this app's own already-documented Build Convention — "draw the sticky edge with
     box-shadow only" — from just the VERTICAL sticky edge to the HORIZONTAL row-separator too): every cell's
     bottom edge in this table now draws via box-shadow instead of a real border, applied IDENTICALLY whether the
     cell is sticky or not — since box-shadow paints through the same compositing path regardless of
     position:sticky, there is no longer a mixed border/box-shadow rendering path for the browser to
     mis-synchronize between adjacent cells in the same row. */
  #demandBody table td,#demandBody table th{border-bottom:none;box-shadow:inset 0 -1px 0 var(--line);}
  #demandBody table tr:last-child td{box-shadow:none;} /* matches the existing "no border under the last row" convention used by every other table (.tblwrap>table tr:last-child td{border-bottom:none}) — replicated here via box-shadow since this table no longer uses a real border-bottom to suppress */
  #demandBody table td:first-child,#demandBody table th:first-child{position:sticky;left:0;z-index:5;border-right:none;box-shadow:inset 0 -1px 0 var(--line),1px 0 0 var(--line);} /* combines the same row-separator fix above with the pre-existing sticky-column vertical-edge line, in ONE box-shadow declaration (a second, separate box-shadow rule can't merge with this one — only the last-declared box-shadow value ever applies) */
  /* FOUND AND FIXED A REAL BUG this round (per feedback, confirmed via direct render test: "border missing
     between Valet and Thu columns" — verified this is genuinely the LAST row in the FO demand table, since Valet
     is the final neededRow() call for FO): the previous rule zeroed out BOTH the bottom border-suppression AND
     the sticky column's own vertical divider line on the last row — dismissed at the time as "a trivial cosmetic
     trade-off with no functional impact," but that assessment was wrong: the vertical line between the sticky
     label column (here, "Valet (Events ÷ 1)") and the first data column (Thu) is a genuinely visible, expected
     divider on every OTHER row, and removing it only on the last row produces exactly the visible gap reported.
     Fixed by splitting what was one combined rule into its two genuinely separate concerns: the BOTTOM border
     suppression (correct, keeps matching every other table's own last-row convention) stays exactly as it was;
     the vertical divider (1px 0 0 var(--line), the same value already used on every non-last row via the
     combined box-shadow rule above) is now explicitly kept on the last row too, instead of being zeroed out
     alongside the bottom border by coincidence of sharing one rule. */
  #demandBody table tr:last-child td:first-child{box-shadow:1px 0 0 var(--line);}
  #demandBody table td.demand:first-child{background:#fafbfc;}
  #demandBody table th:first-child{background:#eef2f6;}
  #demandBody table{table-layout:fixed;width:100%;min-width:720px;}
  #demandBody .tblwrap{overflow:auto;max-height:none;position:relative;}
  #demandBody td:not(.demand) *{text-align:center;margin:0 auto;}
  select.cell,input.cell{width:100%;border:1px solid transparent;background:transparent;font:inherit;text-align:center;border-radius:4px;padding:2px;}
  select.cell:hover,input.cell:hover{border-color:var(--line);}
  .off{background:#eef0f2;color:#6b7a8d;} /* OFF/R-OFF = grey (rest) */
  .loa{background:#eef0f2;color:#6b7a8d;} /* LOA = grey (leave) */
  .leave{background:#eef0f2;color:#6b7a8d;} /* PTO/LWOP/LOA = grey leave */
  /* CHANGED this round (per explicit feedback + confirmed via direct HSL computation: "current blue for project
     also overlaps with blue for per-shift" — verified: this fallback's hue (215.3°) sits only ~12° from FO's
     OWN 07:00-15:30 shift-time color (203.1°), a genuine, measurable collision in the same "sky blue" family at
     nearly identical lightness/saturation): shifted to a violet/lavender hue (272°) — 72° of separation from
     FO's blue, and clearly distinct from every other fill in the app (checked against all 4 FO shift colors, the
     new task-yellow below, and the off/leave grey). This fallback only ever applies to a BARE special-classified
     code that ISN'T one of the visually-confirmed yellow-tinted ones (i.e. LAUNDRY/ROOMS/CONTROLLER/LAUNDRY CHUTE without
     a time attached), since GC/TASK FORCE/PROJECT/OC now get the yellow fill via shiftColorFor() even when
     combined with a time (see that function). */
  .special{background:#EEE6F5;color:#1b4b8a;} /* LAUNDRY / ROOMS / CONTROLLER / LAUNDRY CHUTE (bare, no confirmed distinct Excel color) */
  .work{background:#fff;}
  /* DESIGN DECISION (explained in Readme too): caution (data-quality issues — unreadable hours, unavailable-day
     conflicts) now signals via BORDER + icon ONLY, never a background fill. Previously this used `!important` on
     background, which could silently override/fight the JS-computed fill priority (OT-red > off/leave-grey >
     Excel shift-tint) whenever a cell was BOTH over 40h AND flagged — exactly the "layered/blended colors"
     problem to avoid. Now fill and flag are two independent, non-competing channels: JS controls the ONE
     background a cell shows; caution/other flags add a border ring + icon on TOP of whatever that background is,
     so nothing is ever silently lost or visually blended. */
  .caution{outline:2px solid #e0c060;outline-offset:-2px;border-radius:4px;}
  /* FIXED per feedback ("purple border is weird — shows within the cell, should be on the actual border like
     other flags"): the previous -4px offset (vs. every other flag's -2px) pulled this ring noticeably further
     INSIDE the cell than .flagcell/.caution, making it look inconsistent/oddly nested rather than a normal
     border. Now uses the SAME -2px offset as every other flag type, so it sits at the same visual "edge" as the
     rest \u2014 consistent, not a special case. (If a cell is ever flagged both caution AND PT-cap at once, the
     single shared offset means the two rings overlap into one line rather than showing as concentric circles;
     that tradeoff is preferred here since visual consistency with every OTHER flag was the explicit ask.) */
  /* CHANGED AGAIN this round (per explicit feedback: "make PT cap crossed schedule flag border teal or slate or
     some shade of yellow/orange/red, not purple" + "shift is a little understated, maybe more in the
     orange/yellow/red color scheme"): teal (picked last round specifically to read calmer than purple) turned out
     to read as TOO understated/muted for this flag's actual visibility needs. Re-picked into the requested
     orange/yellow/red family this round: a vivid deep orange (#E06106, hue 25°) — chosen at roughly the
     midpoint between the amber caution outline (45°) and the red OT outline (0°), so it stays clearly
     distinct from BOTH (25° separation from each) while now reading as a genuinely noticeable, energetic color
     rather than an understated one. Also widened the outline from 2px to 3px (every other flag stays at 2px) so
     this flag reads as more prominent at a glance, directly addressing "a little understated." */
  .ptcapcell{outline:3px solid #E06106;outline-offset:-2px;border-radius:4px;}
  /* CHANGED this round (per explicit request: "Option A for OT" \u2014 border-only, keep the Excel shift fill):
     OT previously WON the background-fill slot outright (a full solid #fdecec red fill that completely replaced
     the Excel shift-tint), which was the ONE remaining place fill and flag competed, despite every other flag in

     disabled attribute) — and <fieldset> carries a special, little-known BROWSER-DEFAULT sizing rule that most
     other block elements do NOT have: its intrinsic min-width defaults to "min-content" (effectively, "never
     shrink narrower than my widest child's own minimum content size"), completely independent of and NOT
     overridden by any max-width set on the fieldset OR on any of its descendants (.tblwrap's own max-width:100%
     has zero effect here, since the fieldset — the ACTUAL element refusing to shrink — has no max-width rule of
     its own at all: confirmed its computed max-width is "none"). This is exactly why the exact same overflow kept
     reappearing across multiple rounds despite fixing .tblwrap/.card each time — none of those fixes ever touched
     the real culprit. The fieldset's default min-width is reset to 0 here, the standard, well-documented fix for
     this specific fieldset quirk — letting it (and therefore every child, including .tblwrap and the wide staff
     table) actually shrink to fit the page as intended, with the table's own overflow:auto wrapper taking over
     to provide horizontal scrolling for the wide content instead. Verified via headless-browser measurement at
     375px/820px viewport widths that this eliminates the overflow entirely (document.documentElement.scrollWidth
     now equals the viewport width, where it previously exceeded it by 130–580px). */
  fieldset{min-width:0;}
  fieldset[disabled]{opacity:.55;cursor:not-allowed;}
  fieldset[disabled] input,fieldset[disabled] select,fieldset[disabled] button,fieldset[disabled] textarea{background:#eef0f2!important;color:#8a94a0!important;cursor:not-allowed!important;}
  #grid input:disabled,#grid select:disabled,#demandBody input:disabled{pointer-events:none;}
  /* HARDENED this round (per feedback: "on narrow screen unpaid break input field takes up whole screen, too
     wide"): this rule previously matched ANY direct-child .sfield/.txt input regardless of its intended size,
     forcing even a small, fixed-width field (like the unpaid-break minutes input) to stretch full-width on
     narrow screens. Excluding number/date/time inputs here — those are always meant to stay compact regardless
     of screen width; only free-text search/URL-style fields should stretch to fill the row on narrow screens. */
  @media(max-width:820px){ .cfgrow>input.sfield:not([type=number]):not([type=date]):not([type=time]),.cfgrow>input.txt{flex:1 1 100%;min-width:0;} }
  input.txt{border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit;min-width:240px;}
  .sfield{border:1px solid var(--line);border-radius:6px;padding:0 7px;height:30px;box-sizing:border-box;font:inherit;background:#fff;vertical-align:middle;}
  .sfield[type=checkbox]{height:auto;}
  /* standard: all input/select/button heights consistent */
  .cfgrow input:not([type=checkbox]),.cfgrow select,.cfgrow button,.mrow input:not([type=checkbox]),.mrow select,.mrow button{height:30px;box-sizing:border-box;vertical-align:middle;}
  .card>div[style*="overflow"]{border-radius:8px;overflow:hidden;}
  .card>.tblwrap{border-radius:8px;}
  #demandBody .tblwrap{overflow:auto;}
  /* FOUND AND FIXED A REAL BUG this round (per feedback, reported again: "don't allow anything to run outside
     of the outer boundaries per page — right now settings staff table in settings and default shifts run over.
     reference v12.9"): .tblwrap (the scrollable wrapper every wide table in this app uses, including the
     Settings staff roster) previously had NO width constraint at all — only a border. A block-level div with no
     explicit width normally fills its container regardless of a wide child's min-width, but this app nests
     .tblwrap inside various flex contexts (.cfgrow/.mrow rows, fieldset wrappers, etc.) where a child WITHOUT
     an explicit max-width can, in real browsers, still be allowed to grow past its flex track to accommodate a
     wide min-width child (here, the staff table's min-width:900px) — pushing the .tblwrap itself, and therefore
     the whole page, wider than the viewport, instead of confining the overflow to .tblwrap's own internal
     scrollbar as intended. Explicit max-width:100% + box-sizing:border-box now guarantee .tblwrap can never
     expand past its container in ANY layout context, while its own overflow:auto still correctly makes the wide
     table scroll WITHIN that bounded box — matching v12.9's behavior, where this was never a problem. */
  .tblwrap{border:1px solid var(--line);max-width:100%;box-sizing:border-box;}
  .tblwrap>table tr:first-child th,.tblwrap>table tr:first-child td{border-top:none;}
  .tblwrap>table th:first-child,.tblwrap>table td:first-child{border-left:none;}
  .tblwrap>table tr td:last-child,.tblwrap>table tr th:last-child{border-right:none;}
  .tblwrap>table tr:last-child td{border-bottom:none;}
  #settingsBody table{table-layout:fixed;min-width:900px;}
  #settingsBody table th:last-child,#settingsBody table td:last-child{width:34px;text-align:center;}
  #settingsBody table td{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #settingsBody table th{background:#eef2f6;}
  /* NEW this round (per feedback: "header row grey like other tables" — for the Leave Requests table
     specifically): the Settings staff-roster tables get their grey header via the scoped rule directly above,
     but the Leave Requests table lives inside #leaveBody, not #settingsBody, so it never matched that rule at
     all and its header row stayed the plain, unstyled white background every other table's header doesn't have.
     Same scoped-selector pattern, just targeting the Leave tab's own container. */
  #leaveBody table th{background:#eef2f6;}
  #settingsBody table td:nth-child(6){overflow:visible;}
  #settingsBody table td:first-child{position:sticky;left:0;background:#fff;z-index:2;}
  #settingsBody table th:first-child{position:sticky;left:0;background:#eef2f6;z-index:2;}
  #settingsBody table th:first-child{background:#eef2f6;}
  #settingsBody table input,#settingsBody table select{border:1px solid var(--line)!important;border-radius:6px!important;padding:4px 6px;}
  .muted{color:#6b7a8d;}
  /* FOUND AND FIXED A REAL BUG this round (per feedback: "hyperlinks in settings are brighter blue than the +N
     more hyperlinks in FO/HSK, use the color for +N more hyperlinks everywhere"): the "+N more" expander links
     (Checks panel) always explicitly set color:#1b4b8a inline, but every OTHER link in the app (Settings'
     Remove/Re-employ, the Availability editor's Edit/Remove, "Return to current week", version-history's
     "restore", etc.) had NO color override at all — falling back to the browser's own default anchor blue
     (typically a much brighter, more saturated blue than this app's muted navy), producing exactly the visible
     inconsistency reported. Rather than patch each individual link (a whack-a-mole approach prone to missing
     one), this sets the SAME #1b4b8a used by "+N more" as the app-wide default link color in ONE place — every
     link, current and future, now automatically matches without needing its own inline override. */
  a{color:#1b4b8a;}
  a:visited{color:#1b4b8a;}
  .status{font-size:12px;display:flex;align-items:center;gap:6px;flex-wrap:nowrap;}
  /* FIXED (per feedback: "narrow screen the live and sync error bubbles get distorted"): the general .pill rule
     allows text to wrap onto multiple lines (needed for long coverage-minimum pills elsewhere), but that same
     wrapping is what made the compact status pills (sync error, etc.) look visually broken/oval-squished on
     narrow screens when their text tried to wrap mid-pill. This more specific selector keeps status-bar pills
     single-line, since they're always short labels by design and were never meant to wrap. */
  .status .pill{white-space:nowrap;}
</style>
</head>
<body>
<header>
  <div class="titlewrap"><h1>🏨 Hotel Staff Scheduler</h1><span class="ver" id="ver"></span></div>

  <div class="tag">

    <!-- TIGHTENED this round, alongside the header/.tag gap reductions above (see header's own CSS comment for

    <!-- NEW this round (per direct, genuine question: "if Settings/Readme are checked to be hidden to view-only
         users, how are they supposed to see the live version of the app?"): investigated this directly rather
         than assuming — confirmed the app DOES auto-reconnect on every load if a Supabase URL/key was EVER saved
         to THIS SPECIFIC BROWSER before (boot()'s own `if(saved){...connect();}` line), so anyone returning to a
         device that has already connected once is unaffected either way. The real, confirmed gap is narrower but
         genuine: a BRAND-NEW device/browser that has NEVER connected before, used by a view-only visitor while
         Settings is hidden from them, has NO way to ever reach the Connect button at all (it lives only inside
         the Settings tab) — permanently stuck on local-only seed data with no path forward. Fixed by adding this
         small, ALWAYS-VISIBLE "Connect" link directly in the header, next to the sync status dot itself —
         completely independent of Settings' own visibility toggle — shown ONLY while genuinely not yet connected
         (id="headerConnect", hidden via JS the moment DB is set, see setStatus()/connect() themselves). Once

         setup information, not something that needs to stay reachable for every single view-only visit
         afterward) — Settings' own Connect/Disconnect controls remain the ongoing way to manage the connection
         for whoever DOES have Settings access. -->
    <!-- FOUND AND FIXED A REAL BUG this round (per feedback: "'Connect...' in header is odd like it was cut off,
         also not very visible maybe make white or some other color?"). Confirmed via direct color computation:
         this link was using the app's own DEFAULT link color (#1b4b8a, a dark navy — set app-wide on the base
         `a`/`a:visited` selector for every OTHER link in the app, which all sit on white card backgrounds) —
         but THIS link sits directly on the header's own dark navy background (--brand, #1b2a4a), and #1b4b8a is
         barely distinguishable from that background at a glance, which is almost certainly what read as "odd,
         like cut off" rather than a genuine rendering bug. Every other header element (Prev/Next, the lock
         button) already uses white text specifically for this same reason (dark-background contrast) — this
         link now matches that same white, with an explicit underline (since a plain white link with no
         underline could otherwise be mistaken for a plain status label rather than something clickable, unlike
         the header's other buttons which have visible button chrome of their own to signal interactivity). -->
    <a href="javascript:void(0)" id="headerConnect" onclick="headerConnectPrompt()" style="display:none;font-size:12px;margin-left:4px;color:#fff;text-decoration:underline" title="Connect to the shared live copy — available even if Settings is hidden from view-only users">Connect…</a>
    <button class="ghostw" id="authBtn" onclick="toggleEdit()">🔒 View-only</button>

<div id="lastEdited" style="position:fixed;left:10px;bottom:8px;font-size:11px;color:#8a94a0;background:rgba(255,255,255,.85);padding:2px 8px;border-radius:6px;z-index:400"></div>

  <h2 id="smTitle">Edit shift</h2>

  <div class="mrow" style="justify-content:flex-end;margin-top:12px"><button onclick="closeShift()">Cancel</button><button class="brand" onclick="saveShift()">Save</button></div>
</div></div>
<script>
const APP_VERSION="1.1";
document.getElementById("ver").textContent="v"+APP_VERSION;
/* ---------- IN-PAGE DIALOGS (native prompt/confirm/alert are blocked in sandboxed iframes) ---------- */
function uiAlert(msg){return uiDialog(msg,["OK"]).then(()=>{});}
function uiConfirm(msg){return uiDialog(msg,["Cancel","OK"]).then(b=>b==="OK");}
function uiPrompt(msg,def){return uiDialog(msg,["Cancel","OK"],true,def||"");}
function uiDialog(msg,btns,withInput,def){
  return new Promise(res=>{
    const bg=document.createElement("div");bg.className="modalbg";bg.style.display="flex";
    const inp=withInput?`<input id="uiIn" style="width:100%;margin-top:8px;padding:6px;border:1px solid #ccc;border-radius:6px" value="${(def||"").replace(/"/g,'&quot;')}">`:"";
    bg.innerHTML=`<div class="modal" style="${btns.length>3?'max-width:640px':''}"><div style="white-space:pre-wrap">${String(msg).replace(/</g,"&lt;")}</div>${inp}<div class="mrow" style="justify-content:flex-end;margin-top:12px">${btns.map(b=>`<button data-b="${b}" class="${b!=='Cancel'?'brand':''}" style="${b==='Cancel'?'color:#8a94a0':''}">${b}</button>`).join("")}</div></div>`;
    document.body.appendChild(bg);
    const done=v=>{const val=withInput&&v!=="Cancel"?(bg.querySelector("#uiIn").value):v;bg.remove();res(val);};
    bg.querySelectorAll("button").forEach(b=>b.onclick=()=>done(b.dataset.b));
    bg.addEventListener("mousedown",e=>{if(e.target===bg)done(withInput?"Cancel":(btns.includes("Cancel")?"Cancel":btns[0]));});
    if(withInput){const i=bg.querySelector("#uiIn");i.focus();i.select();i.onkeydown=e=>{if(e.key==="Enter")done("OK");if(e.key==="Escape")done("Cancel");};}
  });
}
/* ---------- SHIFT PRESETS & CODES ---------- */
const CODES=["OFF","R-OFF","PTO","LOA","LWOP","FMLA","E-LEAVE","BDH","AB","HU","OC","TASK FORCE","PROJECT","GC","LAUNDRY","ROOMS","CONTROLLER"];
const CODES_COMMON=["OFF","R-OFF","PTO","LOA","LWOP","FMLA","E-LEAVE","BDH","AB","OC"];
const CODES_FO=CODES_COMMON.concat(["TASK FORCE","PROJECT"]);
// ADDED "CHUTTER" this round: directly scanned the real HSK Excel (06.04-08.12, 2026, 10 sheets) for all unique
// cell values and found "Chutter" as a raw, standalone assignment code 91 times \u2014 more frequent than any other
// task code except OFF/LWOP/PTO/R-OFF \u2014 assigned to many DIFFERENT regular staff (not just the 2 people
// separately reclassified to the "Outsourced \u2014 J4 Janitorial" role), confirming it's a real, currently-missing
// rotating daily task assignment, analogous to GC/LAUNDRY/ROOMS/CONTROLLER. Also directly confirmed "PROJECT" is
// genuinely used in HSK (47 total occurrences: 36 bare + 11 combined with a time, e.g. "8AM-4:30pm/Project") \u2014
// keeping it. Checked the 4 available FO sheets (07.23-08.19, 2026, the only FO weeks in the provided file) for
// "PROJECT" specifically and found ZERO occurrences (only "TASK FORCE" appears) \u2014 flagged as unconfirmed for FO
// specifically in the Readme, though not removed, since no June/earlier FO sheets were available to fully rule it
// out across a longer window.
const CODES_HSK=CODES_COMMON.concat(["GC","LAUNDRY","ROOMS","CONTROLLER","PROJECT","LAUNDRY CHUTE"]);
function codesFor(dept){return dept==="HSK"?CODES_HSK:CODES_FO;}
// NEW this round (per feedback: "verify task assignment vs hours/shifts... assigning task makes it impossible to
// assign start/end times and hours don't count towards total hours but that doesn't make sense, if they're at
// work they are paid"): directly confirmed via the real Excel data that task-assignment codes (GC, PROJECT, etc.)
// are OVERWHELMINGLY combined with an actual time range in practice \u2014 e.g. "8AM-4:30pm/GC" (17+ occurrences),
// "8AM-4:30pm/Project" (11 occurrences), "3-11:30pm/RC" \u2014 confirming the combined "<time>/<CODE>" format is the
// real, standard convention, not an edge case. TASK_ASSIGN_CODES lists every code that represents an ACTUAL WORKING
// ASSIGNMENT (the person is still physically at work, just doing a specific duty instead of normal role duties) \u2014
// as opposed to OFF/R-OFF/PTO/LOA/LWOP/FMLA/E-LEAVE/BDH/AB, which mean genuinely NOT working, and can never have a
// time attached. This distinction drives the shift-editor changes below (task codes can now be combined with a
// time; off-family codes still cannot, since there are no "hours" to assign for a day off).
const TASK_ASSIGN_CODES=["GC","TASK FORCE","PROJECT","OC","LAUNDRY","ROOMS","CONTROLLER","LAUNDRY CHUTE"];
// NEW this round: whether a task-assignment code (GC/Project/etc.) is allowed to combine with a start/end time and
// count toward total hours is now a Settings toggle (CFG.taskCodesCombineTime, default true — matching the
// existing, already-shipped behavior) instead of being unconditionally true. Turning it OFF restores the OLDER,
// mutually-exclusive behavior: a task code then behaves exactly like an off-family code (OFF/PTO/etc.) — no time
// can be attached, 0 hours, does not count toward the week total. Centralizing the check here (instead of
// repeating "TASK_ASSIGN_CODES.includes(...) " at every call site) means every place that decides "is this code
// allowed to have a time attached right now" — the shift editor's code buttons, drawSegs(), recalc(), and
// saveShift() — all agree with each other and with this one Settings flag, with no risk of drifting apart.
// REDESIGNED this round — a genuine logic split, not just a default flip (per explicit instructions: "always
// allow assignment like task to have start/end times even if count towards total not checked, just don't count
// those towards total if not checked" + "default checked for allow shifts with assignments to count towards
// total" + "if time shift was set and project assignment selected later, don't erase the time shift that was
// set, just add the project assignment"). The single function taskCombinesWithTime() previously conflated TWO
// genuinely different questions into one boolean: "can this code have a time attached at all" and "do those
// hours count toward the weekly total" — both were gated behind the SAME Settings toggle. That conflation is
// exactly what caused the reported time-erasure bug: when the toggle was off, pickCode() treated a task code
// identically to an off-family code (no time possible) and WIPED any already-entered segment — so setting a time
// first, then picking Project afterward, silently lost the time the moment the toggle was unchecked. Split into
// two independent functions:
//   taskCanHaveTime(code) — ALWAYS true for any task-assignment code, completely independent of the Settings
//     toggle. A time can always be entered/kept alongside a task code now.
//   taskHoursCount(code) — ONLY this one still checks the Settings toggle, and ONLY governs whether those hours
//     are added to the weekly/OT total — it has no bearing on whether a time can be attached in the first place.
// Default flipped back to TRUE (checked) per explicit instruction — CFG.taskCodesCombineTime is undefined for
// every existing saved config, and undefined!==false, so nothing changes for anyone until they explicitly
// uncheck it.
function taskCanHaveTime(code){return !!code&&TASK_ASSIGN_CODES.includes(String(code).toUpperCase());}
function taskHoursCount(code){return !taskCanHaveTime(code)||(CFG.taskCodesCombineTime!==false);}
// Hours to COUNT toward the weekly/OT total for a given cell value — respects taskHoursCount() so a task code
// whose hours-counting is turned off contributes 0 toward the running weekly total, WITHOUT altering the raw,
// actually-worked duration reported elsewhere (shiftHours() itself, used for the per-day hour display, the
// unreadable-hours check, and the LONG SHIFT flag, is deliberately left untouched — someone still physically
// worked that shift; only whether it counts toward the reported TOTAL is what this setting controls).
function countedShiftHours(v){const hh=shiftHours(v);if(hh==null)return null;const tc=taskCodeIn(v);if(tc&&!taskHoursCount(tc))return 0;return hh;}
// Detects whether a cell's raw string value contains one of the recognized task-assignment codes, whether the
// cell is JUST the bare code (e.g. "GC") OR a combined "<time>/<CODE>" value (e.g. "08:00-16:30/GC") \u2014 matching
// the real Excel convention confirmed via direct file inspection this round. Returns the matched code (uppercased)
// or null. Used for (a) applying the task-yellow fill color even when a time is attached (see shiftColorFor), and
// (b) re-parsing an existing combined value back into the shift editor's code selector when reopened for editing.
function taskCodeIn(v){
  if(!v)return null;
  const u=String(v).toUpperCase().trim();
  for(const c of TASK_ASSIGN_CODES){
    if(u===c)return c; // bare exact match
    const esc=c.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    if(new RegExp("(^|[\\s/])"+esc+"($|[\\s/])").test(u))return c; // combined form: code as its own token, separated by a space or slash
  }
  return null;
}
// NEW this round (per feedback: "when start/end time and an assignment like Task Force are combined, separate by
// line break not slash, and try to make vertical height less impacted"): a combined value is stored internally as
// "<time>/<CODE>" (e.g. "08:00-16:30/GC") — that storage format is UNCHANGED here (taskCodeIn()'s own regex, the
// shift editor's re-parsing on reopen, etc. all still expect the slash form, so nothing about parsing/saving is
// touched). This is purely a DISPLAY-time transform for the schedule grid: when a cell's raw value matches the
// combined pattern, it's rendered as the time on one line and the code directly below it in a smaller, tighter
// line-height — reads more like two distinct pieces of information (a time, and a task) rather than a single
// slash-joined string, without literally doubling the cell's height the way a full second line at normal size
// would. A plain value with no task code (a bare time, or a bare code with no time) is unaffected.
function formatAssignedCellHtml(v){
  if(!v)return "";
  const raw=String(v);
  const m=raw.match(/^(.*?)\/(GC|TASK FORCE|PROJECT|OC|LAUNDRY|ROOMS|CONTROLLER|LAUNDRY CHUTE)$/i);
  if(m){
    const timePart=esc(m[1]);const codePart=esc(m[2].toUpperCase());
    return `${timePart}<br><span style="font-size:9px;line-height:1.05;letter-spacing:.2px">${codePart}</span>`;
  }
  return esc(raw);
}
const SHIFTS_FO=["07:00-15:30","11:00-19:30","14:00-22:30","22:30-07:00","07:00-15:30","09:00-17:00"];
const SHIFTS_HSK=["07:00-15:30","08:00-16:30","09:00-17:30","15:00-23:30","22:30-07:00"];
// FIXED an inconsistency (per feedback): FT/PT stayed as 2-letter abbreviations while OC/INT/OUT were spelled out
// in full ("On-call"/"Intern"/"3rd-party") — visually inconsistent in the schedule's name-column subtitle, e.g.
// "(FT)" next to "(On-call)" on adjacent rows. All 5 are now abbreviated consistently, matching the same style.
// FIXED this round (per feedback: "replace all '(3rd-pty)' with '(3rd-party)'"): OUT-type staff previously showed
// the abbreviation "3rd-pty" in their name-column type badge — spelled out in full now, matching how "On-call"/
// "Intern" are already spelled out in full rather than abbreviated (see the comment above this constant).
const TYPE_LABEL={FT:"FT",PT:"PT",OC:"OC",INT:"INT",OUT:"3rd-party"};
const HRS_PER_SHIFT=7.5;               // used for hours/cost estimate when a cell is a coded shift
const DEFAULT_RATE={FT:12.0, PT:11.0, OC:11.0, INT:9.5}; // $/hr placeholders — edit per person in Config
const OT_AFTER=40, OT_MULT=1.5; // 40h threshold is fixed/hardcoded (not user-editable) — workweek SPAN (start day) is configurable, see CFG.weekStartDow
// CHANGED this round (per explicit instruction: "Make unpaid break an input field for minutes and input field for
// per shift (or dropdown like day) with 30 and shift as default"): this was a hardcoded, non-editable constant —
// now a genuinely configurable Settings field. BREAK_HRS is kept as the DEFAULT reference value (30 min = 0.5h);
// the actual value used everywhere is read live via getBreakHrs(), not this constant directly. "Per shift" and
// "per day" are functionally IDENTICAL in this app's data model (one working shift per day) — the unit dropdown
// exists purely so wording can match whichever term a hotel/department prefers; it doesn't change the math.
const BREAK_HRS=0.5;

function shiftHours(v){ // parse "14:00-22:30" -> hours; coded shifts -> HRS_PER_SHIFT; OFF/leave -> 0
  if(!v)return 0; const cls=classify(v); if(cls==="off"||cls==="leave")return 0;
  const m=v.match(/(\d{1,2}):?(\d{2})?\s*(am|pm)?\s*[-–]\s*(\d{1,2}):?(\d{2})?\s*(am|pm)?/i);
  if(m){let h1=+m[1]+(m[2]?+m[2]/60:0),h2=+m[4]+(m[5]?+m[5]/60:0);
    const ap1=(m[3]||"").toLowerCase(),ap2=(m[6]||"").toLowerCase();
    if(ap1==="pm"&&h1<12)h1+=12; if(ap1==="am"&&h1===12)h1=0;
    if(ap2==="pm"&&h2<12)h2+=12; if(ap2==="am"&&h2===12)h2=0;
    let d=h2-h1; if(d<0)d+=24; if(d>0)return Math.round(d*2)/2;}
  return null; // NOT parseable as a time window -> unknown hours (flagged, not silently 7.5)
}

// Credits formula (CONFIRMED with hotel): total rooms 421, but some room types (suites etc.) count as 2 credits

function creditsFor(wk,i){const R=CFG.HSK.rules;const d=(DEMAND[wk]&&DEMAND[wk][i])||{};if(d.credits!=null)return d.credits;

// short human-readable list for the confirmation pop-up so a real conflict is visible BEFORE the user chooses to

// REDESIGNED this round (per feedback: "the pop-up doesn't list what I changed while in local mode, and clicking
// Cancel still goes live — prefer that it not go live if Cancel is clicked; add a button to go live but not
// reflect changes made while in local/offline mode"). Two genuinely different things are now surfaced separately:
// (1) CHANGES — every local cell that differs from what's currently live, listed in full, regardless of whether
//     live was simply blank (safe to upload) or held something else (a real conflict) — this is the missing
//     "what did I actually change" list the feedback asked for.

// Demand table (occupancy/arrivals/credits/etc.), Leave Requests, or Settings \u2014 never touching an actual

// currently has NO Supabase table at all \u2014 itemizing it field-by-field here would be misleading.
function analyzeUploadChanges(localSnapshot,liveSnapshot){

  ["FO","HSK"].forEach(dept=>{
    const localWeeks=(localSnapshot.assign&&localSnapshot.assign[dept])||{};
    const liveWeeks=(liveSnapshot.assign&&liveSnapshot.assign[dept])||{};
    Object.keys(localWeeks).forEach(wk=>{
      const localStaff=localWeeks[wk]||{};const liveStaff=liveWeeks[wk]||{};
      Object.keys(localStaff).forEach(nm=>{
        const localDays=localStaff[nm]||{};const liveDays=liveStaff[nm]||{};
        for(let d=0;d<7;d++){
          const lv=localDays[d],rv=liveDays[d];
          if((lv||"")===(rv||""))continue; // identical — nothing pending for this cell
          const line=`${nm} \u2014 ${dept} ${DOW[d]} (${wk}): your copy has "${lv||"(blank)"}", live has "${rv||"(blank)"}"`;
          changes.push(line);
          if(rv!=null&&rv!==""&&lv!==rv)conflicts.push(line); // live wasn't blank AND differs \u2014 a genuine overwrite risk
        }
      });
    });
  });
  // NEW this round: Demand table diff — same "your copy vs live" line format, field-by-field per day/week.
  {
    const localDem=localSnapshot.demand||{};const liveDem=liveSnapshot.demand||{};
    const fields=["occ","arr","dep","credits","ooo","house","events","transportation","unassigned"];
    Object.keys(localDem).forEach(wk=>{
      const localDays=localDem[wk]||{};const liveDays=liveDem[wk]||{};
      Object.keys(localDays).forEach(d=>{
        const lv=localDays[d]||{},rv=liveDays[d]||{};
        fields.forEach(f=>{
          const a=lv[f],b=rv[f];

          const line=`Demand ${wk} ${DOW[d]!=null?DOW[d]:d} \u2014 ${f}: your copy has "${a==null?"(blank)":a}", live has "${b==null?"(blank)":b}"`;
          changes.push(line);

  // a genuinely NEW local request (no live counterpart at all) is a safe addition, never a conflict; a request
  // that exists in BOTH but differs (e.g. locally approved/denied while live still shows pending) is a conflict.
  {

async function pullAll(){

  try{

    if(e1){reportSyncError("pull assignments",e1);return;}
    (as||[]).forEach(r=>{ASSIGN[r.dept]=ASSIGN[r.dept]||{};ASSIGN[r.dept][r.week]=ASSIGN[r.dept][r.week]||{};ASSIGN[r.dept][r.week][r.staff]=r.days||{};});
    const {data:dm,error:e2}=await DB.from("demand").select("*");
    if(e2){reportSyncError("pull demand",e2);return;}
    (dm||[]).forEach(r=>{DEMAND[r.week]=r.days||{};});
    const {data:lr,error:e3}=await DB.from("leave_requests").select("*");
    if(e3){reportSyncError("pull leave requests",e3);return;}
    (lr||[]).forEach(r=>{if(r.id)LEAVE_REQUESTS[r.id]=r.data||{};});
    save("hotel_assign",ASSIGN);save("hotel_demand",DEMAND);save("hotel_leaverequests",LEAVE_REQUESTS);clearSyncError();render();
  }catch(e){reportSyncError("pull",e);}
}

  // that field is now deleted after migration, and the full-day s.avail[_dn].off case is already checked above.
  // A PART-DAY constraint (e.g. a class window) intentionally does NOT exclude someone from "could assign"

async function optimizeWeek(){

function renderReadme(){

<p><b>What it is:</b> One scheduling platform for Front Office and Housekeeping — it tracks every change (an audit/change log), keeps a historical record of past weeks (locked schedules plus a frozen snapshot of the rules/coverage/roster in effect that week), and automatically flags a range of scheduling issues while a week is being built, including understaffing, overstaffing, part-time hour caps, and availability conflicts. A separate Leave Requests tab lets any staff member submit a time-off request, visible to everyone for transparency.</p>

<p><b>Editing &amp; roles:</b> The app opens view-only. Clicking the lock button (top-right) and entering the scheduler PIN for the relevant department enables editing for that department. Edit mode ends when the page is refreshed or reopened; there is no idle timeout yet. Past weeks are a locked historical record — unlocking one asks for confirmation. A PIN in a static page is a casual gate, not real security; Supabase Auth provides genuine access control when configured. If edit access is granted for one department while a different department's schedule is being viewed (e.g. deciding a Leave Request), the header shows "Partial access" rather than silently claiming View-only — clicking it once locks everything back down.</p>

<p><b>Weeks &amp; schedule structure:</b> weeks run Thursday–Wednesday by default (start day configurable in Settings, applies to both departments). A cell can hold a shift window (or a split shift across multiple time segments) or a code (OFF, PTO, LOA, and others). Per-person availability/unavailability constraints, entered in Settings, drive the conflict flags and "eligible candidate" suggestions described below. Settings also holds the staff roster, coverage minimums, rules/thresholds, default shift presets, and data/sync options.</p>

<p><b>Schedule format:</b></p>
<ul>
<li>OFF / R-OFF / PTO / LWOP / LOA / FMLA / E-LEAVE / BDH / AB → grey (rest/leave).</li>
<li>GC / Task Force / Project / On-call / Laundry / Rooms / Controller / Laundry Chute → pale yellow (a task assignment layered on top of a shift; applies whether the code appears bare or combined with a time).</li>
<li>A typed shift or blank → white, or — Front Office only — one of 4 pastel per-shift-time tints (07:00–15:30 pale blue, 11:00–19:30 pale cream, 14:00–22:30 pale green, 22:30–07:00 baby pink). Housekeeping shows no time-based tint (confirmed inconsistent/manual in the source Excel).</li>
<li>Cumulative hours over 40 for the week → red outline + bold red hour figure, with the shift's own colour still visible underneath.</li>
</ul>

<p><b>Flags:</b></p>
<ul>
<li>Scheduling a working shift, through the shift editor, on a day covered by a personal unavailability constraint or an <b>approved</b> leave request → a hard, red "Blocked" panel requiring a checked override + typed reason to save.</li>
<li>Once such a conflict exists on the saved schedule (whether via an override, or introduced another way, e.g. import/paste) → an amber outline + a ⚠ icon on the cell, plus a matching CONFLICT flag in Checks — amber for a personal-availability conflict, red for an approved-leave conflict specifically (treated as more severe once saved, even though both are equally hard-blocked at the point of scheduling).</li>
<li>A shift whose hours can't be read → an amber outline + a ? icon (a distinct icon from the ⚠ used for availability conflicts) and a HOURS? flag in Checks.</li>
<li>A day with a part-day unavailability window → a small amber triangle in the cell's top-right corner (shown whenever the constraint exists that day, whether or not the assigned shift actually overlaps it).</li>

<li>Overtime (cumulative hours over 40 that week) → a red outline, in addition to the bold red hour figure.</li>
<li>A shift over 16h → a soft, non-blocking note to double-check this was intentional, both at save time and consolidated in Checks (LONG SHIFT).</li>
<li>Understaffed cells (Demand table) → a red border, bold red text, and a ⚠ icon.</li>
<li>Understaffed / Overstaffed roles (Checks panel) → a red / amber pill, each with a "Could assign" or "Could reduce" suggestion list of eligible, available staff for that specific day or shift band. Overstaffed flagging can be turned off entirely, or given a margin above the minimum, in Settings; understaffed flagging can also be suppressed for a role whose entire roster is too small to ever meet its minimum (a separate Settings toggle), since flagging an unfixable structural shortfall every single week is just noise.</li>

<details><summary style="cursor:pointer"><b>Clock in / Clock out</b> <span class="muted">(click to expand)</span></summary>
<p>(schedule grid, today's column only, folded directly into the same hours line as a compact "· Clock in" / "· ✓09:15 out" — this was previously its own separate row, adding real vertical height to every cell on today's column; it's now one line, no taller than any other day): anyone scheduled to work today can be marked clocked in, then later clocked out, by anyone with access to the device (or by a manager in edit mode on their behalf, recorded as who actually did it). This is a lightweight, independent presence signal (a pair of timestamps, not an hours figure) — a real, buildable answer to the Housekeeping attendance-gap question below, without needing any biometric hardware or a Hotlink/Paycom connection. Renamed from "Check-in" to "Clock in"/"Clock out" this round to match Paycom's own established timeclock terminology and read unambiguously as a presence-timestamp action.</p>
<p><b>Access model — a genuine, switchable choice:</b> by default, no Supabase account, PIN, or per-person login is required — clocking in/out works exactly like every other anonymous part of this app; confirmed fine for beta testing. The real tradeoff, stated plainly: there is no identity verification at all in this default mode — on a shared device, anyone can clock in/out <i>anyone's</i> name, not only their own, so this is a presence signal the team trusts each other to use honestly, not a verified clock-in. A new Settings toggle — <b>"Restrict Clock in/out to edit mode only"</b> (default off) — makes the other, more restricted mode directly testable too: when on, clocking in/out requires the same edit-mode gate as every other write action in this app, closer to how an actual production kiosk might need to work, at the cost of needing a scheduler/manager (or a future per-worker Supabase account — see Roadmap) physically present to do it.</p>
<p><b>Time-gating — a genuine design tradeoff, not a hard rule:</b> clocking in is never blocked while a shift is still running, including "running a bit late" (the normal case this feature exists for). Once a shift's own scheduled end time has passed by more than a configurable grace window (default 30 min, editable in Settings), clocking in triggers a soft confirmation ("this shift already ended — clock in anyway, e.g. to backfill a record?") rather than a hard refusal — a legitimate backfill use case (a manager remembering, after the fact, that someone was genuinely present) is real and shouldn't be blocked outright, but a clock-in long after a shift ended is different enough from the normal case to be worth a deliberate confirmation rather than silent acceptance.</p>
<p>Nothing shows on the grid unless someone is genuinely scheduled to work THAT specific day — a common reason it may appear to be "missing" is simply that no shift is assigned to anyone for today yet. A new <b>NOT CLOCKED IN</b> flag (Checks panel, its own "Attendance" category — a real, confirmed bug this round: it previously existed but landed in a generic, easy-to-miss "Other" bucket with no category label at all) surfaces once a scheduled shift's own start time has passed with still no clock-in recorded. Clock in/out is deliberately today-only (never backdated/future beyond the grace-window confirmation above) and local-only for now (not yet synced across devices/browsers — see Roadmap).</p>

<details><summary style="cursor:pointer"><b>Coverage — thresholds, minimums &amp; formulas</b> <span class="muted">(click to expand)</span></summary>
<p>Every role has a flat, per-role headcount floor (Settings → Coverage minimums), checked per day or per shift band depending on the role. For a role that also has a demand-driven formula, the two are combined as the higher of {coverage floor, demand formula} — never two separate, potentially-disagreeing numbers. HSK's coverage minimums are prefilled from the lowest headcount actually observed across the available historical weekly sheets — a defensible floor, not a confirmed policy minimum. Two roles have too little historical data to compute a real minimum this way (every day-cell is blank in the source Excel across every available week) and stay at a min:1 placeholder: Managers (HSK), and — on the FO side — Front Desk Supervisor, Concierge Agent, and Interns.</p>
<p>Any role's coverage minimum can be set to "per shift" instead of "per day" — Front Desk Agents, Bell Attendants, and Guest Service Agent default to per shift; Greeter, Bell Captain, and Guest Service Supervisors default to per day (any of the six can be switched). "Per shift" is checked against 4 real bands — Morning 07:00–15:29, Mid 11:00–19:29, Evening 14:00–22:29, Graveyard 22:30–06:59. A non-standard shift (one whose start/end doesn't line up with a preset, or that runs past midnight into another band's hours) is credited toward a band according to a configurable mode in Settings (default: <b>Start time only</b> — counts toward exactly the one band its own start time falls into, never a neighbor, however long it runs; alternative: <b>Every overlap</b> — counts toward every band it genuinely overlaps in time, at the cost of one person being able to satisfy 2+ bands' minimums simultaneously). A percentage-based threshold (e.g. "counts toward a second band only past 50% overlap") was considered but not built, since it would trade one unconfirmed number for another rather than resolving the ambiguity.</p>
<details><summary style="cursor:pointer"><b>Front Office formula</b> <span class="muted">(click to expand)</span></summary>
<p>Front Desk Agents needed — a switchable model in Settings (default: <b>1 agent per 24 Arrivals + 1 per 34 Departures</b>, ceiling-rounded; "flat" and "scaling" alternatives are also available; the hotel's own verbally-described flat step-function model — +3 agents once Arrivals reach 70, +3 once Departures reach 100 — remains selectable too, though the ratio model is the active default since it fits the actual historical headcount magnitude far more closely), minus Interns currently scheduled that day (Interns are confirmed 1-for-1 substitutable for Front Desk Agents — if 6 agents are needed and one Intern is scheduled, the shortfall is reduced by one), with a floor of 1 agent per shift so the desk is never at zero. Bell Attendants needed = Transportation ÷ a configurable ratio; Valet needed = Events ÷ a configurable ratio (see Open questions for both ratios' status). A BUSY note (amber) appears when Arrivals/Departures cross a threshold on a day that isn't already flagged short. Guest Service Supervisors and Guest Service Agent flag independently — each role's own coverage minimum (Supervisors 1/day, Agent 1/shift) is checked on its own, so a shortfall in one role flags even if the other is fully covered that day/shift; Supervisors' own busy period is confirmed as roughly 11am–6pm (not the full day), though this coverage rule is still checked all day rather than scoped to that specific window.</p>
</details>
<details><summary style="cursor:pointer"><b>Housekeeping formula</b> <span class="muted">(click to expand)</span></summary>
<p>Credits = (421 rooms + a configurable "2-credit rooms" bonus, default 54, for room types that count double) − OOO/OOS − House-use − Unassigned, × a configurable multiplier (default 1.14). A Settings toggle controls whether that bonus scales down proportionally as rooms go out of service (default: off — the bonus stays flat, matching the simpler original formula); either way, Credits is forced to exactly 0 once OOO+House-use+Unassigned account for all 421 rooms. Room Attendants needed = Credits ÷ 14 (floored by the coverage minimum for that role); Supervisors needed = Arrivals ÷ 25 (same floor pattern). Checkouts-per-RA is a separate, deliberately independent ratio (the higher of Arrivals/Departures ÷ Room Attendants scheduled) — it measures checkout-day workload concentration, not the full cleaning load Credits already covers, and flags (amber) above a configurable ratio (default 4, confirmed as the correct threshold). Outsourced workers are a fully auto-calculated output (never an input): the credit gap the scheduled in-house Room Attendants can't cover, ÷ a configurable rooms-per-worker figure (default 5) — Settings also has an "in use?" toggle per outsourced crew (JJ Global, J4 Janitorial), so a crew not currently under contract doesn't factor into that gap at all.</p>

</details>

<details><summary style="cursor:pointer"><b>Auto-fill</b> <span class="muted">(click to expand)</span></summary>
<p>Schedule → ✨ Auto-fill: a greedy, explainable suggester, not a full optimizer — for each understaffed role/day, it assigns that role's default shift time to eligible, available staff, ranked by fewest hours already scheduled that week, filling only currently-blank cells (existing entries are never touched or overwritten). A fairness/history-aware optimizer is not yet built — see Roadmap.</p>

<details><summary style="cursor:pointer"><b>Leave Requests</b> <span class="muted">(click to expand)</span></summary>
<p>Anyone — including view-only staff, in either department — can submit a leave request (department, then a name filtered to that department's active staff; either field can be filled first, and the other auto-restricts/auto-fills to match) with a type, dates, optional part-day times, a reason, and an optional attachment (5MB cap), without needing the edit PIN. Submitting checks for the same person's own overlapping requests (a duplicate warning) and, separately, for other staff's overlapping requests in the same department (a fairness/transparency note, listed oldest-first). A request for dates that have already passed still allows submission, with a warning that it can only be decided (not silently accepted) later.</p>
<p>Approve/Deny requires edit access to that specific request's department (or a Supabase manager account); Revoke undoes a mistaken approval and returns it to Pending. A <b>still-pending</b> request stays fully actionable even once its dates have passed; an <b>already-decided</b> (approved or denied) request that's since passed is frozen — no Revoke, no re-deciding — matching the same "editing history should be deliberate" principle applied to past-week schedule edits. Past-dated requests collapse into their own "Past requests" section, greyed out. Type/Reason/Attachment are hidden from anyone without decide-access for that row's department (default: on) — a toggle in Settings. <b>Status</b> (Pending/Approved/Denied) is deliberately NOT hidden by that same toggle — the whole point of that column is fairness/transparency (so everyone can see a request isn't being silently ignored or favoritized), which is a different goal from keeping a specific reason/attachment private, and hiding it would undercut the transparency this tab exists for in the first place.</p>

<p><b>Live sync:</b> Settings holds a Supabase URL + anon key (prefilled by default with this deployment's own project) and a Connect button — connecting syncs schedule/demand/leave-request data across devices; until connected, the app is local-only. Local edits made before connecting are detected reliably (survives page reloads) and trigger a choice — upload them, discard them and take live's copy, or stay local — rather than silently picking one. A small "Connect…" link also sits directly in the header (next to the sync-status dot), independent of Settings' own visibility — this closes a genuine gap where a brand-new device, used by a view-only visitor while Settings is hidden from them, would otherwise have no way to ever reach the Connect controls at all; it disappears once connected.</p>

<p><b>Export &amp; backup</b> (Settings → Export…): JSON (full backup), Excel (approximates the hotel's own sheet layout), a Payroll &amp; Time CSV (one row per person per day — REG/OT hours split at the 40h mark, or the leave code for a leave day; a generic export, not a certified Paycom/Dayforce template — see Integration status below), a Room Assignments CSV (Housekeeping only — each scheduled Room Attendant's/Room Controller's/Supervisor's floor/zone per day; floor/zone-level only, no individual room numbers — see Integration status below), and the change log as CSV. Settings → Backup &amp; versions… covers Import full backup (JSON) — restores this app's OWN complete data, the exact file its own Export produces — Import actual hours from Paycom (CSV) — a narrower, additive action that reads a timecard file from an EXTERNAL system (Paycom) and adds real clocked hours on top of the existing schedule, touching nothing else (see Integration status below) — manual "Save version now" snapshots with restore, and the change log.</p>
