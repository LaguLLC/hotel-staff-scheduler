<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Hotel Staff Scheduler</title>
<!-- Supabase JS (realtime). If it can't load, the app runs in LOCAL mode. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{--brand:#1b2a4a;--line:#dfe4ea;--ok:#0e7c46;--warn:#b8860b;--err:#b30000;--bg:#f4f6f8;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:Calibri,Segoe UI,Arial,sans-serif;background:var(--bg);color:#1f2d3d;}
  header{background:var(--brand);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:2000;box-shadow:0 2px 6px rgba(0,0,0,.2);}
  .titlewrap{display:flex;align-items:baseline;gap:8px;}
  @media(max-width:820px){ header{gap:6px;padding:8px 10px;} header h1{font-size:15px;} .tag{margin-left:0;width:100%;justify-content:flex-start;} }
  header h1{font-size:18px;margin:0;}
  .ver{opacity:.7;font-size:12px;}
  .tag{margin-left:auto;display:flex;gap:8px;align-items:center;}
  button{font-family:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 10px;font-size:13px;}
  button.brand{background:#2c9e5f;color:#fff;border-color:#2c9e5f;}
  button.ghostw{background:transparent;color:#fff;border-color:rgba(255,255,255,.5);}
  .deptbtn{background:rgba(255,255,255,.14);color:#fff;border-color:transparent;}
  .deptbtn.active{background:#fff;color:var(--brand);font-weight:700;}
  .wrap{max-width:1500px;margin:0 auto;padding:14px 16px 60px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px;}
  h2{font-size:15px;margin:0 0 8px;}
  table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px;table-layout:fixed;}
  col.dayc{width:92px;} col.namec{width:200px;} col.hrc{width:70px;} col.costc{width:80px;}
  @media(max-width:820px){ col.namec{width:130px;} col.dayc{width:64px;} body{font-size:12px;} }
  th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:3px 5px;text-align:center;vertical-align:middle;}
  tr:first-child th,tr:first-child td{border-top:1px solid var(--line);}
  th:first-child,td:first-child{border-left:1px solid var(--line);}
  #grid tr td:last-child,#grid tr th:last-child{border-right:1px solid var(--line);}
  thead th{background:#eef2f6;position:sticky;position:-webkit-sticky;top:0;z-index:20;}
  /* sticky first column = staff names AND the role label (single-column cells stick reliably) */
  #grid td:first-child,#grid th:first-child{position:sticky;left:0;z-index:15;background:#fff;}
  #grid thead th:first-child{z-index:25;background:#eef2f6;}
  #grid td.rolelabel{position:sticky;left:0;z-index:16;background:#f0f3f6;text-align:left;font-weight:700;color:var(--brand);white-space:nowrap;}
  #grid td.rolerest{background:#f0f3f6;text-align:left;font-weight:700;color:var(--brand);box-shadow:inset 0 -1px 0 var(--line);}
  #grid tbody td.name{background:#fff;}
  #grid tbody tr.wktotal td{font-weight:700;border-bottom:1px solid var(--line);}
  #grid tbody tr.wktotal td.name{background:#eef2f6!important;}

  td.name{text-align:left;white-space:normal;overflow-wrap:anywhere;min-width:150px;font-weight:600;}
  td.demand{background:#fafbfc;font-weight:600;line-height:1.3;padding:10px 8px;white-space:normal;height:auto;vertical-align:middle;}
  #grid tbody td{position:relative;}

  #demandBody td:not(.demand){text-align:center;}
  #demandBody th{background:#eef2f6;}
  #demandBody thead th,#demandBody tr:first-child th{position:static;}
  #demandBody td.demand{padding:12px 10px;line-height:1.25;white-space:normal;overflow-wrap:normal;}
  #demandBody td{padding-top:8px;padding-bottom:8px;}
  #demandBody table td:first-child,#demandBody table th:first-child{position:sticky;left:0;z-index:5;}
  #demandBody table td.demand:first-child{background:#fafbfc;}
  #demandBody table th:first-child{background:#eef2f6;}
  #demandBody table{table-layout:fixed;width:100%;min-width:720px;}
  #demandBody .tblwrap{overflow:auto;max-height:none;position:relative;}
  #demandBody td:not(.demand) *{text-align:center;margin:0 auto;}

  select.cell,input.cell{width:100%;border:1px solid transparent;background:transparent;font:inherit;text-align:center;border-radius:4px;padding:2px;}
  select.cell:hover,input.cell:hover{border-color:var(--line);}
  .off{background:#eef0f2;color:#6b7a8d;} /* OFF/R-OFF = grey (rest) */
  .loa{background:#eef0f2;color:#6b7a8d;} /* LOA = grey (leave) */
  .leave{background:#eef0f2;color:#6b7a8d;} /* PTO/LWOP/LOA = grey leave */
  .special{background:#eaf1fb;color:#1b4b8a;} /* OC / TASK FORCE / PROJECT */
  .work{background:#fff;}
  .caution{background:#fff6d6!important;outline:1px solid #e0c060;}
  .short{background:#fff6e5;}
  .flagcell{position:relative;outline:2px solid #e0a800;outline-offset:-2px;}
  input.dayhrs{background:#fff;}
  #demandBody input[type=number]::-webkit-inner-spin-button,#demandBody input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  #demandBody input[type=number]{-moz-appearance:textfield;text-align:center!important}
  #demandBody td{text-align:center!important}
  .cellbtn{display:block;min-height:18px;cursor:pointer;padding:2px;border-radius:4px;}
  .cellbtn:hover{background:#eef4fd;}
  .modalbg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:9999;}
  .modal{background:#fff;border-radius:12px;padding:16px 18px;min-width:340px;max-width:440px;box-shadow:0 12px 40px rgba(0,0,0,.3);}
  .seg{display:flex;gap:6px;align-items:center;margin:4px 0;}
  .seg input[type=time]{width:120px;border:1px solid var(--line);border-radius:6px;padding:5px;font:inherit;}
  .seg input{width:120px;border:1px solid var(--line);border-radius:6px;padding:5px;font:inherit;}
  .mflag{background:#fdf0d0;color:#8a6d00;border-radius:6px;padding:4px 8px;font-size:12px;margin:3px 0;}
  .mrow{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;}
  #smCodes button,#smCodes select{font-family:inherit;font-size:13px;height:30px;box-sizing:border-box;vertical-align:middle;}
  .cellflag{position:absolute;top:0;right:2px;font-size:10px;color:#b8860b;}
  .pdmark{position:absolute;top:0;right:0;width:0;height:0;border-top:10px solid #e0a800;border-left:10px solid transparent;}
  .pill{display:inline-block;border-radius:20px;padding:1px 8px;font-size:11px;font-weight:700;}
  .pill.ok{background:#e6f4ec;color:var(--ok);}
  .pill.warn{background:#fbf0d6;color:var(--warn);}
  .pill.err{background:#fdecec;color:var(--err);}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .small{font-size:11.5px;color:#6b7a8d;}
  th,td{overflow-wrap:anywhere;word-break:break-word;}
  .pill{white-space:normal;}
  .flags li{margin:2px 0;}
  .cfgrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0;}
  .sfield{max-width:100%;}
  input[type=checkbox]{width:15px;height:15px;vertical-align:middle;cursor:pointer;}
  .cbx{width:16px;height:16px;}
  #grid input:disabled,#grid select:disabled,#demandBody input:disabled{pointer-events:none;}
  @media(max-width:820px){ .cfgrow>input.sfield,.cfgrow>input.txt{flex:1 1 100%;min-width:0;} }
  input.txt{border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit;min-width:240px;}
  .sfield{border:1px solid var(--line);border-radius:6px;padding:0 7px;height:30px;box-sizing:border-box;font:inherit;background:#fff;vertical-align:middle;}
  .sfield[type=checkbox]{height:auto;}
  /* standard: all input/select/button heights consistent */
  .cfgrow input:not([type=checkbox]),.cfgrow select,.cfgrow button,.mrow input:not([type=checkbox]),.mrow select,.mrow button{height:30px;box-sizing:border-box;vertical-align:middle;}
  .card>div[style*="overflow"]{border-radius:8px;overflow:hidden;}
  .card>.tblwrap{border-radius:8px;}
  #demandBody .tblwrap{overflow:auto;}
  .tblwrap{border:1px solid var(--line);}
  .tblwrap>table tr:first-child th,.tblwrap>table tr:first-child td{border-top:none;}
  .tblwrap>table th:first-child,.tblwrap>table td:first-child{border-left:none;}
  .tblwrap>table tr td:last-child,.tblwrap>table tr th:last-child{border-right:none;}
  .tblwrap>table tr:last-child td{border-bottom:none;}
  #settingsBody table{table-layout:fixed;min-width:900px;}
  #settingsBody table th:last-child,#settingsBody table td:last-child{width:34px;text-align:center;}
  #settingsBody table td{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #settingsBody table th{background:#eef2f6;}
  #settingsBody table td:nth-child(6){overflow:visible;}
  #settingsBody table td:first-child{position:sticky;left:0;background:#fff;z-index:2;}
  #settingsBody table th:first-child{position:sticky;left:0;background:#eef2f6;z-index:2;}
  #settingsBody table th:first-child{background:#eef2f6;}
  #settingsBody table input,#settingsBody table select{border:1px solid var(--line)!important;border-radius:6px!important;padding:4px 6px;}
  .muted{color:#6b7a8d;}
  .status{font-size:12px;display:flex;align-items:center;gap:6px;}

</head>
<body>
<header>
  <div class="titlewrap"><h1>🏨 Hotel Staff Scheduler</h1><span class="ver" id="ver"></span></div>
  <button class="deptbtn active" id="btnFO" onclick="setDept('FO')">Front Office</button>
  <button class="deptbtn" id="btnHSK" onclick="setDept('HSK')">Housekeeping</button>
  <button class="deptbtn" id="btnSET" onclick="setView('settings')">Settings</button>
  <button class="deptbtn" id="btnREAD" onclick="setView('readme')">Readme</button>
  <div class="tag">
    <button class="ghostw" onclick="prevWeek()">◀ Prev</button>
    <span id="weekLabel" style="min-width:150px;text-align:center;font-weight:700"></span>
    <button class="ghostw" onclick="nextWeek()">Next ▶</button>
    <span class="status" id="syncStatus"><span class="dot" style="background:#c7d0da"></span>local</span>
    <button class="ghostw" id="authBtn" onclick="toggleEdit()">🔒 View-only</button>
  </div>
</header>
<div class="wrap">

  <div class="card" id="readmeCard" style="display:none"><h2>How this app works</h2><div class="small" id="readmeBody"></div></div>
  <div class="card" id="settingsCard" style="display:none"><h2>Settings</h2><div id="settingsBody"></div></div>
  <div class="card" id="demandCard">
    <h2 id="demandTitle">Demand & coverage</h2>
    <div id="demandBody"></div>
  </div>

  <div class="card">
    <h2 id="gridTitle">Weekly schedule</h2>
    <div style="overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:8px;position:relative"><table id="grid"></table></div>
    <div class="small" style="margin-top:6px">Cells: type or pick a shift (e.g. <b>14:00-22:30</b>), or a code — <b>OFF</b>, <b>PTO</b>, <b>LWOP</b>, <b>R-OFF</b>, <b>OC</b>. Blank = unassigned.</div>
  </div>

  <div class="card">
    <h2>Checks</h2>
    <ul class="flags" id="flags"></ul>
  </div>

  <div style="display:none"><input id="supaUrl"><input id="supaKey"><input type="file" id="imp" accept=".json" onchange="importJSON(event)"><div id="cfgNote"></div></div>
</div>
<div id="lastEdited" style="position:fixed;left:10px;bottom:8px;font-size:11px;color:#8a94a0;background:rgba(255,255,255,.85);padding:2px 8px;border-radius:6px;z-index:400"></div>

<div class="modalbg" id="shiftModal"><div class="modal">
  <h2 id="smTitle">Edit shift</h2>
  <div class="mrow" id="smCodes"></div>
  <div id="smSegs"></div>
  <button class="ghost" onclick="addSeg()" style="margin-top:4px">+ Add split segment</button>
  <div id="smHours" class="small" style="margin-top:6px"></div>
  <div id="smFlags"></div>
  <div class="mrow" style="justify-content:flex-end;margin-top:12px"><button onclick="closeShift()">Cancel</button><button class="brand" onclick="saveShift()">Save</button></div>
</div></div>

<script>
const APP_VERSION="1.0";
document.getElementById("ver").textContent="v"+APP_VERSION;

/* ---------- IN-PAGE DIALOGS (native prompt/confirm/alert are blocked in sandboxed iframes) ---------- */
function uiAlert(msg){return uiDialog(msg,["OK"]).then(()=>{});}
function uiConfirm(msg){return uiDialog(msg,["Cancel","OK"]).then(b=>b==="OK");}
function uiPrompt(msg,def){return uiDialog(msg,["Cancel","OK"],true,def||"");}
function uiDialog(msg,btns,withInput,def){
  return new Promise(res=>{
    const bg=document.createElement("div");bg.className="modalbg";bg.style.display="flex";
    const inp=withInput?`<input id="uiIn" style="width:100%;margin-top:8px;padding:6px;border:1px solid #ccc;border-radius:6px" value="${(def||"").replace(/"/g,'&quot;')}">`:"";
    bg.innerHTML=`<div class="modal" style="${btns.length>3?'max-width:640px':''}"><div style="white-space:pre-wrap">${String(msg).replace(/</g,"&lt;")}</div>${inp}<div class="mrow" style="justify-content:flex-end;margin-top:12px">${btns.map(b=>`<button data-b="${b}" class="${b!=='Cancel'?'brand':''}" style="${b==='Cancel'?'color:#8a94a0':''}">${b}</button>`).join("")}</div></div>`;
    document.body.appendChild(bg);
    const done=v=>{const val=withInput&&v!=="Cancel"?(bg.querySelector("#uiIn").value):v;bg.remove();res(val);};
    bg.querySelectorAll("button").forEach(b=>b.onclick=()=>done(b.dataset.b));
    bg.addEventListener("mousedown",e=>{if(e.target===bg)done(withInput?"Cancel":(btns.includes("Cancel")?"Cancel":btns[0]));});
    if(withInput){const i=bg.querySelector("#uiIn");i.focus();i.select();i.onkeydown=e=>{if(e.key==="Enter")done("OK");if(e.key==="Escape")done("Cancel");};}
  });
}
/* ---------- SHIFT PRESETS & CODES ---------- */
const CODES=["OFF","R-OFF","PTO","LOA","LWOP","FMLA","E-LEAVE","BDH","AB","HU","OC","TASK FORCE","PROJECT","GC","LAUNDRY","ROOMS","CONTROLLER"];
const CODES_COMMON=["OFF","R-OFF","PTO","LOA","LWOP","FMLA","E-LEAVE","BDH","AB","OC"];
const CODES_FO=CODES_COMMON.concat(["TASK FORCE","PROJECT"]);
const CODES_HSK=CODES_COMMON.concat(["GC","LAUNDRY","ROOMS","CONTROLLER","PROJECT"]);
function codesFor(dept){return dept==="HSK"?CODES_HSK:CODES_FO;}
const SHIFTS_FO=["07:00-15:30","11:00-19:30","14:00-22:30","22:30-07:00","07:00-15:30","09:00-17:00"];
const SHIFTS_HSK=["07:00-15:30","08:00-16:30","09:00-17:30","15:00-23:30","22:30-07:00"];

const TYPE_LABEL={FT:"FT",PT:"PT",OC:"On-call",INT:"Intern",OUT:"3rd-party"};
const HRS_PER_SHIFT=7.5;               // used for hours/cost estimate when a cell is a coded shift
const DEFAULT_RATE={FT:12.0, PT:11.0, OC:11.0, INT:9.5}; // $/hr placeholders — edit per person in Config
const OT_AFTER=40, OT_MULT=1.5;
function rateOf(s){return (s.rate!=null&&s.rate!=="")?(+s.rate):(DEFAULT_RATE[s.type]||11.0);}
function shiftHours(v){ // parse "14:00-22:30" -> hours; coded shifts -> HRS_PER_SHIFT; OFF/leave -> 0
  if(!v)return 0; const cls=classify(v); if(cls==="off"||cls==="leave")return 0;
  const m=v.match(/(\d{1,2}):?(\d{2})?\s*(am|pm)?\s*[-–]\s*(\d{1,2}):?(\d{2})?\s*(am|pm)?/i);
  if(m){let h1=+m[1]+(m[2]?+m[2]/60:0),h2=+m[4]+(m[5]?+m[5]/60:0);
    const ap1=(m[3]||"").toLowerCase(),ap2=(m[6]||"").toLowerCase();
    if(ap1==="pm"&&h1<12)h1+=12; if(ap1==="am"&&h1===12)h1=0;
    if(ap2==="pm"&&h2<12)h2+=12; if(ap2==="am"&&h2===12)h2=0;
    let d=h2-h1; if(d<0)d+=24; if(d>0&&d<16)return Math.round(d*2)/2;}
  return null; // NOT parseable as a time window -> unknown hours (flagged, not silently 7.5)
}

const OUTSOURCED_DEFAULT=50; /* JJ+J4 crews clean a constant ~50 rooms/day (Thu-Sun) across every sheet */
function creditsFor(wk,i){const R=CFG.HSK.rules;const d=(DEMAND[wk]&&DEMAND[wk][i])||{};if(d.credits!=null)return d.credits;const hasAny=(d.ooo!=null)||(d.house!=null)||(d.tol!=null)||(d.outsourced!=null);if(hasAny){const ooo=d.ooo||0,house=d.house||0,tol=d.tol||0,out=(d.outsourced!=null?d.outsourced:OUTSOURCED_DEFAULT);const net=R.roomsTotal-ooo-house-tol-out;return Math.max(0,net)*R.creditMult;}if(d.occ!=null){const occ=d.occ>1?d.occ/100:d.occ;return Math.max(0,R.roomsTotal*occ)*R.creditMult;}return 0;}
function raNeeded(wk,i){const R=CFG.HSK.rules;const c=creditsFor(wk,i);if(!c||isNaN(c))return 0;return Math.ceil(c/R.creditsPerRA);}
function supsNeeded(wk,i){const d=(DEMAND[wk]&&DEMAND[wk][i])||{};if(d.arr==null)return 0;return Math.ceil(d.arr/CFG.HSK.rules.arrivalsPerSup);}
function countWorking(role,day){const dept=CFG[DEPT];return dept.staff.filter(s=>s.role===role&&classify(cellVal(s.n,day))==="work").length;}
function personWeek(s){let hrs=0,unk=0,wd=0;const brk=(CFG[DEPT].rules&&CFG[DEPT].rules.breakHrs)||0;for(let i=0;i<7;i++){const v=cellVal(s.n,i);const ad=actualDay(s.n,i);if(ad!=null){hrs+=(+ad);if(classify(v)==="work")wd++;}else if(classify(v)==="work"){wd++;const hh=shiftHours(v);if(hh==null)unk++;else hrs+=Math.max(0,hh-brk);}}hrs=Math.round(hrs*2)/2;const r=rateOf(s);const reg=Math.min(hrs,OT_AFTER),ot=Math.max(0,hrs-OT_AFTER);const cost=(reg*r+ot*r*OT_MULT);return {hrs,unk,reg:Math.round(reg*2)/2,ot:Math.round(ot*2)/2,cost:cost.toFixed(2)};}

/* ---------- CHECKS ---------- */
function availForDate(person,iso){const d=(person.availDates||{});for(const k in d){const a=d[k];if(!a.from)continue;if(iso<a.from||iso>a.to)continue;
    if(!a.part)return {off:true,reason:a.reason||a.code};
    const isFirst=(iso===a.from),isLast=(iso===a.to);
    if(isFirst&&isLast)return {off:false,from:a.startTime||"00:00",to:a.endTime||"23:59",reason:a.reason||a.code};
    if(isFirst)return {off:false,from:a.startTime||"00:00",to:"23:59",reason:a.reason||a.code};
    if(isLast)return {off:false,from:"00:00",to:a.endTime||"23:59",reason:a.reason||a.code};
    return {off:true,reason:a.reason||a.code}; // middle day
  } return null;}
function suggestFor(dept,role,day){const dn=DOW[day];return dept.staff.filter(s=>{if(s.role!==role)return false;if(s.employed===false)return false;const c=classify(cellVal(s.n,day));if(c==="work"||c==="leave"||c==="loa")return false;
    if(s.avail&&s.avail[dn]&&s.avail[dn].off)return false;
    const iso=weekKey(dayDate(day));if(s.availDates&&s.availDates[iso]&&s.availDates[iso].off)return false;
    return true;
  }).map(s=>s.n);}
function renderFlags(){
  const dept=CFG[DEPT];const out=[];const wk=weekKey(WEEK_START);
  // coverage minima
  Object.entries(dept.coverage).forEach(([role,rule])=>{
    for(let i=0;i<7;i++){const have=countWorking(role,i);if(have<rule.min){const cand=suggestFor(dept,role,i);out.push(`<li><span class="pill err">UNDERSTAFFED</span> ${role}: ${have}/${rule.min} on ${DOW[i]}.${cand.length?` <span class="muted">Could assign: ${cand.slice(0,6).join(", ")}${cand.length>6?` <a href="javascript:void(0)" onclick="this.nextSibling.style.display='inline';this.style.display='none';return false" style="color:#1b4b8a">(+${cand.length-6} more)</a><span style="display:none">, ${cand.slice(6).join(", ")}</span>`:""}.</span>`:""}</li>`);}}
  });
  // HSK RA coverage
  if(DEPT==="HSK"){for(let i=0;i<7;i++){const need=raNeeded(wk,i);const have=countWorking("Room Attendants",i);const margin=have-need;
    if(need&&have<need){const offToday=suggestFor(dept,"Room Attendants",i);out.push(`<li><span class="pill err">UNDERSTAFFED</span> Room Attendants: ${have}/${need} on ${DOW[i]}.${offToday.length?` <span class="muted">Could assign: ${offToday.slice(0,6).join(", ")}${offToday.length>6?` <a href="javascript:void(0)" onclick="this.nextSibling.style.display='inline';this.style.display='none';return false" style="color:#1b4b8a">(+${offToday.length-6} more)</a><span style="display:none">, ${offToday.slice(6).join(", ")}</span>`:""}.</span>`:""}</li>`);}
    else if(need&&margin<2)out.push(`<li><span class="pill warn">THIN MARGIN</span> Room Attendants: only ${margin} above needed on ${DOW[i]} (&lt;2).</li>`);
    const sneed=supsNeeded(wk,i);const shave=countWorking("Supervisors",i);if(sneed&&shave<sneed)out.push(`<li><span class="pill err">UNDERSTAFFED</span> Supervisors: ${shave}/${sneed} on ${DOW[i]} (arrivals\u00f725).${(function(){const o=dept.staff.filter(x=>x.role==="Supervisors"&&classify(cellVal(x.n,i))==="off").map(x=>x.n);return o.length?` <span class="muted">Off (could be called): ${o.slice(0,6).join(", ")}.</span>`:"";})()}</li>`);}}
  // busy-day marker (FO: arrivals/departures >= 100)
  if(DEPT==="FO"){for(let i=0;i<7;i++){const d=(DEMAND[wk]&&DEMAND[wk][i])||{};if((d.arr>=100)||(d.dep>=100))out.push(`<li><span class="pill warn">BUSY</span> ${DOW[i]}: ${d.arr||0} arr / ${d.dep||0} dep (\u2265100) \u2014 heavy day.</li>`);}}
  // PT hour caps (FO)
  if(DEPT==="FO"){
  const {ptMin,ptMax}=dept.rules;dept.staff.filter(s=>s.type==="PT").forEach(s=>{let days=0;for(let i=0;i<7;i++)if(classify(cellVal(s.n,i))==="work")days++;const est=days*7.5; if(est>ptMax)out.push(`<li><span class="pill warn">PT CAP</span> ${s.n}: ~${est}h > ${ptMax}h max.</li>`); if(days>0&&est<ptMin)out.push(`<li><span class="pill warn">PT MIN</span> ${s.n}: ~${est}h < ${ptMin}h min.</li>`);});}
  if(!weekIsPast())dept.staff.forEach(s=>{for(let i=0;i<7;i++){if(classify(cellVal(s.n,i))!=="work")continue;const dn=DOW[i];const av=(s.avail&&s.avail[dn])||(s.off&&s.off.includes(dn)?{off:true}:null);if(av){const sched=cellVal(s.n,i);const clashes=av.off?true:shiftOverlaps(sched,av.from||"00:00",av.to||"23:59");if(clashes){const un=av.off?"all day":`${av.from||"00:00"}\u2013${av.to||"23:59"}`;out.push(`<li><span class="pill warn">CONFLICT</span> ${s.n} is unavailable ${dn} (${un})${av.reason?" \u2014 "+av.reason:""}, but is scheduled ${sched}.</li>`);}}}});
  dept.staff.forEach(s=>{const w=personWeek(s);if(w.unk)out.push(`<li><span class="pill warn">HOURS?</span> ${s.n}: ${w.unk} day(s) with unreadable hours \u2014 enter a time window (e.g. 14:00-22:30).</li>`);});
  if(!weekIsPast()){const una=[];for(let i=0;i<7;i++){const list=dept.staff.filter(s=>s.employed!==false&&!s.oncall&&s.role!=="Relievers (on-call)"&&!(s.role||"").startsWith("Outsourced")&&!cellVal(s.n,i)).map(s=>s.n);if(list.length){const _sid="una_"+DEPT+"_"+i;una.push(`<li><span class="pill" style="background:#eef2f6;color:#4a4a4a">UNASSIGNED</span> ${DOW[i]}: ${list.length} \u2014 <span class="muted">${list.slice(0,8).join(", ")}</span>${list.length>8?` <a href="javascript:void(0)" onclick="this.nextSibling.style.display='inline';this.style.display='none';return false" style="color:#1b4b8a">(+${list.length-8} more)</a><span style="display:none" class="muted">, ${list.slice(8).join(", ")}</span>`:""}</li>`);}}if(una.length)out.push(...una);}
  el("flags").innerHTML=(function(){
    if(!out.length)return `<li><span class="pill ok">OK</span> No issues for this week.</li>`;
    const grp={"Understaffed":[],"Overtime":[],"Availability conflicts":[],"Unassigned by day":[],"Data to fix":[],"Other":[]};
    out.forEach(li=>{ if(li.includes("UNDERSTAFFED")||li.includes("THIN MARGIN"))grp["Understaffed"].push(li);
      else if(li.includes(">OT<"))grp["Overtime"].push(li);
      else if(li.includes(">CHECK<")||li.includes(">PT CAP<")||li.includes(">PT MIN<")||li.includes(">OFFs<"))grp["Availability conflicts"].push(li);
      else if(li.includes(">UNASSIGNED<"))grp["Unassigned by day"].push(li);
      else if(li.includes(">HOURS?<")||li.includes(">BUSY<"))grp["Data to fix"].push(li);
      else grp["Other"].push(li); });
    let html="";Object.keys(grp).forEach(g=>{if(grp[g].length)html+=`<li style="list-style:none;margin-top:6px"><b style="color:#1b2a4a">${g} (${grp[g].length})</b><ul style="margin:2px 0">${grp[g].join("")}</ul></li>`;});
    return html;
  })();
}

/* ---------- REALTIME (Supabase) ----------
   One row per (dept, week, staff) with a JSON of day->value, upserted on edit.
   Table: schema below in cfgNote / README. Falls back to localStorage if not connected. */
let PENDING=false; // true if local edits happened while not live
function setStatus(txt,color){el("syncStatus").innerHTML=`<span class="dot" style="background:${color}"></span>${txt}${PENDING?" \u2022 <a href='#' onclick='pushPending();return false' style='color:#ffd54f;font-weight:700'>\u2b06 Upload to live</a>":""}`;}
window.addEventListener("offline",()=>{if(DB)setStatus("unsynced","#e0a800");});
window.addEventListener("online",async()=>{if(DB){setStatus("live","#2c9e5f");if(PENDING){if(await uiConfirm("You\u2019re back online. Upload the changes you made while offline to the live copy?\n\n(Any newer changes made elsewhere may be overwritten \u2014 review the change log after.)"))pushPending();}}});
async function pushPending(){ if(!DB){uiAlert("Connect a Supabase project first (Sync & data).");return;} 
  // push every week that has local data for this dept + demand + snapshots
  for(const dept of ["FO","HSK"]){const wks=ASSIGN[dept]||{};for(const wk of Object.keys(wks)){await pushWeekAll(dept,wk);}}
  for(const wk of Object.keys(DEMAND)){await pushDemand(wk);}
  PENDING=false;setStatus("live","#2c9e5f");flashNote("Local changes uploaded to live.");}
async function maybeUploadOnConnect(){ if(PENDING){ if(await uiConfirm("You have local changes not yet on the live copy. Upload them now?")) await pushPending(); } }
function connect(){
  const url=el("supaUrl").value.trim(),key=el("supaKey").value.trim();
  if(!url||!key){uiAlert("Enter both the Supabase URL and anon key.");return;}
  if(!window.supabase){uiAlert("Supabase library didn't load (need internet). Running local-only.");return;}

/* ---------- OPTIMIZATION SCAFFOLD (auditable auto-fill) ----------
   Structure for a future real optimizer. Today: a greedy, EXPLAINABLE suggester that
   fills unstaffed coverage gaps from eligible, available people ranked by fewest weekly hours.
   Every pick is logged so a human can verify — no black box. */
function eligibleFor(dept,role,day,name){
  const s=dept.staff.find(x=>x.n===name);if(!s)return{ok:false,why:"unknown"};
  if(s.role!==role)return{ok:false,why:"different role"};
  const cur=cellVal(name,day);if(classify(cur)==="work")return{ok:false,why:"already working"};
  if(classify(cur)==="leave")return{ok:false,why:"on leave/PTO"};
  const _dn=DOW[day];if(s.avail&&s.avail[_dn]&&s.avail[_dn].off)return{ok:false,why:"unavailable ("+_dn+")"};
  const dname=DOW[day];
  if(s.off&&s.off.includes(dname))return{ok:false,why:"scheduled off ("+dname+")"};
  if(s.unavailable&&s.unavailable[dname])return{ok:false,why:s.unavailable[dname]};
  // weekly off norm: don't schedule a 6th working day
  let work=0;for(let i=0;i<7;i++)if(classify(cellVal(name,i))==="work")work++;
  if(work>=5)return{ok:false,why:"already 5+ days"};
  // PT cap (FO)
  if(DEPT==="FO"&&s.type==="PT"){const est=(work+1)*HRS_PER_SHIFT;if(est>dept.rules.ptMax)return{ok:false,why:"PT cap"};}
  return {ok:true, hrs:personWeek(s).hrs};
}
async function optimizeWeek(){
  if(!EDIT||weekLocked()){uiAlert("Enter edit mode on an unlocked week to auto-fill.");return;}
  if(!(await uiConfirm("Auto-fill fills only EMPTY cells for understaffed roles, spreading hours to the least-scheduled eligible staff. Existing entries are untouched. Proceed?")))return;
  const dept=CFG[DEPT];const wk=weekKey(WEEK_START);const log=[];let filled=0;
  function need(role,day){ if(dept.coverage[role])return dept.coverage[role].min;
    if(DEPT==="HSK"&&role==="Room Attendants")return raNeeded(wk,day); return 0; }
  const defShift=(DEPT==="FO"?SHIFTS_FO[2]:SHIFTS_HSK[2]); // a sensible default working shift
  dept.roles.forEach(role=>{
    for(let day=0;day<7;day++){
      let have=countWorking(role,day);const want=need(role,day);
      if(!want||have>=want)continue;
      // rank eligible people by fewest weekly hours (spread the load)
      const cands=dept.staff.filter(s=>s.role===role).map(s=>({s,e:eligibleFor(dept,role,day,s.n)}))
        .filter(x=>x.e.ok).sort((a,b)=>a.e.hrs-b.e.hrs);
      for(const c of cands){ if(have>=want)break; setCellQuiet(c.s.n,day,defShift);have++;filled++;
        log.push(`${DOW[day]} ${role}: +${c.s.n} (had ${c.e.hrs}h) → ${defShift}`); }
      if(have<want)log.push(`${DOW[day]} ${role}: still short ${want-have} (no eligible staff)`);
    }
  });
  save("hotel_assign",ASSIGN);pushWeekAll(DEPT,wk);render();
  uiAlert("Auto-fill placed "+filled+" shift(s). Review before posting.\n\n"+(log.slice(0,20).join("\n")||"Nothing to fill."));
}

function shiftOverlaps(shiftStr,uaFrom,uaTo){if(!shiftStr)return false;const uf=hm2min(uaFrom),ut=hm2min(uaTo);if(uf==null||ut==null)return false;let clash=false;String(shiftStr).split(/\s*,\s*/).forEach(seg=>{const m=seg.match(/(\d{1,2}:?\d{0,2}\s*(?:am|pm)?)\s*[-\u2013]\s*(\d{1,2}:?\d{0,2}\s*(?:am|pm)?)/i);if(!m)return;const a=hm2min(to24(m[1])),b=hm2min(to24(m[2]));if(a==null||b==null)return;if(b<=a){ // overnight: split
    if(a<ut&&1440>uf)clash=true;if(0<ut&&b>uf)clash=true;
  } else { if(a<ut&&b>uf)clash=true; }});return clash;}
function hm2min(t){if(!t)return null;const m=String(t).match(/^(\d{1,2}):(\d{2})$/);return m?(+m[1]*60+ +m[2]):null;}
function to24(t){if(!t)return"";t=String(t).trim();const m=t.match(/^(\d{1,2})(?::(\d{2}))?\s*(am|pm)?$/i);if(!m)return/^\d{2}:\d{2}$/.test(t)?t:"";let h=+m[1],mi=m[2]?+m[2]:0;const ap=(m[3]||"").toLowerCase();if(ap==="pm"&&h<12)h+=12;if(ap==="am"&&h===12)h=0;return String(h).padStart(2,"0")+":"+String(mi).padStart(2,"0");}
function editorButtonsHTML(){const _pre=(CFG[DEPT].shifts&&CFG[DEPT].shifts.length)?CFG[DEPT].shifts:(DEPT==="FO"?SHIFTS_FO:SHIFTS_HSK);

function usePreset(p){SM.code="";SM.offMode=false;SM.preset=(SM.preset===p?null:p);if(!SM.preset){SM.segs=[{a:"",b:""}];}else{const m=p.match(/(.+?)\s*[-\u2013]\s*(.+)/);SM.segs=m?[{a:to24(m[1]),b:to24(m[2])}]:[{a:"",b:""}];}drawSegs();editorButtonsHTML();}

function recalc(){

  el("smFlags").innerHTML=hardHtml+fl.map(f=>`<div class="mflag">\u26a0 ${f}</div>`).join("");

  <p><b>What it is:</b> One scheduler for Front Office and Housekeeping. Weeks run Thursday\u2013Wednesday. Click a cell to set a shift window (or a split shift) or a code (OFF/LOA/PTO\u2026).</p>
  <p><b>Editing &amp; roles:</b> The app opens <b>view-only</b>. Click the lock button (top-right), enter the scheduler PIN to edit. <b>Edit mode ends when the page is refreshed or reopened</b> (it returns to view-only); there is no idle timeout yet. Past weeks are a locked historical record \u2014 unlocking one asks for confirmation. A PIN in a static page is a casual gate, not real security; use Supabase Auth for true access control.</p>
  <p><b>Flags carried over from the Excel sheets:</b> the cell colours are OFF / R-OFF / PTO / LWOP / LOA \u2192 grey (rest/leave); On-call / Task Force / Project \u2192 blue; a typed shift or blank \u2192 white; a shift on an unavailable day \u2192 amber caution (both departments).</p>
  <p><b>R-OFF vs OFF vs Unavailable</b> \u2014 <mark style="background:#ffe08a">PENDING VERIFICATION:</mark> The app treats <b>OFF</b> and <b>R-OFF</b> the same (a scheduled non-working rest day, grey), and <b>Unavailable</b> (Availability editor) as a hard constraint that blocks scheduling. In the sheets, FO uses OFF and HSK uses R-OFF for rest days, and only FO records availability constraints (class times, no-GY) as notes \u2014 HSK has none. Whether R-OFF and OFF should differ, and whether HSK needs an availability concept, is unverified.</p>
  <p><b>Understaffing suggestions</b> \u2014 <mark style="background:#ffe08a">PENDING VERIFICATION:</mark> When a role is short on a day, the app suggests staff who are eligible (right role, not on PTO/LOA), idle that day (unassigned, OFF, or R-OFF), and not marked unavailable that day. Because OFF, R-OFF, and Unavailable are treated as above, this rule may need adjusting once the hotel clarifies whether R-OFF/OFF/Unavailable mean different things (e.g. if R-OFF should not be \u201ccallable\u201d). HSK thin margin when RAs scheduled minus needed is &lt;2 (the sheet\u2019s &lt;2 rule); FO busy day when arrivals or departures \u2265100. Plus coverage shortfalls, PT 20\u201332h cap, \u22652 days off, unreadable-hours.</p>
  <p><b>Demand math (from HSK formulas):</b> credits = (total rooms 421 \u2212 OOO/OOS \u2212 house-use \u2212 TOL \u2212 outsourced rooms) \u00d7 1.14; Room Attendants needed = credits \u00f7 14; Supervisors needed = arrivals \u00f7 25. Verified to the cent against the current sheet (D6 and =D6/14). <mark style="background:#ffe08a">PENDING VERIFICATION:</mark> the meaning of \u201cTOL\u201d (a per-day rooms deduction, ~94 on the sample day) is not spelled out in the sheet. The flat \u00d71.14 is the entire credit weighting \u2014 there is no separate check-out vs stayover minute split, so a minute-based tally is not applied.</p>
  <p><b>Overtime basis</b> \u2014 <mark style="background:#ffe08a">PENDING VERIFICATION:</mark> Overtime is flagged after 40 hours within the schedule week (<b>Thursday\u2013Wednesday</b>). Whether this matches how the hotel and Guam law define the overtime workweek is unverified; a different 7-day span (e.g. Sunday\u2013Saturday) would require adjusting the threshold window.</p>
  <p><b>Live sync:</b> The Supabase project URL is prefilled; enter the anon key in Settings and Connect to sync across devices. Until connected the app is local-only; once connected, edits appear on every device in about a second, and offline edits prompt to upload when you\u2019re back online.</p>
  <p><b>Concurrent editing:</b> Edits save per person-row, so two schedulers on different people/departments won\u2019t clash. If two people edit the <b>same</b> person\u2019s same week at once, the last save wins for that row \u2014 coordinate when jointly editing the same staff.</p>
  <p><b>Past-week settings:</b> Current and upcoming weeks always use the live settings, so a change made today (e.g. \u201cno Saturdays from this week\u201d) immediately flags the affected days. When a week rolls into the past it is <b>frozen</b> \u2014 a one-time snapshot of each person\u2019s availability/constraints is kept so history reflects the rules that were actually in effect then, not today\u2019s. Leave stamped onto the schedule stays on past weeks regardless.</p>
  <p><b>Data &amp; history:</b> Settings has Export/Import JSON, Save version + Version history (whole-week snapshots with restore), Auto-fill suggestions, and Export .xlsx in the hotel layout. History records whole-week snapshots with a timestamp/label; per-cell who-changed-what needs Auth (roadmap).</p>
  <hr><p><b>Patterns found in past data</b> \u2014 <mark style="background:#ffe08a">PENDING VERIFICATION</mark></p>
  <ul class="small">
    <li><b>Occupancy differs by department:</b> for the same week (e.g. FO ~61\u201369% vs HSK ~68\u201382%; even arrivals differ, Sat 83 vs 90). The source of each figure is not documented; the reporting basis for each is unverified. The app keeps a separate occupancy row per department.</li>
    <li><b>HSK staffing tracks demand:</b> occupancy vs RAs-needed correlation \u2248 0.76); rule of thumb \u2248 +2.3 room attendants per +10% occupancy.</li>
    <li><b>Scheduled RAs run ~2\u20135 below the formula\u2019s \u201cneeded\u201d:</b> most weeks, the gap is absorbed by relievers/outsourced crews, so \u201cneeded\u201d is treated as a soft target (the app flags it, does not block).</li>
    <li><b>Tuesday is the heaviest RA day:</b> ~23 needed despite mid occupancy; suggests a recurring project/checkout load; unverified.</li>
    <li><b>Front Office staffing driver:</b> FO headcount does not track occupancy (nearly flat) and only loosely tracks arrivals; it appears driven by day-of-week + fixed role coverage. The real staffing rule is undetermined, so FO understaffing is not auto-flagged yet.</li>
    <li><b>Departures vs Check-outs (HSK):</b> the sheet has both as separate rows; Departures = guests leaving, Check-outs = rooms actually checked out (weighted heavier in the credit math). The app weights check-outs more heavily in credits; the distinction needs verification.</li>
    <li><b>Note types:</b> staff notes mix unavailability (\u201cMW off\u201d), shift preferences (\u201cTTH 12-8pm\u201d), and date-range leave (\u201cAira 02/01-03/02 lwop\u201d); the app auto-converts only the unavailability parts.</li>
    <li><b>Outsourced crew shifts</b> \u2014 <mark style="background:#ffe08a">PENDING VERIFICATION:</mark> the sheet lists JJ Global, J4 Janitorial, and Chutter with start-only labels (e.g. \u201c9:AM\u201d, \u201c11AM\u201d) or am/pm ranges. The app assumes an 8-hour shift (supervisors 7h) from each start time so hours and cost compute; confirm actual durations. These crews are paid indirectly, so they are included in the hours/cost totals.</li>
    <li><b>Standard shift times:</b> FO: 07:00, 11:00, 14:00, 19:30, 22:30. HSK: 7\u20133:30pm, 8\u20134:30pm, 9am\u20135:30pm, 3pm\u201311:30pm, 10:30\u20137am (GY).</li>
    <li><b>Pay rates:</b> the per-person $/h values are placeholders (FT $12, PT $11, etc.); actual wages are unverified.</li>
    <li><b>Breaks:</b> the Excel does not subtract break time from shift hours; whether paid hours should be net of a break is unverified (set it in Settings).</li>
  </ul>
  <hr>
  <p><b>Roadmap (not yet built).</b></p>
  <ul class="small">
    <li><b>Server-enforced login:</b> Supabase Auth + row-level security so staff truly cannot write (the in-app PIN is only a casual gate). Per-department scopes are supported in the SQL (FO-only, HSK-only, etc.).</li>
    <li><b>Idle auto-lock:</b> return to view-only after a period of inactivity.</li>
    <li><b>Auto-send mechanism</b> \u2014 <mark style="background:#ffe08a">PENDING VERIFICATION:</mark> How the finished schedule reaches staff today (file-watch flow, messaging app, etc.) so the app can feed the same pipeline.</li>
    <li><b>Staff sort order within a role</b> \u2014 <mark style="background:#ffe08a">PENDING VERIFICATION:</mark> The Excel orders room attendants by a persistent seniority/hire number (not alphabetical); confirm the intended sort so new staff slot correctly.</li>
    <li><b>Sticky assignments</b> \u2014 <mark style="background:#ffe08a">PENDING VERIFICATION:</mark> Whether a new week should prefill from the previous week\u2019s schedule (edit only the changes) or start blank.</li>
    <li><b>Auto-fill optimizer</b> \u2014 <mark style="background:#ffe08a">PENDING VERIFICATION:</mark> A one-click auto-fill exists (fills empty cells for understaffed roles). Making it reliable needs the rule for how many staff each role requires per day, plus analysis of historical staffing patterns to weight preferences and fairness.</li>
  </ul>
  <hr><details><summary style="cursor:pointer"><b>Build conventions</b> <span class="muted">(collapsed \u2014 click to expand)</span></summary>
  <ul class="small">
    <li><b>Capitalization:</b> all UI labels, buttons, tooltips, placeholders, and dropdown options start with a capital letter.</li>
    <li><b>Decimals:</b> dollar values show 2 decimals ($0.00); hours show 1 decimal (0.0h). Occupancy is a whole-number percent (0\u2013100%). Arrivals/departures/credits are whole numbers.</li>
    <li><b>Number restrictions:</b> apply common-sense bounds \u2014 hours 0\u201324, occupancy 0\u2013100, counts \u22650; clamp on entry. HSK room deductions (OOO/OOS, house-use, TOL, outsourced) are each 0\u2013421 and their <b>sum</b> cannot exceed total rooms (421); the last-entered value is capped so the sum stays \u2264421.</li>
    <li><b>Prefilled inputs are editable:</b> an auto-filled/estimated value must be selectable and backspaceable (place the caret, don\u2019t force overwrite).</li>
    <li><b>Checkboxes</b> are a consistent size app-wide; dropdowns show only valid options for the context (e.g. HSK zones are role-specific) plus an \u201cOther\u2026\u201d free-text fallback.</li>
    <li><b>Colour code:</b> OFF/R-OFF/PTO/LWOP/LOA = grey (rest/leave); On-call/Task Force/Project = blue; a typed shift or blank = white; a shift on an unavailable day = amber caution; hours over 40 = red from the crossover cell onward.</li>
    <li><b>Verification flags</b> appear only in this Readme, never in the working tabs.</li>
    <li><b>No native dialogs</b> (alert/confirm/prompt are blocked in sandboxes) \u2014 use the in-page modal helpers.</li>
    <li><b>Edit mode</b> is per-department and ends on refresh; the whole app opens view-only behind a PIN (Auth replaces this when configured).</li>
    <li><b>Weeks</b> run Thursday\u2013Wednesday; current/future weeks always reflect live settings, past weeks use a frozen settings snapshot.</li>
    <li><b>Every change is validated headlessly</b> (the file must boot without throwing) before shipping.</li>
    <li><b>Borders &amp; corners:</b> all data tables use border-radius 8px with overflow:hidden and border-collapse:separate; border-spacing:0 (collapse leaves a 1px corner gap under a sticky header). Cards use 10px radius.</li>
    <li><b>Field heights</b> are uniform (30px) across inputs, selects, and buttons in a row; time/date/text/number fields must line up.</li>
    <li><b>Dates are local (Guam / UTC+10):</b> never use toISOString() for a date key \u2014 build YYYY-MM-DD from local get*(); UTC shifts the day and breaks stamping.</li>
    <li><b>PIN prompt:</b> a click anywhere on the schedule/occupancy in view-only opens the PIN once (owned by a single document-level handler; disabled inputs use pointer-events:none so the click passes through). Edit mode is per-department \u2014 unlocking FO must not unlock HSK, and vice-versa.</li>
    <li><b>De-dup redundancies:</b> a single source of truth per behaviour (one lock control, one leave module, one PIN handler, one demand-input handler) \u2014 avoid duplicate sections/handlers that double-fire or double-render.</li>
    <li><b>Sticky header</b> (grid thead) uses position:sticky; do NOT put overflow:hidden on the table (clips sticky) \u2014 round the scroll wrapper instead.</li>
    <li><b>Demand cells must not clip</b> \u2014 the metric/occupancy labels wrap to two lines; keep line-height ~1.25 with vertical padding and never wrap them in overflow:hidden. A rounded overflow:hidden wrapper clipped the top of \u201cOccupancy %\u201d. Final fix: the demand table header must not be position:sticky (it inherited the global thead sticky and overlapped the first data row); force #demandBody thead th to position:static and add vertical padding on td.demand.</li>
    <li><b>Sticky-cell borders</b> \u2014 with a sticky header or first column, a cell\u2019s real border on the sticky edge can drop (when scrolled) or double against a box-shadow, causing an offset/thick line and a missing line under the Staff row. Fix: keep border-collapse:separate, draw the sticky edge with box-shadow only, and remove the real border on that edge so nothing stacks.</li>
    <li><b>Punctuation:</b> em-dash (\u2014) with spaces for asides; no serial-comma tables; use a colon only to introduce a value inline, not on standalone headers; parentheses for supplementary notes; sentence case for all UI text.</li></ul></details>
  <p class="muted">Version ${APP_VERSION}.</p>`;
}

function daysFromToken(tok){tok=tok.toUpperCase();const map={"MW":["Mon","Wed"],"MWF":["Mon","Wed","Fri"],"TTH":["Tue","Thu"],"MTH":["Mon","Tue","Wed","Thu"],"WEEKDAYS":["Mon","Tue","Wed","Thu","Fri"],"WEEKDAY":["Mon","Tue","Wed","Thu","Fri"],"WEEKENDS":["Sat","Sun"],"WEEKEND":["Sat","Sun"]};if(map[tok])return map[tok];

function zonesForRole(role){if(role==="Room Attendants")return ["6th","7th","8th","9th","10th","11th","12th","13th","14th","15th","16th","17th","18th","19th","20th","21st","22nd","23rd","24th","25th","26th","27th","28th","29th","Reliever"];if(role==="Supervisors")return ["Flr.Sup.","PM Sup.","GY Sup.","Proj/Training"];if(role==="Public Area")return ["AM","PM","GY Sup."];if(role==="Specialist")return ["GY","AM","PM"];if(role==="Room Controller")return ["AM","PM","AM/PM"];return [];}
function floorSelect(nm,editable){const cur=floorOf(nm);const st=CFG[DEPT].staff.find(x=>x.n===nm);const opts=[""].concat(zonesForRole(st?st.role:""));const isOther=cur&&!opts.includes(cur);const nmE=encodeURIComponent(nm);
  return `<select ${editable?"":"disabled"} onclick="event.stopPropagation()" onchange="floorPick(decodeURIComponent('${nmE}'),this.value)" style="font-size:10px;border:1px solid #dfe4ea;border-radius:3px">`+opts.map(o=>`<option value="${o}" ${cur===o?"selected":""}>${o||"\u2014"}</option>`).join("")+`<option value="__other" ${isOther?"selected":""}>Other\u2026</option></select>`+(isOther?`<input value="${esc(cur)}" ${editable?"":"disabled"} onclick="event.stopPropagation()" onchange="setFloor(decodeURIComponent('${nmE}'),this.value)" style="width:50px;font-size:10px;margin-left:2px">`:"");}
function floorPick(nm,v){if(v==="__other"){setFloor(nm,"Other");}else setFloor(nm,v);render();}
function floorOf(nm){const wk=weekKey(WEEK_START);if(FLOORS[wk]&&FLOORS[wk][nm]!=null)return FLOORS[wk][nm];let d=new Date(WEEK_START);for(let k=0;k<8;k++){d.setDate(d.getDate()-7);const pk=weekKey(d);if(FLOORS[pk]&&FLOORS[pk][nm]!=null)return FLOORS[pk][nm];}return "";}
function setFloor(nm,v){const wk=weekKey(WEEK_START);FLOORS[wk]=FLOORS[wk]||{};if(v==="")delete FLOORS[wk][nm];else FLOORS[wk][nm]=v;save("hotel_floors",FLOORS);}
function stampLeave(dept,rec,remove){const from=new Date(rec.from+"T00:00:00"),to=new Date(rec.to+"T00:00:00");
  for(let d=new Date(from);d<=to;d.setDate(d.getDate()+1)){const wk=weekKey(mondayOfWeekStartThu(new Date(d)));const dow=(d.getDay()+3)%7;
    ASSIGN[dept]=ASSIGN[dept]||{};ASSIGN[dept][wk]=ASSIGN[dept][wk]||{};ASSIGN[dept][wk][rec.name]=ASSIGN[dept][wk][rec.name]||{};
    if(remove){if((ASSIGN[dept][wk][rec.name]||{})[dow]===rec.code)delete ASSIGN[dept][wk][rec.name][dow];}
    else ASSIGN[dept][wk][rec.name][dow]=rec.code;}
}
function addLeaveRange(){const nm=el("lvName").value,code=el("lvType").value,f=el("lvFrom").value;let t=el("lvTo").value;
  if(!f){uiAlert("Pick a date.");return;}if(!t)t=f;if(new Date(t)<new Date(f)){uiAlert("From is after To.");return;}
  const rec={name:nm,code:code,from:f,to:t,reason:(el("lvReason")?el("lvReason").value:"")};logChange("leave",code+" "+nm+" "+f+"\u2192"+t);LEAVES[SETDEPT]=LEAVES[SETDEPT]||[];LEAVES[SETDEPT].push(rec);save("hotel_leaves",LEAVES);
  stampLeave(SETDEPT,rec,false);save("hotel_assign",ASSIGN);el("lvFrom").value="";el("lvTo").value="";drawLeaveList();uiAlert(code+" added for "+nm+".");render();
}
function drawLeaveList(){const box=el("lvList");if(!box)return;const today=new Date();today.setHours(0,0,0,0);
  // auto-drop entries whose TO date has passed (schedule stamps remain)
  LEAVES[SETDEPT]=(LEAVES[SETDEPT]||[]).filter(r=>new Date(r.to)>=today);save("hotel_leaves",LEAVES);
  const list=LEAVES[SETDEPT]||[];
  box.innerHTML=list.length?("<b>Active/upcoming:</b><br>"+list.map((r,i)=>`\u2022 ${esc(r.name)} \u2014 ${r.code}${r.reason?" ("+esc(r.reason)+")":""} ${r.from}\u2192${r.to} <a href="javascript:void(0)" onclick="removeLeave(${i});return false">remove</a>`).join("<br>")):"<span class='muted'>No upcoming leave. (Past leave stays stamped on the schedule.)</span>";
}
function removeLeave(i){const r=(LEAVES[SETDEPT]||[])[i];if(!r)return;stampLeave(SETDEPT,r,true);save("hotel_assign",ASSIGN);LEAVES[SETDEPT].splice(i,1);save("hotel_leaves",LEAVES);drawLeaveList();render();}
/* ---------- CLEAR (day / week) ---------- */
async function clearScope(kind){
  if(!EDIT||weekLocked())return; const dept=CFG[DEPT];
  if(kind==="week"){ if(!(await uiConfirm("Clear ALL assignments for "+dept.label+" this week? (A version is saved first.)")))return;
    saveSnapshot(); dept.staff.forEach(s=>{for(let d=0;d<7;d++)setCellQuiet(s.n,d,"");}); save("hotel_assign",ASSIGN);TOUCH();render();return; }
  if(kind==="day"){ const d=await uiPrompt("Clear which day? Type: "+DOW.join(", "),"");
    if(!d||d==="Cancel")return; const di=DOW.findIndex(x=>x.toLowerCase()===d.trim().toLowerCase());
    if(di<0){uiAlert("Not a day name.");return;}
    if(!(await uiConfirm("Clear all "+DOW[di]+" assignments for "+dept.label+"?")))return;
    saveSnapshot(); dept.staff.forEach(s=>setCellQuiet(s.n,di,"")); save("hotel_assign",ASSIGN);TOUCH();render();return; }
}

function snapshotSettings(dept,wk){ // freeze current per-person avail/off/availDates/floor/rules for this week
  const D=CFG[dept];const snap={rules:JSON.parse(JSON.stringify(D.rules||{})),staff:{}};
  (D.staff||[]).forEach(s=>{snap.staff[s.n]={off:(s.off||[]).slice(),avail:JSON.parse(JSON.stringify(s.avail||{})),availDates:JSON.parse(JSON.stringify(s.availDates||{})),noGY:!!s.noGY};});
  SETHIST[dept]=SETHIST[dept]||{};SETHIST[dept][wk]=snap;save("hotel_sethist",SETHIST);
}
function effStaff(s){ // return the person's constraints as they were for the VIEWED week (past=frozen, else live)
  if(weekIsPast()){const snap=((SETHIST[DEPT]||{})[weekKey(WEEK_START)]);if(snap&&snap.staff&&snap.staff[s.n])return snap.staff[s.n];}
  return {off:s.off,avail:s.avail,availDates:s.availDates,noGY:s.noGY};
}
