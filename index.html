  <p><b>What it is:</b> One scheduler for Front Office and Housekeeping. Weeks run Thursday\u2013Wednesday by default (the start day is configurable in Settings \u2014 Workweek starts on \u2014 but stays Thu\u2013Wed unless changed). Click a cell to set a shift window (or a split shift) or a code (OFF/LOA/PTO\u2026).</p>
  <p><b>Editing &amp; roles:</b> The app opens <b>view-only</b>. Click the lock button (top-right), enter the scheduler PIN to edit. <b>Edit mode ends when the page is refreshed or reopened</b> (it returns to view-only); there is no idle timeout yet. Past weeks are a locked historical record \u2014 unlocking one asks for confirmation. A PIN in a static page is a casual gate, not real security; use Supabase Auth for true access control.</p>
  <p><b>Flags carried over from the Excel sheets:</b> the cell colours are OFF / R-OFF / PTO / LWOP / LOA \u2192 grey (rest/leave); On-call / Task Force / Project \u2192 blue; a typed shift or blank \u2192 white or a light per-shift tint (see below); a shift on an unavailable day \u2192 amber outline caution (both departments).</p>
  <p><b>Excel shift-colour coding \u2014 re-extracted directly from both real Excel files this round</b> (a prior version had a column-offset bug that mis-read HSK's actual colours; corrected here): <b>FO</b> has 4 clean, confirmed, distinct colours per exact shift time \u2014 07:00\u201315:30 pink, 11:00\u201319:30 light green, 14:00\u201322:30 light blue, 22:30\u201307:00 gold \u2014 all lightened (~50% toward white) per request, since the hotel confirmed they value this feature for visually verifying shift coverage at a glance. <b>HSK is more limited and partially inconsistent</b> in the source Excel: the majority of staff (Room Attendants) show NO colour on regular working days at all (their cells are a bare zone digit, not a time \u2014 confirmed via the workbook's own theme-color data); Supervisors/Room Controllers show SOME colouring, but it isn't reliably tied to time-of-day (one Room Controller's morning shift was coloured identically to their evening shift, while a Supervisor's morning shift stayed white) \u2014 this lines up with the meeting's "they copy and paste the shifts" comment, i.e. manual/ad-hoc highlighting, not a clean rule. Given that, HSK uses ONE simple, lightened, best-effort approximation (12:00\u201306:59 start \u2192 pale peach, matching the more common "evening gets coloured" case) rather than a confirmed exact rule \u2014 flagged here as an approximation, not asserted as fact.</p>
  <p><b>How flags (OT, availability conflicts, etc.) interact with the shift-colour tint \u2014 explained by design, not blended:</b> a cell's appearance is deliberately split into three independent, non-competing channels so nothing is ever silently lost or visually muddied by two colours mixing: <b>(1) Background fill</b> \u2014 controlled by ONE JS-computed priority per cell: overtime (light red) beats unavailable/leave (grey) beats the Excel shift-tint/task-yellow beats plain white. Only one of these ever paints the fill; they never layer. <b>(2) Border/outline</b> \u2014 used for "this needs attention" signals that should stay visible NO MATTER what the fill is showing: the amber caution outline (unreadable hours / scheduling conflict), the understaffing-adjacent red CONFLICT outline, the dashed amber "pending leave request" outline, and a teal "PT CAP" outline (changed from purple this round \u2014 purple was the only flag-border hue outside the amber/red family, which read as visually louder/more alarming than PT-cap's actual informational severity; teal keeps the same at-a-glance distinctiveness while reading calmer) on any day that pushes a part-timer over 32h for the week \u2014 all four now share the SAME -2px offset (a prior version briefly had PT CAP at a different -4px offset; corrected in an earlier round back to matching every other outline, specifically because reviewers found a mismatched offset looked inconsistent rather than helpfully "layered"). A border sits around the cell rather than painting over it, so it can coexist with any fill colour without blending. <b>(3) Text/icon</b> \u2014 the \u26a0/? mark, "REQ. LEAVE" label, and the hours figure's own red/green colour are a third, always-legible layer on top. <b>A concrete fix made a prior round:</b> the caution style previously set its own background fill marked "!important", which could silently override the fill-priority chain above (e.g. an overtime cell that was ALSO flagged caution would lose its red OT fill to the caution's yellow fill) \u2014 exactly the "layered/blended colours" pattern to avoid. Caution now uses only an outline + icon, never a fill, so it can never fight with the OT/leave/shift-tint fill priority again. <b>NEW this round \u2014 a genuine bug found and fixed in how the shift-tint fill itself was being applied:</b> the fill-priority function was only ever being CALLED for cells classified "work" — so the newly-added task-code yellow (see below) for GC/TASK FORCE/PROJECT/OC, which are classified "special" rather than "work", could never actually render; confirmed by a direct test showing the cell fell back to a plain static light-blue background instead. Fixed by also invoking the fill logic for "special"-classified cells. <b>Also directly verified (not assumed) that OT-red and the new task-yellow can never actually compete for the same cell:</b> the OT check only ever fires on a day whose OWN hours push the weekly total over 40 — and task-coded cells (GC/TASK FORCE/PROJECT/OC) are never counted as contributing hours at all (they're "special," not "work"), so a task-coded day can never itself be the one that crosses the 40h line. The "OT wins" ordering in the code is a correct safety net, not something ever actually exercised in practice given this app's current hour-counting design.</p>
  <p><b>NEW this round \u2014 task/assignment codes DO carry their own Excel colour, confirmed directly in BOTH source files:</b> re-scanned both the HSK and FO Excel files specifically for GC/TASK FORCE/PROJECT/Trainee/OC cells and found that "8AM-4:30PM/GC" (HSK) and "TASK FORCE" (FO) both use the exact same bright yellow fill (RGB FFFFFF00) \u2014 a genuinely different signal from plain shift-time tinting (this is about a special TASK layered on top of a shift, not about WHEN someone works), and shared identically across both departments. A lightened, pastel version of that same yellow now applies to any GC/TASK FORCE/PROJECT/OC cell in either department, matching the same "make it lighter" treatment applied to every other colour this round. Checked but NOT found with any distinct colour of their own: plain "Trainee" cells (inconsistent/no fill across the samples checked, matching the same "manual/ad-hoc, not a clean rule" finding already documented for Supervisors' peach below) and "OC" on its own outside the yellow-coded codes above.</p>
  <p><b>R-OFF vs OFF vs Unavailable</b> \u2014 <b>CONFIRMED with the hotel:</b> <b>R-OFF</b> means requested time off and is treated the same as <b>Unavailable</b> \u2014 both are classified internally as "leave" (same bucket as PTO/LOA/LWOP) and are excluded from "could assign"/auto-fill suggestions. Plain <b>OFF</b> is an ordinary scheduled rest day and remains callable \u2014 it can still appear in "could assign" suggestions and the Supervisors "off (could be called)" list. This distinction applies uniformly to both departments (FO and HSK).</p>
  <p><b>Understaffing suggestions:</b> When a role is short on a day, the app suggests staff who are eligible (right role, not on PTO/LOA/R-OFF/Unavailable), idle that day (unassigned or plain OFF only \u2014 never R-OFF, CONFIRMED with the hotel), and not marked unavailable that day. HSK thin margin when RAs scheduled minus needed is &lt;2 (CONFIRMED "the sheet's &lt;2 rule"); a "checkouts per RA &gt;4" load flag (CONFIRMED); FO busy day when arrivals or departures \u2265100; FO coverage rules for Front Desk Agents, Bell Attendants (Transportation-driven), and Valet (Events-driven). Plus coverage shortfalls, PT 20\u201332h cap (CONFIRMED "for all departments, that's their [HR's] cap" \u2014 applies to every role, both FT/PT distinction and both departments), \u22652 days off, unreadable-hours.</p>
  <p><b>Auto-fill scope \u2014 which roles it covers, and which it doesn\u2019t (yet):</b> Auto-fill (and the understaffing flags) work for any role with either (a) an entry in the Coverage minimums table (Settings), or (b) a demand-driven formula \u2014 Room Attendants, Supervisors, Front Desk Agents, Bell Attendants, Valet. <b>CONFIRMED with the hotel this is exactly how it behaves</b> (from the meeting: "there is a short auto-fill button, but because the staffing demand wasn\u2019t filled in yet, it wasn\u2019t auto-filling everything") \u2014 a demand-driven role only gets a nonzero "needed" number once its underlying inputs (Arrivals/Departures/Occupancy/Events/Transportation, as applicable) are actually entered for that week; leaving demand blank means Auto-fill correctly has nothing to fill for those roles, it is not a bug. <b>UPDATED — all previously-uncovered HSK roles now have an editable minimum</b> (Managers, Specialist, Room Controller, PM Turndown RA, AM Houseman, PM Houseman, Laundry/Uniform, Graveyard PA), so Auto-fill and understaffing flags now apply to them too, matching how FO roles work — each defaults to a conservative min:1 placeholder (this pending status is tracked here in the Readme rather than as a visible note in Settings, per preference to keep the working sheets clean) until the hotel confirms real minimums per role. ("Public Area" was removed from this list this round \u2014 see the "Public Area vs. A/B/Graveyard-shift PA" finding below for why.) Room Attendants and Supervisors intentionally stay OUT of this simple-minimum table since they already have their own demand-formula "needed" row — adding a second, separate minimum for them would create two competing numbers for the same role. Relievers (on-call) and the Outsourced crews remain intentionally excluded since they’re fill-in/overflow roles, not targets to be pre-filled themselves. In FO — Front Desk Supervisor and Concierge Agent still have no minimum defined, and Interns are excluded since their count is a result of substituting into Front Desk Agents, not an independent target. <b>Task codes (GC, LAUNDRY, ROOMS, CONTROLLER, TASK FORCE, PROJECT):</b> staff marked with these codes on a given day do not count toward that role's scheduled headcount for coverage/flag purposes (they're doing a different task that day) \u2014 <mark style="background:#ffe08a">PENDING VERIFICATION</mark> that this is the intended behavior versus counting them toward headcount since they are still "at work."</p>
  <p><b>Demand math (CONFIRMED with the hotel, updated after the Aug 14 meeting):</b> credits = (421 rooms + 54 extra credits for room types that count as 2 credits \u2212 OOO/OOS \u2212 house-use) \u00d7 1.14 \u2014 the hotel confirmed the true total is <b>475 credits</b> at full capacity (421 + 54), and the 1.14 is kept as a separate, deliberate buffer for not knowing in advance whether those 2-credit rooms will actually be used ("it's kind of like a buffer for us"). Both the "+54" and the "\u00d71.14" are editable in Settings. Room Attendants needed = credits \u00f7 14; Supervisors needed = arrivals \u00f7 25. <mark style="background:#ffe08a">PENDING VERIFICATION:</mark> checked the actual Excel formula directly (not just the displayed numbers) across all 11 weekly sheets from 05/28 through 08/12, 2026, and found a genuine internal inconsistency in the source spreadsheet itself: the credits formula (cell E6 etc.) subtracts a value from a SEPARATE, secondary "Available Rooms" block (columns M–S) rather than from the visible "Arrival" row directly below it (columns E–K) — and for the exact same date, these two blocks consistently show very different numbers (e.g., week of 07/02: the formula uses 110 while the visible Arrival row for that same Thursday shows 53). This is why no clean, self-consistent formula could reverse-engineer the Excel's exact output — the Excel's own formula isn't reading the number a person looking at the sheet would assume it's using. This app's formula instead implements the verbal description confirmed in the meeting (475 total credits, ×1.14 buffer, OOO/house subtracted) rather than importing that apparent spreadsheet inconsistency — recommend flagging this specific discrepancy to whoever maintains the HSK Excel, since it may be an unnoticed formula-reference bug from copying the weekly template forward. RE-VERIFIED again this round with the exact column range double-checked \u2014 is TOL secretly hiding in that secondary block?</b> No, confirmed again. The "TOTAL TOL" row (row 8, directly below "Total Credits to assign," within the main visible table \u2014 columns B through L in every sheet checked) is genuinely blank in every single cell, every week from 05/28\u201308/12, consistent with the meeting's confirmation that TOL is defunct. Separately, the secondary block that starts around column L (L\u2013S in most sheets, M\u2013S in a few) has its OWN header explicitly reading "Available Rooms" \u2014 not "TOL," not any variant of it \u2014 and is a distinct, parallel Arrival/Departure/Occupancy mini-table for the same dates. So the formula's mysterious reference to a mismatched number is NOT TOL sneaking back in through a side door \u2014 it's a genuinely separate, differently-tracked "Available Rooms" figure that simply doesn't match the visible Arrival row, for reasons the sheet itself doesn't explain. <b>TOL confirmed removed:</b> "Tree of Life" was confirmed as a defunct 2024 initiative no longer in use, fully removed from the formula and demand table. <b>Credits row is now auto-calculated but editable</b> \u2014 a typed value always overrides the auto calc; clearing it returns to auto. <b>Outsourced is now fully auto-calculated (confirmed with hotel):</b> "that's determined by what cannot be covered by in-house manpower... if the hotel isn't busy, we don't use outsourced, so it's not actually a static number." It is no longer an editable input or part of the credits/RA-needed formula (that would be circular, since it depends on RAs actually scheduled) \u2014 it now shows as a single, merged "Outsourced" row in the same "assigned / needed" style as every other role \u2014 "assigned" counts actual outsourced staff (JJ Global + J4 Janitorial + Laundry chute) scheduled to work that day, "needed" is a suggested headcount computed from the credit gap (gross demand minus what the Room Attendants actually scheduled can cover) \u00f7 a rooms-per-worker Setting. CONFIRMED with the hotel that outsourced contractors work a 7.5h shift (10:00\u201318:00, after the 0.5h break) and clean "5 to 7 rooms per day" ("we would probably assign 5 rooms" was the example given); the rooms-per-worker figure is an editable Settings field (Settings \u2192 Rules &amp; thresholds \u2192 "Rooms per outsourced worker", default 5, the lower/conservative end of the confirmed 5\u20137 range) rather than a hardcoded number, so it can be tuned without editing code. <b>Renamed from "Outsourced rooms per worker":</b> the old wording could misread as "(outsourced rooms) per worker" or even as though the hotel's own staff were being lent out; "Rooms per outsourced worker" more directly matches the hotel's own term for these staff ("contractor"). <b>Checkouts per RA</b> is a single combined row (the higher of Arrivals/Departures \u00f7 Room Attendants scheduled that day, CONFIRMED with the hotel \u2014 whichever of arrivals/departures is larger, since that represents the greater cleaning workload); flagged in a strong red outline above the configurable ratio max (Settings, default 4; hotel confirmed the true threshold is &gt;4, not &gt;5). If zero Room Attendants are scheduled while checkouts are due, the ratio is mathematically infinite and shows as "\u221e" \u2014 it flags through the exact same threshold check as every other case, no special-cased marker needed. <b>Occupancy, Arrivals, and Departures are all strictly one-way (FO \u2192 HSK):</b> confirmed with the hotel \u2014 entered once on Front Office, Housekeeping shows read-only mirrors. <b>Events</b> and <b>Transportation</b> are Front Office-only demand inputs driving Valet and Bell Attendants coverage (ratios configurable in Settings \u2014 still <mark style="background:#ffe08a">PENDING VERIFICATION</mark> of the exact ratio; the hotel acknowledged in the meeting this "is a little bit trickier" and didn't give a firm number). <b>Front Desk Agents needed \u2014 CONFIRMED flat model (no longer pending):</b> the hotel explicitly confirmed in the Aug 14 meeting this is a flat, additive step function, not proportional scaling: "anything over 70 [arrivals], I'd say we'd need more than three people... anything over 100 departures, three people... if it's 170 combined, you'd need six people total." So +3 once Arrivals reach 70, and +3 once Departures reach 100 (both thresholds/increments editable in Settings), minus Interns currently scheduled (confirmed substitutable 1-for-1), floored at 0. The scaling checkbox remains available but should stay unchecked (flat is now the confirmed model). A baseline minimum of <b>1 Front Desk Agent per shift</b> was also added (the desk should never hit zero even below the 70/100 thresholds) \u2014 <b>VERIFIED against 4 weeks of the actual FO Excel (07/23\u201308/19):</b> every single day across all 4 weeks had at least 2 Front Desk Agents actually scheduled (never zero, never even just 1), so a floor of 1 is a safe conservative minimum \u2014 but the true minimum may be closer to 2; recommend the hotel confirm the exact intended floor. <b>IMPORTANT honest caveat, re-checked this round with combined FDA+Intern counts (interns substitute 1-for-1, confirmed):</b> across those same 4 weeks/28 days, the STATISTICAL CORRELATION between actual combined FDA+Intern headcount scheduled and Arrivals, Departures, or Arrivals+Departures combined is essentially ZERO (in fact very slightly negative, around \u22120.1 to \u22120.2) \u2014 the real historical schedules do NOT visibly follow the flat +3/+3 rule the hotel described verbally in the meeting. This doesn't contradict the hotel's stated INTENT (which was clearly and specifically confirmed in their own words), but it does mean the actual past schedules can't be used to independently verify that intent was followed in practice \u2014 possible explanations include staffing being set from a forecast rather than same-day actuals, scheduling habit/convenience overriding the formal rule, or the rule being aspirational/recently adopted rather than retroactively applied. Recommend the hotel independently confirm whether the flat model is truly what recent schedules should reflect going forward, since the historical data alone cannot confirm it. <b>RE-CHECKED this round with a specific alternate interpretation \\u2014 "does the ratio '1 agent per 23 arrivals, 1 per 33 departures' fit the actual data better than the flat model?"</b> A genuinely important new nuance emerged, beyond the correlation check above: while NEITHER model correlates with day-to-day trends (both near-zero, confirmed again), they differ sharply in ABSOLUTE magnitude. Computed directly across the same 28 real day-observations: the confirmed flat model (+3/+3 with a floor of 1) predicts an average of just <b>1.64</b> combined FDA+Intern staff per day (mean absolute error 5.61 vs. the real average) \\u2014 because most days never actually cross the 70-arrival/100-departure thresholds at all, so the model sits at its floor almost every day. The ratio interpretation (\u2308arr\u00f723\u2309 + \u2308dep\u00f733\u2309) predicts a much higher average of <b>5.43</b>, with a far smaller mean absolute error of <b>2.04</b> \\u2014 much closer to the real historical average of <b>7.25</b> combined staff/day, even though it still doesn't correctly predict which SPECIFIC days need more or fewer people. <b>Practical implication:</b> the flat model, exactly as verbally described, appears to dramatically UNDER-predict typical real-world staffing whenever demand stays below both thresholds (which is most days) \\u2014 strongly suggesting the flat +3/+3 rule is meant to apply ON TOP OF some other baseline staffing level this app doesn't yet model (e.g. a per-shift baseline independent of arrivals/departures), rather than being the complete staffing formula on its own. Recommend the hotel clarify whether there's an unstated baseline headcount the +3/+3 rule adds to, since the rule as literally described doesn't match typical actual staffing levels on its own. <b>APPLIED this round (per explicit instruction: "apply ratio interpretation for front desk agents for now"):</b> the ACTIVE DEFAULT model is now "ratio" (1 agent per 23 Arrivals + 1 per 33 Departures, ceiling-rounded), changed from "flat," given the absolute-magnitude fit demonstrated above. All three interpretations \u2014 flat, scaling, and ratio \u2014 remain fully present and switchable in Settings \u2192 Rules & thresholds \u2192 "Front Desk Agents needed \u2014 model" (a dropdown, replacing the old flat-only inputs + a single scaling checkbox); this is a default/priority change made "for now," not a removal of the hotel's own confirmed flat description \u2014 recommend the hotel weigh in directly on which of the three should be the long-term default, since none of the three has been independently verified against which SPECIFIC days need more or fewer staff, only which one's overall predicted headcount magnitude looks closer to history.</p>
  <p><b>Coverage minimums \u2014 now a single compact, generic table in Settings</b> (collapsed by default to save space): every role with a minimum-headcount rule (Front Desk Agents, Greeter, Bell Captain, Bell Attendants, Guest Service Agent, Guest Service Supervisors) is listed in one row each, with an editable minimum headcount AND a "Per day / Per shift" dropdown \u2014 any role can be switched between the two units, not just the ones hardcoded before. The role-header pill above each role's rows in the schedule states "per day" or "per shift" explicitly. "Per shift" coverage is checked against three approximate 8h bands (Day 07:00\u201315:29, Swing 15:30\u201322:59, Overnight 23:00\u201306:59) \u2014 <mark style="background:#ffe08a">PENDING VERIFICATION</mark> of the exact band boundaries; the meeting confirmed 4 shifts exist (morning/mid/evening/graveyard) for Front Desk Agents and Bell, but not the exact cutover times beyond the standard shift presets. Concierge Agent, Greeter, Bell Captain, and Guest Service Supervisors default to an 11:00\u201319:00 shift on a blank cell (CONFIRMED: "keep them on one shift, the 11 to 7 shift") \u2014 only a default suggestion, any other shift can still be freely assigned. <b>Fixed a genuine redundancy this round:</b> Front Desk Agents and Bell Attendants previously had TWO independent, uncoordinated "needed" checks \u2014 a flat coverage.min floor and a separate demand-driven ratio \u2014 which could show two DIFFERENT numbers for the same role/day. The floor is now folded directly into their demand-driven functions (fdaNeeded/transportBellNeeded) via a single Math.max(), so there's one authoritative number everywhere (demand table, Checks, Auto-fill) and the generic coverage-minima check skips these two roles to avoid re-checking the same floor twice.</p>
  <p><b>All understaffing flag thresholds are configurable in Settings</b> (inside the collapsible "Rules &amp; thresholds" section) and are re-read live on every render, so a Settings change and the Checks panel/demand table can never drift out of sync: HSK's THIN MARGIN minimum (default 2, CONFIRMED "the sheet's &lt;2 rule") and CHECKOUT LOAD ratio max (default 4, CONFIRMED &gt;4); FO's BUSY thresholds and the Front Desk Agents numbers above. <b>Understaffed cells are visually stronger</b> than a pale background \u2014 short-staffed cells get a solid red border, bold red text, and a \u26a0 icon, and the scheduled/needed figures in each row now always show a space around the "/" (e.g. "5 / 7") for readability. <b>Checks panel consolidated (per feedback: too messy with too many understaffed lines):</b> understaffing used to print one separate bullet per role PER DAY \u2014 a role short on 5 different days produced 5 separate lines. It's now ONE bullet per role/position for the whole week (e.g. "Front Desk Agents: short Thu 4 / 7, Sat 3 / 6"), with a single deduplicated "Could assign" name list appended at the end covering all of that role's short days combined, instead of repeating a name list after every individual day.</p>
  <p><b>"(sched/need)" hint \u2014 REMOVED entirely this round (per explicit feedback: "delete Front Desk Agents '(sched/need)' text"):</b> an earlier round had already reduced this to showing only once per table (on the first demand-driven row) as a partial fix, and had explicitly flagged full removal as the next step "if this is still considered too much." That point has now been reached \u2014 the hint is gone from every demand-driven row (Room Attendants, Supervisors, Front Desk Agents, Bell Attendants, Valet, Outsourced workers), not just the one row named in the feedback, since leaving it on some rows and not others (purely based on which happened to render first) would have been an arbitrary, confusing inconsistency rather than a real fix. The "scheduled / needed" (X / Y) numbers are left to stand on their own \u2014 self-explanatory once a reader has seen the pattern, as previously noted here as the tradeoff for this option. The separate "Checkouts per RA (auto)" row's clarifying note was also reworded, since it previously referenced the now-removed "sched/need" hint by name (it now reads "a ratio, not a scheduled/needed count like the rows below," which stands on its own without depending on wording that no longer exists elsewhere on the page).</p>
  <p><b>Overtime basis:</b> Overtime is flagged after a fixed, hardcoded <b>40 hours</b> (not editable) within the schedule week. The week's <b>start day is configurable</b> in Settings (\u201cWorkweek starts on\u201d) \u2014 default and standard is <b>Thursday\u2013Wednesday</b>, matching the hotel sheets; changing it shifts both the schedule grid and the OT-week boundary together for both departments. A fixed <b>30-minute unpaid break is subtracted per working shift</b>, for every person in both departments, before hours count toward the 40h threshold (hardcoded, not user-editable).</p>
  <p><b>Live sync:</b> The Supabase project URL is prefilled; enter the anon key in Settings and Connect to sync across devices. Until connected the app is local-only; once connected, edits appear on every device in about a second. <b>Found and fixed a real bug \u2014 the local\u2192live upload prompt could silently never fire:</b> the app tracked "do I have unpushed local edits?" using a plain in-memory flag that always reset to false on every page load. Local edits themselves were (and still are) safely saved to the browser\u2019s storage, but the app\u2019s memory of "there\u2019s something to upload" was not \u2014 so if you made an edit, then at any point reopened or refreshed the page (even much later) BEFORE clicking Connect, the prompt would not appear even though real unpushed changes existed, exactly as reported. This is now a persisted flag that survives reloads, so the prompt fires correctly regardless of how much time or how many page loads happen between making a local edit and clicking Connect. <b>Separately, still confirmed working as designed:</b> whenever you Connect (or the app auto-reconnects on load) WITH pending local edits present, a confirmation dialog appears asking "You have local changes not yet on the live copy. Upload them now?" before anything is pushed \u2014 nothing uploads silently, and if there are no pending edits, no dialog appears (nothing to ask about). The same prompt also reappears automatically when the browser comes back online after being offline.</p>
  <p><b>FOUND this round \u2014 root cause of "still unable to connect... 'public.leave_requests' schema" errors:</b> the app's own code comment claimed "Table: schema below in cfgNote / README," but no actual SQL table-creation script was EVER present anywhere in the app \u2014 a genuine gap. That error message means Supabase's PostgREST layer cannot find a table named <code>leave_requests</code> in the <code>public</code> schema of the connected project, which happens when the table was simply never created (or a schema-cache refresh is needed after creating it). This is a database-side setup step, not something the app itself can fix in JavaScript \u2014 the app can only report the error clearly (which it already does, in the sync status pill), not create the missing table on your behalf. <b>Fix: the actual SQL is now provided below</b> \u2014 run it once in your Supabase project's SQL Editor to create all 5 tables the app expects (<code>assignments</code>, <code>demand</code>, <code>leave_requests</code>, <code>snapshots</code>, <code>user_roles</code>), matching exactly the columns/upsert-conflict-keys the code already uses:</p>
  <pre style="background:#f4f6f8;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:11px;overflow:auto;white-space:pre">create table if not exists public.assignments (
  dept text not null, week text not null, staff text not null,
  days jsonb not null default '{}'::jsonb,
  primary key (dept, week, staff)
);
create table if not exists public.demand (
  week text primary key, days jsonb not null default '{}'::jsonb
);
create table if not exists public.leave_requests (
  id text primary key, data jsonb not null default '{}'::jsonb
);
create table if not exists public.snapshots (
  dept text not null, week text not null,
  versions jsonb not null default '[]'::jsonb,
  primary key (dept, week)
);
create table if not exists public.user_roles (
  id uuid primary key references auth.users(id),
  email text, role text default 'viewer',
  can_edit_fo boolean default false, can_edit_hsk boolean default false,
  can_edit_fo_settings boolean default false, can_edit_hsk_settings boolean default false
);
-- Realtime: add each table to the "supabase_realtime" publication so live updates broadcast
alter publication supabase_realtime add table public.assignments;
alter publication supabase_realtime add table public.demand;
alter publication supabase_realtime add table public.leave_requests;
-- RLS: enable + a permissive starter policy (tighten later once Auth roles are configured \u2014 see Roadmap)
alter table public.assignments enable row level security;
alter table public.demand enable row level security;
alter table public.leave_requests enable row level security;
alter table public.snapshots enable row level security;
alter table public.user_roles enable row level security;
create policy "allow all (anon)" on public.assignments for all using (true) with check (true);
create policy "allow all (anon)" on public.demand for all using (true) with check (true);
create policy "allow all (anon)" on public.leave_requests for all using (true) with check (true);
create policy "allow all (anon)" on public.snapshots for all using (true) with check (true);
create policy "allow read (anon)" on public.user_roles for select using (true);</pre>
  <p class="small muted">After running this, if the SAME error persists, it means PostgREST's schema cache is stale \u2014 in the Supabase dashboard, go to Settings \u2192 API and click "Reload schema cache" (or wait a minute; it refreshes automatically on a delay after DDL changes).</p>
  <p><b>NEW this round \u2014 "Reset test data before launch" (per request: "I made some changes like leave requests, unavailability etc for testing. I want to revert before pushing to GitHub and going live"):</b> a genuinely important distinction worth explaining, not just a button: schedule/leave-request test data (assignments, demand entries, leave requests, locks, saved version snapshots, actual-hours overrides, floor/zone assignments, one-off leave ranges, overrides, the change log, and frozen historical-settings snapshots) all live in their OWN separate localStorage keys, completely independent of the roster/rules/shift-preset config \u2014 so a new button in Settings ("\ud83e\uddf9 Reset test data before launch\u2026", next to Export/Backup) safely wipes ALL of these in one confirmed action without touching your roster or settings. <b>Staff availability/unavailability edits are a genuinely different case, explained honestly rather than glossed over:</b> those live inside each staff member's OWN record (st.avail/st.availDates/st.off/st.prefer), in the SAME config object as the roster this app has spent many rounds getting correct \u2014 there's no reliable way to automatically tell "a real availability fact" apart from "a test edit" once both are saved to the same person's record, so this reset deliberately does NOT touch them. If you made test availability edits, review and remove those manually (Settings \u2192 the \ud83d\udcc5 icon next to each affected staff member) before or after running this reset. <b>If you're connected to a live Supabase project:</b> this reset only clears your LOCAL browser copy \u2014 the live database keeps whatever was last pushed to it. Run this in the Supabase SQL Editor to clear the live tables too before launch (this does NOT touch <code>user_roles</code>, since that's real access-control setup, not test data):</p>

  <p class="small muted">Recommended order for a clean launch: (1) review and manually fix any test availability edits in Settings, (2) click "Reset test data before launch" locally, (3) if connected to Supabase, run the SQL above against the live project, (4) confirm the schedule/demand/leave tabs all show a clean, blank slate before sharing the link with staff.</p>
  <p><b>Concurrent editing:</b> Edits save per person-row, so two schedulers on different people/departments won\u2019t clash. If two people edit the <b>same</b> person\u2019s same week at once, the last save wins for that row \u2014 coordinate when jointly editing the same staff.</p>
  <p><b>Past-week settings:</b> Current and upcoming weeks always use the live settings, so a change made today (e.g. \u201cno Saturdays from this week\u201d) immediately flags the affected days. When a week rolls into the past it is <b>frozen</b> \u2014 a one-time snapshot of each person\u2019s availability/constraints is kept so history reflects the rules that were actually in effect then, not today\u2019s. Leave stamped onto the schedule stays on past weeks regardless.</p>
  <p><b>Data &amp; history:</b> Settings has Export/Import JSON, Save version + Version history (whole-week snapshots with restore), Auto-fill suggestions, and Export .xlsx in the hotel layout. History records whole-week snapshots with a timestamp/label; per-cell who-changed-what needs Auth (roadmap).</p>
  <p><b>Leave Requests tab:</b> Anyone \u2014 including view-only staff, in either department \u2014 can submit a leave request (department first, then a name dropdown filtered to that department's active staff only \u2014 reordered this round for a more natural flow) with code, dates, optional part-day times, reason, and an optional attachment, without needing the edit PIN. Every request appears immediately in the tab\u2019s list (newest first, with submission timestamp) and stays visible to everyone regardless of status, for transparency. <b>Submission-time dedupe check (new):</b> if the same person already has an overlapping request for any of the same dates (pending or approved), a confirmation shows the existing one(s) before letting the new one through \u2014 a non-blocking warning, since a legitimate reason to resubmit could exist (e.g. correcting an earlier request); any already-existing duplicates in the system are also caught passively as an Availability-conflicts Checks flag. <b>NEW this round \u2014 a distinct fairness/transparency check, sourced directly from a specific feature the hotel praised in the meeting transcript:</b> a Dayforce feature was described where a leave request shows "who put it in first" and "that there's other people requesting this day off... so they don't feel like there's any kind of favoritism." This is a genuinely DIFFERENT check from the dedupe above (which only looks at the SAME person's own overlapping requests) \u2014 submitting a request now also checks for OTHER staff members (same department) with an overlapping request for any status except denied, and lists them in submission order (oldest first) in the confirmation \u2014 directly matching the hotel's stated goal of visible fairness, not just duplicate-prevention. A submitted (pending) request auto-links into two places: the person\u2019s Availability summary in Settings (tagged "requested, pending approval") and a dashed amber outline + "REQ. LEAVE" marker on the covered schedule cells \u2014 neither blocks scheduling, but if the person is still scheduled to work during the requested window a "LEAVE REQUESTED" flag appears in Checks so it's never silently missed. Once a request is Denied, the amber marker and the flag both disappear automatically (they only ever look at pending requests) \u2014 the record stays visible in "All requests" but is no longer treated as an open concern. <b>Approving never erases an existing shift:</b> the leave code is stamped ONLY onto currently-blank/non-working days; if a day already has a working shift assigned, that assignment is left exactly as-is. <b>Upgraded this round to a hard block, matching the same severity as the existing OFF/Unavailable checks:</b> assigning (or re-assigning) a working shift on a day covered by an APPROVED leave request is now caught immediately in the shift editor itself \u2014 a red "Blocked" panel requiring a checked override + typed reason to save \u2014 rather than only being caught passively, after the fact, by a soft Checks-panel flag. That passive flag (also upgraded from amber to red, for consistency) remains as a safety net for any edit that bypasses the shift editor (e.g. import/paste).</p>
  <p><b>Leave request details:</b> the Type dropdown excludes <b>OFF</b> \u2014 OFF is assigned BY the hotel when manpower isn\u2019t needed, it isn\u2019t something staff request (CONFIRMED with the hotel: "our off is a request off... if it's off, then that means they can come in on their day off" \u2014 matching this app's existing R-OFF vs. OFF distinction). Part-day is only honored if BOTH a start and end time are actually entered; checking the box but leaving the times blank now submits as a full-day request instead of an ambiguous "00:00\u201300:00" part-day (a confirmation note explains this if it happens). The Name dropdown lists active staff only, across both departments. <b>Status and Actions are one merged column:</b> a decided request just shows its pill (Approved/Denied); a pending one shows a compact "Pending \u2014 decide\u2026" dropdown (Approve/Deny), sized to the row height so it never adds extra vertical space.</p>
  <p><b>Who can Approve/Deny \u2014 exactly how the gating works:</b> a request can only be decided by someone who currently holds <b>edit access to that specific request's department</b> (FO or HSK, whichever the request belongs to \u2014 matching this app's existing per-department edit-mode scoping), or a Supabase-configured manager (who has access to both). This means the department that matters is the <b>request's</b> department, not whichever schedule tab happens to be open \u2014 a fixed bug: this used to say "switch to {dept} edit mode," which was misleading, since simply clicking the FO or HSK tab doesn't itself confer edit rights; edit mode still has to be unlocked via the PIN (top-right lock button) or Supabase sign-in, per department, exactly as it always has for the schedule grid itself. To make this immediate rather than requiring a tab switch at all, a pending row you can't currently decide now runs the same PIN/Supabase check right from a click, scoped to that request's department, and the row updates in place once you're authorized. <b>Fixed — real bug found: "Approve/Deny doesn’t show up if an additional person requests leave":</b> the check previously only looked at whichever schedule tab’s edit session was CURRENTLY active (e.g. if Front Office was the most recently unlocked tab, it only ever recognized FO access) — so a request for the OTHER department (HSK) would incorrectly show no decision control even with valid, still-unlocked HSK access from earlier in the session. It now checks per-department stored access directly, so a request from either department shows its Approve/Deny correctly regardless of which schedule tab happens to be open. <b>REDESIGNED this round (per feedback: "some show a dropdown, some show a pill; prefer a pill until clicked... the 'get edit access' text isn't necessary, just clicking the pill should prompt the gate"):</b> every status \u2014 Approved, Denied, AND Pending \u2014 now always starts as a single compact pill, with no visible difference based on who's viewing it. Clicking a Pending pill is the ONE unified action: if you already have decide-access for that department, it reveals the Approve/Deny dropdown directly in place; if you don't yet have access, the click itself silently triggers the same PIN/Supabase gate (no separate "get access" link text needed, removing that clutter from every row), and the dropdown becomes available once authorized. A hover tooltip on the pill still explains that a department edit-access check applies, for anyone curious before clicking.</p>
  <p><b>NEW this round \u2014 Revoke (per feedback: "should leave request/status be revocable, deletable, and/or editable?"):</b> approving was previously a one-way ratchet with no way to undo a mistaken approval (wrong person, wrong dates, wrong code). Approved requests now show a small "Revoke" link (same department-edit-access gating as Approve/Deny) that cleanly reverses the approval: removes the availability block, and un-stamps the schedule cell ONLY where it still shows exactly the code that was originally stamped \u2014 any day since manually changed to something else is left untouched, same safe-clear pattern used elsewhere. The request returns to Pending (not deleted), so the full decision history stays visible in "All requests" and it can be re-approved or denied fresh. <b>Deliberately NOT the same as Deny:</b> Deny is for a request that should never have been valid in the first place; Revoke is for "this WAS correctly approved, but something changed." <b>Deleting or directly editing a request's fields was intentionally NOT added</b> \u2014 preserving every submitted request permanently (even a denied or later-revoked one) is what makes "All requests" a reliable, tamper-evident audit trail; allowing edits or deletion would undermine that. If a request was submitted with a genuine typo, the recommended path is Deny it and have the correct version resubmitted, keeping both the mistake and the correction visible in history.</p>
  <p><b>Direct answer, verified with dedicated unit tests \u2014 "can an FO-only Supabase user approve HSK leave? is cross-department approval blocked?":</b> <b>Cross-department approval IS blocked, confirmed.</b> A REGRESSION was found and re-fixed this round: the check had reverted to only recognizing Supabase's all-department "manager" flag, ignoring the same per-department SUPA_USER.fo/.hsk flags used everywhere else \u2014 meaning an FO-only Supabase user's Approve/Deny visibility for FO requests could have been inconsistent with their actual schedule-edit access. Now delegates to the exact same supaCanEdit() function already used for schedule editing, verified via unit test across all 3 cases: an FO-only user can decide FO requests but NOT HSK ones; an HSK-only user can decide HSK requests but NOT FO ones; a full "manager" can decide both. This applies once Supabase Auth roles are configured \u2014 today, with only the PIN system active, the equivalent per-department scoping already applies via EDIT_DEPT/EDITMEM.</p>

schedule tab (the row reading e.g. "\u25b6 Outsourced \u2014 JJ Global (off in Settings)") \u2014 you must first be in EDIT mode (unlock via the top-right lock button) for the toggle to appear; the toggle itself is the pill-styled "In use?" checkbox now shown at the right end of that same row. <b>What it does:</b> checking it turns that crew's weekly auto-stamped shifts (the Thu\u2013Sun 10:00\u201318:00 pattern) on; unchecking it turns them off and safely clears any already-auto-stamped (never manually edited) cells for that crew \u2014 identical behavior to the same checkbox in Settings \u2192 Rules & thresholds \u2192 "Outsourced crews \u2014 in use?". Fixed to be more discoverable: now styled as a colored pill (not plain text) with a hover tooltip explaining it mirrors the Settings control; and a plain-text hint ("toggle in Settings, or unlock edit mode") now shows in that same spot even outside EDIT mode, so the cell is never unexplained-blank.</li>

uinely current or if any of the three still has a real MW constraint the Excel hasn't caught up to. <b>FOUND AND FIXED a real bug this round (per feedback: her note was reported as still "too long," quoting text like "requested to work 11-3... supersedes an older MW off note, prefers ...2-10 pm" \u2014 the OLDER pre-fix text, not the short one this app's code already produces):</b> the note-shortening logic was correctly written, but gated behind a ONE-TIME migration flag ("_jessicaFix") that was almost certainly already set to true in this browser's saved data from BEFORE that note-shortening line was added \u2014 so the fix could write the short note in a brand-new browser, but could never reach an EXISTING browser that had already run the older version once. This is the classic "migration flag guards against re-running, but the underlying fix changed after the flag was already set" bug \u2014 the exact same pattern already handled correctly elsewhere in this app (e.g. the HSK coverage-minimum prefill uses a separate, later flag specifically so an improved default can still reach browsers that already ran an earlier version). Fixed the same way: a NEW, separate one-time flag now re-applies just the short note text, converging every existing browser to it regardless of whether the older flag is already stuck at true \u2014 verified with a dedicated test that reproduces the exact stuck-flag scenario.</li>

  <hr><details><summary style="cursor:pointer"><b>Build conventions</b> <span class="muted">(collapsed \u2014 click to expand)</span></summary>
  <ul class="small">
    <li><b>Capitalization:</b> all UI labels, buttons, tooltips, placeholders, and dropdown options start with a capital letter.</li>
    <li><b>Decimals:</b> dollar values show 2 decimals ($0.00); hours show 1 decimal (0.0h). Occupancy is a whole-number percent (0\u2013100%). Arrivals/departures/credits are whole numbers.</li>
    <li><b>Number restrictions:</b> apply common-sense bounds \u2014 hours 0\u201324, occupancy 0\u2013100, counts \u22650; clamp on entry. HSK room deductions (OOO/OOS, house-use, outsourced) are each 0\u2013421 and their <b>sum</b> cannot exceed total rooms (421); the last-entered value is capped so the sum stays \u2264421.</li>
    <li><b>Prefilled inputs are editable:</b> an auto-filled/estimated value must be selectable and backspaceable (place the caret, don\u2019t force overwrite).</li>
    <li><b>Checkboxes</b> are a consistent size app-wide; dropdowns show only valid options for the context (e.g. HSK zones are role-specific) plus an \u201cOther\u2026\u201d free-text fallback.</li>
    <li><b>Colour code:</b> OFF/R-OFF/PTO/LWOP/LOA = grey (rest/leave); On-call/Task Force/Project = blue; a typed shift or blank = white; a shift on an unavailable day = amber caution; hours over 40 = red from the crossover cell onward.</li>
    <li><b>Verification flags AND explanatory/implementation-reasoning asides</b> appear only in this Readme, never in the working tabs (Settings, Leave Requests, schedule, demand table). This covers not just PENDING/CONFIRMED tags but also parenthetical reasoning like "a plain '+' was removed since it could misread as X" \u2014 that kind of explanation belongs in the Readme's change log, not bolted onto a live Settings field where it adds clutter without helping day-to-day use.</li>
    <li><b>No native dialogs</b> (alert/confirm/prompt are blocked in sandboxes) \u2014 use the in-page modal helpers.</li>
    <li><b>Edit mode</b> is per-department and ends on refresh; the whole app opens view-only behind a PIN (Auth replaces this when configured).</li>
    <li><b>Weeks</b> run Thursday\u2013Wednesday by default (start day configurable in Settings, applies to both departments); current/future weeks always reflect live settings, past weeks use a frozen settings snapshot.</li>
    <li><b>Every change is validated headlessly</b> (the file must boot without throwing) before shipping.</li>
    <li><b>Borders &amp; corners:</b> all data tables use border-radius 8px with overflow:hidden and border-collapse:separate; border-spacing:0 (collapse leaves a 1px corner gap under a sticky header). Cards use 10px radius.</li>
    <li><b>Field heights</b> are uniform (30px) across inputs, selects, and buttons in a row; time/date/text/number fields must line up.</li>
    <li><b>Vertically align text within the same line</b> \u2014 found and fixed this round: any flex row mixing different-height content (e.g. a 16px checkbox+label next to a 30px input+label) must set the container's align-items:center explicitly. Flex's default (align-items:stretch) lets mismatched-height children stretch independently, so their actual text/checkbox baselines can land at visibly different vertical positions even though both are "the same row." (Root cause found this round: .mrow was missing align-items:center, unlike its sibling .cfgrow which already had it \u2014 fixed once, at the CSS level, rather than patching each affected row individually.)</li>
    <li><b>Schedule row height must stay standardized across every role section</b> \u2014 the name column must be wide enough that the single longest actual name+type-label combination in the roster fits on one line (currently 235px); do not let a narrow column force some roles' rows to wrap onto 2 lines while others stay on 1, since that produces visually inconsistent row heights across the same table purely from name length rather than any real content difference. <b>RE-INVESTIGATED this round</b> (still reported inconsistent even after the 235px width fix, specifically for Graveyard PA/Laundry\\u2011Uniform): compared every HSK role's header-row content length, the Floor/zone and Assignment dropdown conditionals, and staff notes \\u2014 found no code-level difference between these two roles and any other that would explain a height gap. Rather than continue guessing at an exact pixel width without being able to render actual browser layout to confirm, applied a more ROBUST fix regardless of root cause: the name+type-badge line itself is now hard-set to never wrap (nowrap + ellipsis fallback, full name always available via a hover tooltip), so row height can only ever vary based on genuinely different content actually being present (a note, a floor/zone dropdown) \\u2014 never based on how long someone's plain name happens to be.</li>
    <li><b>Dates are local (Guam / UTC+10):</b> never use toISOString() for a date key \u2014 build YYYY-MM-DD from local get*(); UTC shifts the day and breaks stamping.</li>
    <li><b>PIN prompt:</b> a click anywhere on the schedule/occupancy in view-only opens the PIN once (owned by a single document-level handler; disabled inputs use pointer-events:none so the click passes through). Edit mode is per-department \u2014 unlocking FO must not unlock HSK, and vice-versa.</li>
    <li><b>De-dup redundancies:</b> a single source of truth per behaviour (one lock control, one leave module, one PIN handler, one demand-input handler) \u2014 avoid duplicate sections/handlers that double-fire or double-render.</li>
    <li><b>Sticky header</b> (grid thead) uses position:sticky; do NOT put overflow:hidden on the table (clips sticky) \u2014 round the scroll wrapper instead.</li>
    <li><b>Demand cells must not clip</b> \u2014 the metric/occupancy labels wrap to two lines; keep line-height ~1.25 with vertical padding and never wrap them in overflow:hidden. A rounded overflow:hidden wrapper clipped the top of \u201cOccupancy %\u201d. Final fix: the demand table header must not be position:sticky (it inherited the global thead sticky and overlapped the first data row); force #demandBody thead th to position:static and add vertical padding on td.demand.</li>
    <li><b>Sticky-cell borders</b> \u2014 with a sticky header or first column, a cell\u2019s real border on the sticky edge can drop (when scrolled) or double against a box-shadow, causing an offset/thick line and a missing line under the Staff row. Fix: keep border-collapse:separate, draw the sticky edge with box-shadow only, and remove the real border on that edge so nothing stacks.</li>
    <li><b>Punctuation:</b> em-dash (\u2014) with spaces for asides; no serial-comma tables; use a colon only to introduce a value inline, not on standalone headers; parentheses for supplementary notes; sentence case for all UI text.</li></ul></details>
  <p class="muted">Version ${APP_VERSION}.</p>`;

// FOUND a real gap this round (per feedback: "ensure settings editing is gated properly"): previously this
// function unconditionally switched SETDEPT to whatever department was clicked, with NO check at all — meaning
// anyone currently in EDIT mode for EITHER department (e.g. someone who only unlocked FO) could freely switch to
// HSK here and edit its entire roster, coverage minimums, and rules, despite never having HSK edit access. Every
// OTHER access point in this app (schedule editing, leave-request decisions) is correctly department-scoped; this
// was the one place that wasn't. Fixed the same way as leave-request decisions: canEditSettingsFor(dept) checks
// per-department access (EDITMEM for PIN users, supaCanEdit() for Supabase users, same functions already used
// elsewhere) before allowing the switch; if not yet authorized, this now runs the SAME PIN/Supabase gate used by
// requestEditAccessForDept() rather than silently allowing the switch or silently refusing with no path forward.
function canEditSettingsFor(dept){
  if(SUPA_USER)return !!supaCanEdit(dept);
  return !!EDITMEM[dept];
}
async function setSetDept(d){
  if(d===SETDEPT){renderSettings();return;}
  if(canEditSettingsFor(d)){SETDEPT=d;renderSettings();return;}
  if(SUPA_USER){
    if(!supaCanEdit(d)){uiAlert(SUPA_USER.email+" does not have edit access to "+CFG[d].label+" settings.");return;}
    EDITMEM[d]={name:SUPA_USER.email,role:SUPA_USER.role};SETDEPT=d;renderSettings();return;
  }
  const pin=await uiPrompt("Enter your PIN to edit "+CFG[d].label+" settings:","");
  if(pin===null||pin==="Cancel")return;
  const u=userByPin(pin);
  if(!u){uiAlert("PIN not recognized.");return;}
  if(u.role==="viewer"){uiAlert(u.name+" has view-only access.");return;}
  EDITMEM[d]=u;SETDEPT=d;renderSettings();
}
function addStaffRow(){CFG[SETDEPT].staff.push({n:"New person",role:CFG[SETDEPT].roles[0],type:"FT"});save("hotel_cfg",CFG);renderSettings();setTimeout(()=>{const rows=el("settingsBody").querySelectorAll("table tr");const last=rows[rows.length-1];if(last)last.scrollIntoView({behavior:"smooth",block:"center"});const nm=last&&last.querySelector("input");if(nm){nm.focus();nm.select();}},60);}
async function removeStaffRow(i){const st=CFG[SETDEPT].staff[i];if(!(await uiConfirm("Mark "+st.n+" as no longer employed?\n\nThey stay in past weeks (history is preserved) and move to \u2018Former staff\u2019. They will not appear on new schedules.")))return;st.employed=false;st.inactiveSince=weekKey(new Date());save("hotel_cfg",CFG);renderSettings();}
function reEmploy(name){const st=CFG[SETDEPT].staff.find(x=>x.n===name);if(st){st.employed=true;delete st.inactiveSince;save("hotel_cfg",CFG);renderSettings();}}
function saveShifts(){const arr=el("shiftBox").value.split(",").map(x=>x.trim()).filter(Boolean);CFG[SETDEPT].shifts=arr;save("hotel_cfg",CFG);uiAlert("Default shifts saved for "+CFG[SETDEPT].label+".");}
function connectFromSettings(){if(el("supaUrl"))el("supaUrl").value=el("supaUrl2").value;if(el("supaKey"))el("supaKey").value=el("supaKey2").value;connect();}
async function supaLogin(){
  if(!DB){uiAlert("Connect the Supabase project first (URL + anon key).");return;}
  const email=await uiPrompt("Supabase login \u2014 email:","");if(!email||email==="Cancel")return;
  const pw=await uiPrompt("Password:","");if(pw===null||pw==="Cancel")return;
  try{const {data,error}=await DB.auth.signInWithPassword({email:email.trim(),password:pw});
    if(error){uiAlert("Login failed: "+error.message);return;}
    const uid=data.user.id;
    let {data:rows,error:qerr}=await DB.from("user_roles").select("*").eq("id",uid);
    if((!rows||!rows.length)){const r2=await DB.from("user_roles").select("*").eq("email",email.trim());rows=r2.data;if(r2.error)qerr=r2.error;}
    if(qerr){uiAlert("Signed in, but couldn't read your role: "+qerr.message+"\n\nCheck the user_roles RLS policy.");}
    const r=(rows&&rows[0])||{role:"viewer"};
    SUPA_USER={email:email.trim(),role:r.role||"viewer",fo:!!r.can_edit_fo,hsk:!!r.can_edit_hsk,fos:!!r.can_edit_fo_settings,hsks:!!r.can_edit_hsk_settings,manager:(r.role==="manager")};
    updateAuth();uiAlert("Signed in as "+email.trim()+"\nRole: "+(r.role||"viewer")+(r.can_edit_fo?" \u00b7 FO":"")+(r.can_edit_hsk?" \u00b7 HSK":"")+((r.role==="manager")?" \u00b7 (manager: all)":""));render();
  }catch(e){uiAlert("Login error: "+e.message);}
}
async function supaLogout(){if(DB&&DB.auth)await DB.auth.signOut();SUPA_USER=null;EDIT=false;CURRENT_USER=null;updateAuth();uiAlert("Signed out.");}
function supaCanEdit(dept){if(!SUPA_USER)return null;if(SUPA_USER.manager)return true;return dept==="HSK"?SUPA_USER.hsk:SUPA_USER.fo;}
function setPin(){const v=el("pinBox").value.trim()||"1234";CFG.editPin=v;save("hotel_cfg",CFG);uiAlert("PIN saved.");}
function setWeekStart(v){const idx=parseInt(v,10);if(isNaN(idx)||idx<0||idx>6)return;CFG.weekStartDow=idx;save("hotel_cfg",CFG);rebuildWeekStart();uiAlert("Workweek now runs "+DOW[0]+"\u2192"+DOW[6]+". This also shifts the overtime week boundary.");render();}

  // builds a single, clean annotation regardless of whether a reason was typed, with no embedded parens of its
  // own (the ONE set of parens the tooltip code adds is now the only one).

  // CELL itself already correctly shows just the short code (e.g. "R-OFF"); this text only ever appears as a

  // conflict" flag in Checks (Availability conflicts) already detects exactly this case (an approved request whose
  // dates still show a working assignment) and will surface it in red for a human to resolve manually.

  try{["FO","HSK"].forEach(dp=>{const savedDept=DEPT;DEPT=dp;const ws=mondayOfWeekStartThu(new Date());for(let k=1;k<=8;k++){const d=new Date(ws);d.setDate(d.getDate()-7*k);const wk=weekKey(d);if(!((SETHIST[dp]||{})[wk])){const _cur=WEEK_START;WEEK_START=d;snapshotSettings(dp,wk);WEEK_START=_cur;}}DEPT=savedDept;});}catch(e){}
  const saved=load("hotel_supa",null);
  if(saved){el("supaUrl").value=saved.url;el("supaKey").value=saved.key;connect();}
  syncNav();render();fitHeader();
})();
